<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>現在位置自動共有君 Version 2.3</title>


<!-- ==================================================
     Leaflet
================================================== -->

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;

    background:#f2f2f2;

}


/* ==================================================
   Auth
================================================== */

#authScreen{

    display:none;

    position:fixed;

    inset:0;

    justify-content:center;
    align-items:center;

    background:#f2f2f2;

    z-index:9999;

}


.authBox{

    width:min(420px,92vw);

    background:white;

    padding:25px;

    border-radius:14px;

    box-shadow:
        0 4px 20px
        rgba(0,0,0,.18);

}


.authBox h2,
.authBox h3{

    text-align:center;

}


.authBox input{

    width:100%;

    padding:13px;

    margin:6px 0;

    border:
        1px solid #ccc;

    border-radius:8px;

    font-size:16px;

}


.authBox button{

    width:100%;

    padding:12px;

    margin-top:8px;

    border:0;

    border-radius:8px;

    background:#1976d2;

    color:white;

    font-size:16px;

    cursor:pointer;

}


.authBox button:last-of-type{

    background:#666;

}


#loginMessage,
#registerMessage{

    margin-top:12px;

    text-align:center;

    min-height:24px;

}


/* ==================================================
   App
================================================== */

#appScreen{

    display:none;

    width:100%;
    min-height:100vh;

}


/* ==================================================
   タブ
================================================== */

.tabButtons{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:2px;

    background:#222;

}


.tabButton{

    border:0;

    padding:10px 4px;

    background:#444;

    color:white;

    cursor:pointer;

    font-size:14px;

}


.tabButton.active{

    background:#1976d2;

}


.tabIcon{

    display:block;

    font-size:20px;

}


.tabText{

    display:block;

}


/* ==================================================
   タブ内容
================================================== */

.tabContent{

    display:none;

    padding:8px;

}


.tabContent.active{

    display:block;

}


/* ==================================================
   地図
================================================== */

#map{

    width:100%;

    height:
        calc(100vh - 155px);

    min-height:400px;

    border-radius:8px;

}


.gpsButtonRow{

    display:flex;

    gap:8px;

    margin-top:8px;

}


.gpsButton,
.reportButton{

    flex:1;

    padding:12px;

    border:0;

    border-radius:8px;

    color:white;

    font-size:16px;

}


.gpsButton{

    background:#1976d2;

}


.reportButton{

    background:#388e3c;

}


#gpsStatus,
#lastSend{

    text-align:center;

    margin-top:5px;

    font-size:13px;

}


/* ==================================================
   共通カード
================================================== */

.card{

    background:white;

    border-radius:10px;

    padding:12px;

    margin-bottom:10px;

    box-shadow:
        0 1px 5px
        rgba(0,0,0,.12);

}


.sectionTitle{

    font-size:18px;

    font-weight:bold;

    margin-bottom:10px;

}


/* ==================================================
   入力
================================================== */

.inputRow{

    display:flex;

    gap:8px;

    margin-bottom:8px;

}


.inputRow > *{

    flex:1;

}


input,
select{

    width:100%;

    padding:10px;

    border:
        1px solid #bbb;

    border-radius:7px;

    font-size:15px;

}


.settingsButton{

    width:100%;

    padding:11px;

    margin-top:8px;

    border:0;

    border-radius:8px;

    background:#1976d2;

    color:white;

    font-size:15px;

}


#registerStatus{

    margin-top:8px;

    text-align:center;

}


/* ==================================================
   ユーザー一覧
================================================== */

.userHeader,
.userRow{

    display:grid;

    grid-template-columns:
        55px
        minmax(80px,1fr)
        55px
        60px
        65px
        45px;

    align-items:center;

}


.userHeader{

    background:#333;

    color:white;

    padding:7px;

    font-size:12px;

}


.userRow{

    background:white;

    border-bottom:
        1px solid #ddd;

    padding:8px 5px;

    font-size:13px;

}


.userRow > div{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


.deleteButton{

    border:0;

    background:none;

    cursor:pointer;

    font-size:18px;

}


/* ==================================================
   クロノロジー
================================================== */

.chronoInputRow{

    display:flex;

    gap:6px;

}


.chronoInputRow input{

    flex:1;

}


#chronoSendButton{

    border:0;

    border-radius:7px;

    background:#1976d2;

    color:white;

}


.timelineItem{

    background:white;

    padding:8px;

    margin-top:7px;

    border-left:
        4px solid #1976d2;

    border-radius:5px;

}


.timelineTime{

    font-size:11px;

    color:#666;

}


.timelineMessage{

    margin-top:3px;

}


/* ==================================================
   地点
================================================== */

.pointButtonRow{

    display:flex;

    gap:8px;

    margin-top:8px;

}


.pointButtonRow button{

    flex:1;

    padding:10px;

    border:0;

    border-radius:7px;

    background:#1976d2;

    color:white;

}


.pointButtonRow button:last-child{

}


.pointInfo{

    margin-top:10px;

    padding:10px;

    background:#f5f5f5;

    border-radius:7px;

    line-height:1.8;

}


/* ==================================================
   地点ラベル
================================================== */

.pointLabel{

    background:white;

    border-radius:4px;

/* ==================================================
   フッター
================================================== */

.footer{

}


.footer a{

/* ==================================================
   交通規制
================================================== */

/* ==================================================
   スマホ
================================================== */

@media(max-width:600px){

    .tabButton{

    }


    .userHeader,
    .userRow{

            45px
            minmax(65px,1fr)
            45px
            50px
            55px
            40px;

    }

}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


//==================================================
// Supabase
//==================================================

const SUPABASE_URL =
    "https://seqqgkryrhcvmxnwyybr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_pUI0REFogJSgZYs3OJepEQ_Zl27Iw73";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


//==================================================
// グローバル
//==================================================

let currentAuthUser =
    null;

let currentUsername =
    null;

let profileLoaded =
    false;

let registered =
    false;

let markers =
    {};

let pointMarkers =
    {};

let chronology =
    [];

let watchID =
    null;

let gpsTimer =
    null;

let lastLat =
    0;

let lastLon =
    0;

let lastSendTime =
    0;

let map =
    null;

let selectedPointLat =
    null;

let selectedPointLon =
    null;

let selectedPointName =
    null;

let trafficRegulationLayer =
    null;


const SEND_INTERVAL =
    30000;


const MOVE_DISTANCE =
    10;


//==================================================
// 任意ログインID → 内部メールアドレス
//==================================================
//
// Supabase Authはemail形式を要求するため、
// ユーザーが入力した任意文字列を内部的に
// email形式へ変換する。
//
// 実際のメール送信には使用しない。
// Confirm email OFF を前提とする。
//

function usernameToEmail(username){

    return (
        username
        .trim()
        .toLowerCase()
        +
        "@puttan.local"
    );

}


//==================================================
// Auth画面
//==================================================

function showLogin(){

    const loginBox =
        document.getElementById(
            "loginBox"
        );

    const registerBox =
        document.getElementById(
            "registerBox"
        );


    if(loginBox){

        loginBox.style.display =
            "block";

    }


    if(registerBox){

        registerBox.style.display =
            "none";

    }

}


function showRegister(){

    const loginBox =
        document.getElementById(
            "loginBox"
        );

    const registerBox =
        document.getElementById(
            "registerBox"
        );


    if(loginBox){

        loginBox.style.display =
            "none";

    }


    if(registerBox){

        registerBox.style.display =
            "block";

    }

}


//==================================================
// ログイン
//==================================================

async function loginUser(){

    const username =
        document.getElementById(
            "loginUsername"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "loginPassword"
        )
        .value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!username || !password){

        message.textContent =
            "ログインIDとパスワードを入力してください";

        return;

    }


    message.textContent =
        "ログイン中...";


    try{

        const email =
            usernameToEmail(
                username
            );


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        if(error){

            console.error(
                "ログインエラー:",
                error
            );

            message.textContent =
                "ログインに失敗しました：" +
                error.message;

            return;

        }


        currentAuthUser =
            data.user;


        currentUsername =
            username;


        console.log(
            "ログイン成功:",
            data.user.id
        );


        const profileOK =
            await loadProfile(
                data.user
            );


        if(!profileOK){

            message.textContent =
                "プロフィールを取得できませんでした";

            return;

        }


        registered =
            true;


        showApp();


        await registerSocketUser();


    }
    catch(error){

        console.error(
            error
        );

        message.textContent =
            "ログイン処理でエラーが発生しました";

    }

}


//==================================================
// 新規Auth登録
//==================================================

async function registerAuthUser(){

    const username =
        document.getElementById(
            "registerUsername"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "registerPassword"
        )
        .value;


    const password2 =
        document.getElementById(
            "registerPassword2"
        )
        .value;


    const message =
        document.getElementById(
            "registerMessage"
        );


    if(!username){

        message.textContent =
            "ログインIDを入力してください";

        return;

    }


    if(!password){

        message.textContent =
            "パスワードを入力してください";

        return;

    }


    if(password !== password2){

        message.textContent =
            "パスワードが一致しません";

        return;

    }


    if(username.length < 3){

        message.textContent =
            "ログインIDは3文字以上にしてください";

        return;

    }


    message.textContent =
        "アカウント作成中...";


    try{

        const email =
            usernameToEmail(
                username
            );


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signUp({

                    email:
                        email,

                    password:
                        password

                });


        if(error){

            console.error(
                "Auth登録エラー:",
                error
            );

            message.textContent =
                "登録に失敗しました：" +
                error.message;

            return;

        }


        if(!data.user){

            message.textContent =
                "Authユーザーを作成できませんでした";

            return;

        }


        console.log(
            "Auth登録成功:",
            data.user.id
        );


        /*
         * profilesはINSERTではなくUPSERT。
         * idをAuthユーザーIDにすることで
         * duplicate keyを回避する。
         */

        const {
            error:
                profileError
        } =
            await supabaseClient
                .from("profiles")
                .upsert(

                    {

                        id:
                            data.user.id,

                        username:
                            username

                    },

                    {

                        onConflict:
                            "id"

                    }

                );


        if(profileError){

            console.error(
                "プロフィール登録エラー:",
                profileError
            );

            message.textContent =
                "Auth登録は成功しましたが、プロフィール登録に失敗しました：" +
                profileError.message;

            return;

        }


        message.textContent =
            "登録しました。ログインしてください。";


        document.getElementById(
            "registerUsername"
        ).value = "";


        document.getElementById(
            "registerPassword"
        ).value = "";


        document.getElementById(
            "registerPassword2"
        ).value = "";


        setTimeout(
            ()=>{

                showLogin();

                document.getElementById(
                    "loginUsername"
                ).value =
                    username;

            },
            500
        );

    }
    catch(error){

        console.error(
            error
        );

        message.textContent =
            "登録処理でエラーが発生しました";

    }

}


//==================================================
// プロフィール取得
//==================================================

async function loadProfile(user){

    if(!user){

        return false;

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if(error){

            console.error(
                "プロフィール取得エラー:",
                error
            );

            /*
             * profilesがまだ無い場合でも、
             * Authユーザーから最低限の情報を作る。
             */

            const username =
                currentUsername ||
                user.email
                    .split("@")[0];


            const {
                error:
                    upsertError
            } =
                await supabaseClient
                    .from("profiles")
                    .upsert(

                        {

                            id:
                                user.id,

                            username:
                                username

                        },

                        {

                            onConflict:
                                "id"

                        }

                    );


            if(upsertError){

                console.error(
                    "プロフィール作成エラー:",
                    upsertError
                );

                return false;

            }


            currentUsername =
                username;

            profileLoaded =
                true;

            return true;

        }


        const profile =
            data;


        if(profile){

            currentUsername =
                profile.username ||
                currentUsername ||
                user.email
                    .split("@")[0];


            /*
             * profilesに保存されている使用者情報が
             * あれば画面へ復元。
             */

            setProfileValue(
                "name",
                profile.name
            );


            setProfileValue(
                "water",
                profile.water
            );


            setProfileValue(
                "fuel",
                profile.fuel
            );


            setProfileValue(
                "destination",
                profile.destination
            );


            setProfileValue(
                "iconType",
                normalizeIconType(
                    profile.icon_type ||
                    profile.iconType
                )
            );

        }
        else{

            currentUsername =
                currentUsername ||
                user.email
                    .split("@")[0];

        }


        /*
         * ローカル保存値も補助的に復元。
         */

        restoreLocalUser();


        profileLoaded =
            true;


        return true;

    }
    catch(error){

        console.error(
            error
        );

        return false;

    }

}

async function initializeApplication(){

     * 起動時は両方を非表示。
     * これにより「ログイン画面が一瞬出る」
     * 問題を防止する。
     */

    document.getElementById(
        "authScreen"
    ).style.display =
        "none";


    document.getElementById(
        "appScreen"
    ).style.display =
        "none";


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if(error){

            console.error(
                "セッション取得エラー:",
                error
            );

        }


        if(
            data &&
            data.session &&
            data.session.user
        ){

            currentAuthUser =
                data.session.user;


            console.log(
                "ログイン済み:",
                currentAuthUser.id
            );


            const profileOK =
                await loadProfile(
                    currentAuthUser
                );


            if(profileOK){

                registered =
                    true;

                showApp();

                await registerSocketUser();

                /*
                 * GPS自動再開
                 */

                if(
                    localStorage.getItem(
                        "gpsRunning"
                    ) === "true"
                ){

                    setTimeout(
                        ()=>{

                            startGPS();

                        },
                        800
                    );

                }

            }
            else{

                await supabaseClient
                    .auth
                    .signOut();

                showLoginScreen();

            }

        }
        else{

            showLoginScreen();

        }

    }
    catch(error){

        console.error(
            "起動エラー:",
            error
        );

        showLoginScreen();

    }

}

//==================================================
// アイコン種類
//==================================================

function normalizeIconType(type){

    type =
        String(
            type || ""
        );


    if(type === "person"){

        return "1";

    }


    if(type === "vehicle"){

        return "2";

    }


    if(
        ["1","2","3","4"]
        .includes(type)
    ){

        return type;

    }


    return "1";

}

function restoreLocalUser(){

    [

        "name",
        "water",
        "fuel",
        "destination",
        "iconType"

    ]
    .forEach(
        key=>{

            const value =
                localStorage.getItem(
                    key
                );


            if(value !== null){

                const element =
                    document.getElementById(
                        key
                    );


                if(element){

                    if(
                        key === "iconType"
                    ){

                        element.value =
                            normalizeIconType(
                                value
                            );

                    }
                    else{

                        element.value =
                            value;

                    }

                }

            }

        }
    );


    const iconElement =
        document.getElementById(
            "iconType"
        );


    if(
        iconElement &&
        !localStorage.getItem(
            "iconType"
        )
    ){

        iconElement.value =
            "1";

        localStorage.setItem(
            "iconType",
            "1"
        );

    }

}

                    .addLayer(

//==================================================
// GPS開始
//==================================================

function startGPS(){

    if(
        !currentAuthUser ||
        !profileLoaded
    ){

        alert(
            "先にログインしてください"
        );

        return;

    }


    if(!registered){

        alert(
            "先にユーザー登録してください"
        );

        return;

    }


    if(
        !navigator.geolocation
    ){

        alert(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    localStorage.setItem(
        "gpsRunning",
        "true"
    );


    if(
        watchID !== null
    ){

        return;

    }


    document.getElementById(
        "gpsStatus"
    )
    .innerHTML =
        "🟡 GPS取得中";


    gpsTimer =
        setInterval(
            ()=>{

                navigator.geolocation
                    .getCurrentPosition(

                        pos=>{

                            sendLocation(

                                pos.coords.latitude,
                                pos.coords.longitude

                            );

                        },

                        err=>{

                            console.log(
                                "GPSタイマーエラー",
                                err
                            );

                        },

                        {

                            enableHighAccuracy:
                                true,

                            timeout:
                                10000,

                            maximumAge:
                                0

                        }

                    );

            },
            30000
        );


    watchID =
        navigator.geolocation
            .watchPosition(

                pos=>{

                    const lat =
                        pos.coords.latitude;


                    const lon =
                        pos.coords.longitude;


                    if(lastLat === 0){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat =
                            lat;


                        lastLon =
                            lon;


                        lastSendTime =
                            Date.now();


                        return;

                    }


                    const distance =
                        getDistance(

                            lastLat,
                            lastLon,

                            lat,
                            lon

                        );


                    const now =
                        Date.now();


                    if(
                        distance >=
                            MOVE_DISTANCE
                        ||
                        now -
                        lastSendTime >=
                            SEND_INTERVAL
                    ){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat =
                            lat;


                        lastLon =
                            lon;


                        lastSendTime =
                            now;

                    }

                },


                err=>{

                    console.log(
                        "GPSエラー",
                        err
                    );


                    document.getElementById(
                        "gpsStatus"
                    )
                    .innerHTML =
                        "🔴 GPS取得エラー";

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        10000,

                    maximumAge:
                        0

                }

            );

}


//==================================================
// GPS停止
//==================================================

function stopGPS(){

    if(
        watchID !== null
    ){

        navigator.geolocation
            .clearWatch(
                watchID
            );

        watchID =
            null;

    }


    if(
        gpsTimer !== null
    ){

        clearInterval(
            gpsTimer
        );

        gpsTimer =
            null;

    }


    lastLat =
        0;


    lastLon =
        0;


    lastSendTime =
        0;


    localStorage.setItem(
        "gpsRunning",
        "false"
    );


    const gpsStatus =
        document.getElementById(
            "gpsStatus"
        );


    if(gpsStatus){

        gpsStatus.innerHTML =
            "🔴 GPS停止中";

    }

}


//==================================================
// GPS送信
//==================================================

function sendLocation(
    lat,
    lon
){

    if(
        !registered ||
        !currentAuthUser
    ){

        return;

    }


    const utm =
        proj4(

            "EPSG:4326",

            "+proj=utm +zone=52 +south +datum=WGS84",

            [
                lon,
                lat
            ]

        );


    const utmE =
        Math.round(
            utm[0]
        );


    const utmN =
        Math.round(
            utm[1]
        );


    const name =
        document.getElementById(
            "name"
        )
        .value
        .trim();


    const water =
        Number(
            document.getElementById(
                "water"
            )
            .value
        );


    const fuel =
        Number(
            document.getElementById(
                "fuel"
            )
            .value
        );


    const destination =
        document.getElementById(
            "destination"
        )
        .value;


    const iconType =
        normalizeIconType(
            document.getElementById(
                "iconType"
            )
            .value
        );


    if(!name){

        return;

    }


    localStorage.setItem(
        "name",
        name
    );


    localStorage.setItem(
        "water",
        water
    );


    localStorage.setItem(
        "fuel",
        fuel
    );


    localStorage.setItem(
        "destination",
        destination
    );


    localStorage.setItem(
        "iconType",
        iconType
    );


    const gpsStatus =
        document.getElementById(
            "gpsStatus"
        );


    if(gpsStatus){

        gpsStatus.innerHTML =
            "🟢 GPS稼働中";

    }


    const lastSend =
        document.getElementById(
            "lastSend"
        );


    if(lastSend){

        lastSend.innerHTML =
            "最終送信：" +
            new Date()
            .toLocaleTimeString();

    }


    socket.emit(
        "location",
        {

            name:
                name,

            lat:
                lat,

            lon:
                lon,

            utmZone:
                "52S",

            utmE:
                utmE,

            utmN:
                utmN,

            water:
                water,

            fuel:
                fuel,

            destination:
                destination,

            iconType:
                iconType

        }
    );

}

function updateStatus(){

    if(!registered){

        alert(

        );

        return;

    }


    navigator.geolocation
        .getCurrentPosition(

            pos=>{

                sendLocation(

                    pos.coords.latitude,

                    pos.coords.longitude

                );

            },

            err=>{

                console.log(
                    err
                );


                alert(
                    "現在地を取得できませんでした"
                );

            },

            {

                enableHighAccuracy:
                    true,

                timeout:
                    10000,

                maximumAge:
                    0

            }

        );

}


//==================================================
// 距離計算
//==================================================

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;


    const dLat =
        (
            lat2 -
            lat1
        )
        *
        Math.PI /
        180;


    const dLon =
        (
            lon2 -
            lon1
        )
        *
        Math.PI /
        180;


    const a =
        Math.sin(
            dLat / 2
        ) ** 2
        +
        Math.cos(
            lat1 *
            Math.PI /
            180
        )
        *
        Math.cos(
            lat2 *
            Math.PI /
            180
        )
        *
        Math.sin(
            dLon / 2
        ) ** 2;


    return R *
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1 - a
            )

        );

}

//==================================================
// アイコン
//==================================================

function createIcon(type){

    type =
        normalizeIconType(
            type
        );


    let image;


    switch(type){

        case "1":

            image =
                "/icon/person.png";

            break;


        case "2":

            image =
                "/icon/vehicle_small.png";

            break;


        case "3":

            image =
                "/icon/vehicle_medium.png";

            break;


        case "4":

            image =
                "/icon/vehicle_large.png";

            break;


        default:

            image =
                "/icon/person.png";

            break;

    }


    return L.icon({

        iconUrl:
            image,

        iconSize:
            [60,60],

        iconAnchor:
            [30,60],

        popupAnchor:
            [0,-70]

    });

}

//==================================================
// HTML安全化
//==================================================

function escapeHtml(value){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeHtmlAttribute(value){

    return String(
        value
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}

function focusUser(name){

    if(!markers[name]){

        return;

    }


    const pos =
        markers[name]
        .getLatLng();


    map.setView(

        [
            pos.lat,
            pos.lng
        ],

        17,

        {

            animate:
                true

        }

    );


    markers[name]
        .openPopup();

}

//==================================================
// 最終更新時間
//==================================================

function timeAgo(t){

    if(!t){

        return "-";

    }


    const sec =
        Math.floor(
            (
                Date.now() -
                t
            ) /
            1000
        );


    if(sec < 60){

        return sec +
            "秒前";

    }


    const min =
        Math.floor(
            sec /
            60
        );


    if(min < 60){

        return min +
            "分前";

    }


    return (
        Math.floor(
            min /
            60
        )
        +
        "時間前"
    );

}

    }


    if(
        selectedPointLat === null
    ){

        alert(
            "先に地図をクリックして登録位置を選択してください"
        );

        return;

    }


    const name =
        document.getElementById(
            "pointName"
        )
        .value
        .trim();


    if(name === ""){

        alert(
            "地点名を入力してください"
        );

        return;

    }


    socket.emit(
        "addPoint",
        {

            name:
                name,

            type:
                document.getElementById(
                    "pointType"
                )
                .value,

            lat:
                selectedPointLat,

            lon:
                selectedPointLon

        }
    );


    selectedPointName =
        name;


    document.getElementById(
        "pointName"
    )
    .value =
        "";

}

        alert(
            "削除する地点を選択してください"

    if(

    socket.emit(

    );


    selectedPointName =

}
