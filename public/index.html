<script>


//==================================================
// Supabase

const SUPABASE_URL =
    "https://seqqgkryrhcvmxnwyybr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_pUI0REFogJSgZYs3OJepEQ_Zl27Iw73";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


//==================================================
// ログインID → 内部メール形式
//
// Supabase Auth は email 形式を要求するため、
// 画面ではログインIDだけを使用し、
// 内部的に変換する。
//==================================================

function loginIdToEmail(loginId){

    const bytes =
        new TextEncoder()
            .encode(loginId);


    let binary = "";


    bytes.forEach(
        byte=>{
            binary +=
                String.fromCharCode(byte);
        }
    );


    const encoded =
        btoa(binary)
            .replace(/\+/g,"-")
            .replace(/\//g,"_")
            .replace(/=+$/,"");


    return (
        "id_" +
        encoded +
        "@puttan.local"
    );

}


//==================================================
// Supabase Auth ログイン
//==================================================

async function loginUser(){

    const loginId =
        document.getElementById(
            "loginId"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "loginPassword"
        )
        .value;


    if(!loginId || !password){

        document.getElementById(
            "loginMessage"
        ).textContent =
            "ログインIDとパスワードを入力してください";

        return;

    }


    document.getElementById(
        "loginMessage"
    ).textContent =
        "ログイン中...";


    const email =
        loginIdToEmail(loginId);


    const {
        data,
        error
    } =
        await supabaseClient.auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


    if(error){

        console.error(
            "ログインエラー:",
            error
        );


        document.getElementById(
            "loginMessage"
        ).textContent =
            "ログインに失敗しました";


        return;

    }


    localStorage.setItem(
        "loginId",
        loginId
    );


    await loadProfile(
        data.user
    );


    showApp();

}


//==================================================
// 新規アカウント登録
//==================================================

async function registerAuthUser(){

    const loginId =
        document.getElementById(
            "registerId"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "registerPassword"
        )
        .value;


    const password2 =
        document.getElementById(
            "registerPassword2"
        )
        .value;


    if(!loginId || !password){

        document.getElementById(
            "registerMessage"
        ).textContent =
            "ログインIDとパスワードを入力してください";

        return;

    }


    if(loginId.length < 1){

        document.getElementById(
            "registerMessage"
        ).textContent =
            "ログインIDを入力してください";

        return;

    }


    if(password.length < 6){

        document.getElementById(
            "registerMessage"
        ).textContent =
            "パスワードは6文字以上にしてください";

        return;

    }


    if(password !== password2){

        document.getElementById(
            "registerMessage"
        ).textContent =
            "パスワードが一致しません";

        return;

    }


    document.getElementById(
        "registerMessage"
    ).textContent =
        "アカウント作成中...";


    const email =
        loginIdToEmail(loginId);


    const {
        data,
        error
    } =
        await supabaseClient.auth
            .signUp({

                email:
                    email,

                password:
                    password

            });


    if(error){

        console.error(
            "アカウント登録エラー:",
            error
        );


        document.getElementById(
            "registerMessage"
        ).textContent =
            "登録に失敗しました：" +
            error.message;

        return;

    }


    if(!data.user){

        document.getElementById(
            "registerMessage"
        ).textContent =
            "アカウント登録に失敗しました";

        return;

    }


    //==================================================
    // profiles登録
    //==================================================

    const {
        error:
            profileError
    } =
        await supabaseClient
            .from("profiles")
            .insert({

                user_id:
                    data.user.id,

                display_name:
                    loginId,

                icon_type:
                    "1",

                role:
                    "user"

            });


    if(profileError){

        console.error(
            "profiles登録エラー:",
            profileError
        );

        // Authだけ作成された場合は、
        // エラー内容を表示する
        document.getElementById(
            "registerMessage"
        ).textContent =
            "Auth登録は成功しましたが、プロフィール登録に失敗しました：" +
            profileError.message;

        return;

    }


    document.getElementById(
        "registerMessage"
    ).textContent =
        "登録しました。ログインしてください。";


    document.getElementById(
        "registerId"
    ).value = "";


    document.getElementById(
        "registerPassword"
    ).value = "";


    document.getElementById(
        "registerPassword2"
    ).value = "";


    showLogin();

}


//==================================================
// プロフィール取得
//==================================================

async function loadProfile(user){

    if(!user){

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();


    if(error){

        console.error(
            "プロフィール取得エラー:",
            error
        );

        return;

    }


    if(!data){

        return;

    }


    if(data.display_name){

        localStorage.setItem(
            "loginId",
            data.display_name
        );

        document.getElementById(
            "currentLoginId"
        ).textContent =
            "ログインID：" +
            data.display_name;

    }


    if(data.icon_type){

        const icon =
            normalizeIconType(
                data.icon_type
            );


        document.getElementById(
            "iconType"
        ).value =
            icon;

        localStorage.setItem(
            "iconType",
            icon
        );

    }

}

//==================================================
// ログアウト
//==================================================

async function logoutUser(){

    if(watchID !== null){

        navigator.geolocation
            .clearWatch(
                watchID
            );

        watchID = null;

    }


    if(gpsTimer !== null){

        clearInterval(
            gpsTimer
        );

        gpsTimer = null;

    }


    localStorage.removeItem(
        "gpsRunning"
    );


    const {
        error
    } =
        await supabaseClient
            .auth
            .signOut();


    if(error){

        console.error(
            "ログアウトエラー:",
            error
        );

        return;

    }


    registered = false;


    document.getElementById(
        "appScreen"
    ).style.display =
        "none";


    document.getElementById(
        "authScreen"
    ).style.display =
        "flex";


    showLogin();

}


//==================================================
// Supabase Auth 状態確認

window.addEventListener(
    "load",
    async ()=>{

        const {
            data
        } =
            await supabaseClient
                .auth
                .getSession();


        if(
            data.session &&
            data.session.user
        ){

            console.log(
                "ログイン済み:",
                data.session.user.id
            );


            await loadProfile(
                data.session.user
            );


            showApp();

        }
        else{

            document.getElementById(
                "authScreen"
            ).style.display =
                "flex";


            document.getElementById(
                "appScreen"
            ).style.display =
                "none";

        }

    }
);

function normalizeIconType(type){

    type =
        String(type || "");


    if(type === "person"){

        return "1";

    }


    if(type === "vehicle"){

        return "2";

    }


    if(
        ["1","2","3","4"]
            .includes(type)
    ){

        return type;

    }


    return "1";

}

//==================================================
// GPS開始
//==================================================

function startGPS(){

    if(!registered){

        alert(
            "先にユーザー登録してください"
        );

        return;

    }


    localStorage.setItem(
        "gpsRunning",
        "true"
    );


    if(watchID !== null){

        return;

    }


    gpsTimer =
        setInterval(
            ()=>{

                navigator.geolocation
                    .getCurrentPosition(

                        pos=>{

                            sendLocation(

                                pos.coords
                                    .latitude,

                                pos.coords
                                    .longitude

                            );

                        },

                        err=>{

                            console.log(
                                "GPSタイマーエラー",
                                err
                            );

                        }

                    );

            },
            30000
        );


    watchID =
        navigator.geolocation
            .watchPosition(

                pos=>{

                    const lat =
                        pos.coords
                            .latitude;


                    const lon =
                        pos.coords
                            .longitude;


                    if(lastLat === 0){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat =
                            lat;


                        lastLon =
                            lon;


                        lastSendTime =
                            Date.now();


                        return;

                    }


                    const distance =
                        getDistance(

                            lastLat,
                            lastLon,

                            lat,
                            lon

                        );


                    const now =
                        Date.now();


                    if(
                        distance >=
                            MOVE_DISTANCE
                        ||
                        now -
                        lastSendTime >=
                            SEND_INTERVAL
                    ){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat =
                            lat;


                        lastLon =
                            lon;


                        lastSendTime =
                            now;

                    }

                },


                err=>{

                    console.log(
                        "GPSエラー",
                        err
                    );

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        10000,

                    maximumAge:
                        0

                }

            );

}


//==================================================
// GPS送信
//==================================================

function sendLocation(
    lat,
    lon
){

    const utm =
        proj4(

            "EPSG:4326",

            "+proj=utm +zone=52 +south +datum=WGS84",

            [lon,lat]

        );


    const utmE =
        Math.round(
            utm[0]
        );


    const utmN =
        Math.round(
            utm[1]
        );


    [

        "name",
        "water",
        "fuel",
        "destination",
        "iconType"

    ].forEach(
        key=>{

            localStorage.setItem(
                key,
                document.getElementById(
                    key
                ).value
            );

        }
    );


    document.getElementById(
        "gpsStatus"
    ).innerHTML =
        "🟢 GPS稼働中";


    document.getElementById(
        "lastSend"
    ).innerHTML =
        "最終送信：" +
        new Date()
            .toLocaleTimeString();


    if(!registered){

        return;

    }


    const iconType =
        normalizeIconType(
            document.getElementById(
                "iconType"
            ).value
        );


    socket.emit(
        "location",
        {

            name:
                document.getElementById(
                    "name"
                ).value,

            lat:
                lat,

            lon:
                lon,

            utmZone:
                "52S",

            utmE:
                utmE,

            utmN:
                utmN,

            water:
                Number(
                    document.getElementById(
                        "water"
                    ).value
                ),

            fuel:
                Number(
                    document.getElementById(
                        "fuel"
                    ).value
                ),

            destination:
                document.getElementById(
                    "destination"
                ).value,

            iconType:
                iconType

        }
    );

}

//==================================================
// 距離計算
//==================================================

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;


    const dLat =
        (lat2-lat1)
        *
        Math.PI/180;


    const dLon =
        (lon2-lon1)
        *
        Math.PI/180;


    const a =
        Math.sin(dLat/2)**2
        +
        Math.cos(
            lat1*Math.PI/180
        )
        *
        Math.cos(
            lat2*Math.PI/180
        )
        *
        Math.sin(dLon/2)**2;


    return R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

}

//==================================================
// 最終更新時間
//==================================================

function timeAgo(t){

    if(!t){

        return "-";

    }


    const sec =
        Math.floor(
            (Date.now()-t)/1000
        );


    if(sec < 60){

        return sec +
            "秒前";

    }


    const min =
        Math.floor(
            sec/60
        );


    if(min < 60){

        return min +
            "分前";

    }


    return (
        Math.floor(
            min/60
        )
        +
        "時間前"
    );

}

                                ).textContent =
                                    Number(
                                        p.lat
                                    )
                                    .toFixed(6);


                                document.getElementById(
                                    "pointLon"
                                ).textContent =
                                    Number(
                                        p.lon
                                    )
                                    .toFixed(6);


                                const utm =
                                    proj4(

                                        "EPSG:4326",

                                        "+proj=utm +zone=52 +south +datum=WGS84",

                                        [
                                            p.lon,
                                            p.lat
                                        ]

                                    );


                                document.getElementById(
                                    "pointUtmZone"
                                ).textContent =
                                    "52S";


                                document.getElementById(
                                    "pointUtmE"
                                ).textContent =
                                    Math.round(
                                        utm[0]
                                    );


                                document.getElementById(
                                    "pointUtmN"
                                ).textContent =
                                    Math.round(
                                        utm[1]
                                    );

                            }
                        );


                    pointMarkers[name]
                        .bindPopup(`

                            <b>
                                📍${name}
                            </b>

                            <br>

                            ${Number(
                                p.lat
                            ).toFixed(6)}

                            <br>

                            ${Number(
                                p.lon
                            ).toFixed(6)}

                        `);

                }
            );

    }
);


</script>


</body>

</html>
