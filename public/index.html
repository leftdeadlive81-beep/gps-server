<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<title>位置情報共有システム</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

#map {
    height:500px;
    width:100%;
}

input {
    margin:3px;
}

</style>

</head>


<body>


<h1>位置情報共有</h1>


端末名：
<input id="name" placeholder="端末名">

<br>

燃料(%):
<input id="fuel" value="100" type="number">

<br>

所持金(円):
<input id="money" value="0" type="number">

<br>

装備数:
<input id="equipment" value="0" type="number">


<br><br>


<button onclick="startTracking()">
追跡開始
</button>


<button onclick="showHistory()">
履歴表示
</button>


<p id="result">
待機中
</p>


<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>



<script>


let map;

let myMarker;

let otherMarkers={};

let myPath=[];

let myPolyline;

let historyLine;

let deviceName;


const socket=io();



function startTracking(){


deviceName=
document.getElementById("name").value;


if(deviceName==""){
    deviceName="未設定";
}



navigator.geolocation.watchPosition(

function(position){


let lat=
position.coords.latitude;


let lon=
position.coords.longitude;



let fuel=
document.getElementById("fuel").value;


let money=
document.getElementById("money").value;


let equipment=
document.getElementById("equipment").value;



document.getElementById("result").innerHTML=

"端末："+deviceName+
"<br>燃料："+fuel+"%"+
"<br>所持金："+money+"円"+
"<br>装備数："+equipment+
"<br>緯度："+lat+
"<br>経度："+lon;




if(!map){


map=L.map('map')
.setView([lat,lon],15);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'OpenStreetMap'

}

).addTo(map);


}



myPath.push([lat,lon]);



if(!myPolyline){


myPolyline=
L.polyline(myPath)
.addTo(map);


}else{


myPolyline.setLatLngs(myPath);


}




if(!myMarker){


myMarker=
L.marker([lat,lon])
.addTo(map)
.bindTooltip(
deviceName,
{
permanent:true,
direction:"top"
}
);


}else{


myMarker.setLatLng([lat,lon]);


}




socket.emit("location",{


name:deviceName,

lat:lat,

lon:lon,

fuel:fuel,

money:money,

equipment:equipment


});




},


function(error){

document.getElementById("result").innerHTML=
"GPS取得失敗："+error.message;

},


{

enableHighAccuracy:true,

maximumAge:0,

timeout:10000

}


);


}




socket.on("locations",function(users){



for(let id in users){



let user=
users[id];



if(user.name!=deviceName){



let text=

user.name+
"<br>燃料："+user.fuel+"%"+
"<br>所持金："+user.money+"円"+
"<br>装備数："+user.equipment;



if(!otherMarkers[id]){


otherMarkers[id]=

L.marker(
[user.lat,user.lon]
)

.addTo(map)

.bindTooltip(
text,
{
permanent:true,
direction:"top"
}
);



}else{


otherMarkers[id]
.setLatLng(
[user.lat,user.lon]
);


otherMarkers[id]
.setTooltipContent(text);



}



}


}



});





async function showHistory(){


const response=
await fetch("/history");


const data=
await response.json();


let points=[];



data.forEach(row=>{


if(row.name===deviceName){


points.push(
[row.lat,row.lon]
);


}


});



if(historyLine){

map.removeLayer(historyLine);

}



historyLine=
L.polyline(points,{
color:"red",
weight:5
})
.addTo(map);



}


</script>


</body>

</html>
