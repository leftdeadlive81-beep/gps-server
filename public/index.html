<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>GPS位置共有システム</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>


<style>


body{
font-family:sans-serif;
margin:10px;
background:#f5f5f5;
font-size:22px;
}


h2{
font-size:30px;
text-align:center;
}


h3{
font-size:26px;
}


.card{

background:white;
border-radius:15px;
padding:20px;
margin-bottom:15px;
box-shadow:0 2px 5px #aaa;

}


input{

width:90%;
font-size:24px;
padding:12px;
margin:8px;

border-radius:8px;
border:1px solid #888;

}


button{

font-size:24px;
padding:15px;
margin:8px;
width:95%;
border-radius:12px;

}


#gpsStatus{

font-size:24px;
font-weight:bold;
}


#lastSend{

font-size:22px;

}


#map{

height:55vh;
width:100%;
border-radius:15px;

}


.user{

background:white;
border-radius:15px;
padding:20px;
margin:15px 0;
box-shadow:0 2px 5px #aaa;

font-size:22px;

}


.online{

color:green;
font-weight:bold;
}


.offline{

color:red;
font-weight:bold;
}



<h2>📍 GPS位置共有システム</h2>



<div class="card">


<h3>隊員情報</h3>


名前：
<br>

<input id="name" value="隊員A">


<br>


💧 水量：

<br>

<input id="water" type="number" value="100">


<br>


⛽ 燃料：

<br>

<input id="fuel" type="number" value="100">


<br>


📍 次の目的地：

<br>

<input id="destination" value="">



</div>



<div class="card">


<button onclick="startGPS()">

📡 GPS開始

</button>



<button onclick="updateStatus()">

🔄 状態更新

</button>



<div id="gpsStatus">

🔴 GPS停止中

</div>



<div id="lastSend">

最終送信：-

</div>



</div>



<hr>


<div id="map"></div>


<h3>👥 接続ユーザー</h3>


<div id="users"></div>


<script>

//=====================
// Socket.IO
//=====================

const socket = io();


//=====================
// 名前復元
//=====================

const savedName = localStorage.getItem("name");

if(savedName){

document.getElementById("name").value = savedName;

}


//=====================
// 地図
//=====================

const map = L.map('map')
.setView(
[32.803,130.707],
13
);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'OpenStreetMap'
}
)
.addTo(map);



let markers={};


let lastLat=0;
let lastLon=0;


let watchID=null;


const MOVE_DISTANCE=10;




//=====================
// GPS開始
//=====================

function startGPS(){


if(watchID!==null){

alert("GPSはすでに開始しています");

return;

}



watchID=navigator.geolocation.watchPosition(


(pos)=>{


let lat=pos.coords.latitude;

let lon=pos.coords.longitude;



// 初回登録

if(lastLat===0){


sendLocation(
lat,
lon
);




lastLat=lat;
lastLon=lon;


return;

}



let distance=getDistance(

lastLat,
lastLon,
lat,
lon

);



if(distance>=MOVE_DISTANCE){


sendLocation(
lat,
lon
);


lastLat=lat;
lastLon=lon;


}


},


()=>{


alert(
"位置情報取得失敗"
);


},


{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0

}


);



}





//=====================
// 状態送信
//=====================

function sendLocation(lat,lon){

localStorage.setItem(
"name",
document.getElementById("name").value
);



document.getElementById("gpsStatus")
.innerHTML=
"🟢 GPS稼働中";



document.getElementById("lastSend")
.innerHTML=
"最終送信："+
new Date()
.toLocaleTimeString();




socket.emit(

"location",

{


name:

document.getElementById("name").value,


lat:lat,


lon:lon,



water:

Number(
document.getElementById("water").value
),



fuel:

Number(
document.getElementById("fuel").value
),



destination:

document.getElementById("destination").value



}

);



}





//=====================
// 状態更新
//=====================

function updateStatus(){



navigator.geolocation.getCurrentPosition(


(pos)=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


}



);


}






//=====================
// 距離計算
//=====================

function getDistance(

lat1,
lon1,
lat2,
lon2

){



if(lat1===0)

return 99999;



const R=6371000;



const dLat=

(lat2-lat1)
*
Math.PI/180;



const dLon=

(lon2-lon1)
*
Math.PI/180;



const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)**2;



return R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);



}






//=====================
// ユーザー削除
//=====================

function deleteUser(name){


if(confirm(name+" を削除しますか？")){


socket.emit(

"deleteUser",

name

);


}


}



//=====================
// 表示関数
//=====================

function statusText(user){

return user.online ?

"🟢 オンライン":

"🔴 オフライン";

}



function statusClass(user){

return user.online ?

"online":

"offline";

}



function formatTime(t){

if(!t)

return "不明";


return new Date(t)
.toLocaleString();

}





//=====================
// ユーザー位置へ移動
//=====================

function focusUser(name){


if(markers[name]){


let pos = markers[name]
.getLatLng();



map.setView(

[
pos.lat,
pos.lng
],

16

);



markers[name]
.openPopup();



}


}







//=====================
// 位置情報受信
//=====================

socket.on(

"locations",

(users)=>{


let html="";



// 消えたユーザーのマーカー削除

Object.keys(markers)
.forEach(

(name)=>{


if(!users[name]){


map.removeLayer(
markers[name]
);


delete markers[name];


}


}

);





Object.keys(users)
.forEach(

(name)=>{


let user=users[name];



let color=user.online?

"green":

"red";





// マーカー更新

if(markers[name]){


markers[name]
.setLatLng(

[
user.lat,
user.lon
]

);


}
else{


markers[name]=

L.circleMarker(

[
user.lat,
user.lon
],

{

radius:10,

color:color

}

)

.addTo(map);



}





markers[name]
.setStyle(

{

color:color

}

);





markers[name]
.bindPopup(

`

<b>${user.name}</b><br>

${statusText(user)}

<br>

💧 水量:${user.water}

<br>

⛽ 燃料:${user.fuel}

<br>

📍 次の目的地:${user.destination}

<br>

最終更新:${formatTime(user.lastUpdate)}

`

);







// ユーザー一覧

html+=


`

<div class="user"
onclick="focusUser('${user.name}')">


<b>${user.name}</b>

<br>


<span class="${statusClass(user)}">

${statusText(user)}

</span>


<br>


💧 水量:${user.water}


<br>


⛽ 燃料:${user.fuel}


<br>


📍 次の目的地:${user.destination}


<br>


最終更新:

${formatTime(user.lastUpdate)}



<br><br>


<button onclick="event.stopPropagation();deleteUser('${user.name}')">

🗑 削除

</button>


</div>


`;



}

);





document.getElementById("users")
.innerHTML=html;



}


);




</script>


</body>

</html>
