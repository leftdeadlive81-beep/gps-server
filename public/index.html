<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>現在位置自動共有君 Version 2.3</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

/*==================================================
  全体
==================================================*/

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    padding:0;

    width:100%;

    height:100%;

    font-family:
        "Segoe UI",
        "Meiryo",
        sans-serif;

    background:#f2f4f7;

}


/*==================================================
  タブ
==================================================*/

.tabBar{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    width:100%;

    background:#222;

}


.tabButton{

    border:none;

    background:#333;

    color:white;

    padding:8px 4px;

    cursor:pointer;

    min-height:58px;

}


.tabButton.active{

    background:#1976d2;

}


.tabIcon{

    display:block;

    font-size:22px;

    line-height:24px;

}


.tabText{

    display:block;

    font-size:13px;

    margin-top:3px;

}


/*==================================================
  タブ内容
==================================================*/

.tabContent{

    display:none;

    padding:8px;

}


.tabContent.active{

    display:block;

}


/*==================================================
  地図
==================================================*/

#map{

    width:100%;

    height:
        calc(100vh - 80px);

    min-height:450px;

}


/*==================================================
  セクション
==================================================*/

.sectionTitle{

    font-weight:bold;

    font-size:17px;

    padding:10px;

    margin-bottom:6px;

    background:#e8edf3;

    border-radius:6px;

}


/*==================================================
  カード
==================================================*/

.card{

    background:white;

    border-radius:8px;

    padding:10px;

    margin-bottom:10px;

    box-shadow:
        0 1px 4px
        rgba(0,0,0,0.15);

}


/*==================================================
  入力
==================================================*/

input,
select{

    width:100%;

    padding:10px;

    margin-bottom:8px;

    border:1px solid #bbb;

    border-radius:5px;

    font-size:15px;

}


.inputRow{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

}


/*==================================================
  ボタン
==================================================*/

button{

    font-size:15px;

}


.settingsButton{

    width:100%;

    padding:11px;

    border:none;

    border-radius:6px;

    background:#1976d2;

    color:white;

    font-weight:bold;

}


.gpsButtonRow{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin-top:8px;

}


.gpsButton,
.reportButton{

    padding:12px;

    border:none;

    border-radius:6px;

    color:white;

    font-weight:bold;

}


.gpsButton{

    background:#388e3c;

}


.reportButton{

    background:#f57c00;

}


.pointButtonRow{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

}


.pointButtonRow button{

    padding:10px;

    border:none;

    border-radius:6px;

}


/*==================================================
  GPS状態
==================================================*/

#gpsStatus,
#lastSend,
#registerStatus{

    padding:8px;

    margin-top:5px;

    font-size:14px;

}


/*==================================================
  ユーザー一覧
==================================================*/

.userHeader{

    display:grid;

    grid-template-columns:
        55px
        1fr
        55px
        65px
        70px
        55px;

    gap:3px;

    font-weight:bold;

    background:#ddd;

    padding:6px;

    font-size:12px;

}


.userRow{

    display:grid;

    grid-template-columns:
        55px
        1fr
        55px
        65px
        70px
        55px;

    gap:3px;

    align-items:center;

    background:white;

    border-bottom:1px solid #ddd;

    padding:6px;

    font-size:13px;

}


.userRow button{

    padding:5px;

    border:none;

    border-radius:4px;

    background:#1976d2;

    color:white;

}


/*==================================================
  クロノロジー
==================================================*/

.chronoInputRow{

    display:grid;

    grid-template-columns:
        1fr 70px;

    gap:6px;

}


.chronoInputRow input{

    margin:0;

}


#chronoSendButton{

    border:none;

    border-radius:5px;

    background:#1976d2;

    color:white;

}


#timeline{

    margin-top:10px;

}


.timelineItem{

    background:white;

    padding:9px;

    margin-bottom:5px;

    border-radius:5px;

    border-left:4px solid #1976d2;

}


/*==================================================
  地点情報
==================================================*/

.pointInfo{

    margin-top:10px;

    padding:8px;

    background:#f5f5f5;

    border-radius:5px;

    font-size:14px;

}


.pointInfo hr{

    border:none;

    border-top:1px solid #ccc;

}


/*==================================================
  交通規制アイコン
==================================================*/

.trafficIcon{

    font-size:28px;

    line-height:30px;

    text-align:center;

}


/*==================================================
  地図ポップアップ
==================================================*/

.leaflet-popup-content{

    font-size:14px;

}

</style>

</head>

<body>

<!--==================================================
  タブ
===================================================-->

<div class="tabBar">

```
<button
    class="tabButton active"
    onclick="showTab('mapTab',this)">

    <span class="tabIcon">🗺️</span>

    <span class="tabText">地図</span>

</button>


<button
    class="tabButton"
    onclick="showTab('usersTab',this)">

    <span class="tabIcon">👥</span>

    <span class="tabText">隊員一覧</span>

</button>


<button
    class="tabButton"
    onclick="showTab('chronoTab',this)">

    <span class="tabIcon">📋</span>

    <span class="tabText">報連相</span>

</button>


<button
    class="tabButton"
    onclick="showTab('settingsTab',this)">

    <span class="tabIcon">⚙️</span>

    <span class="tabText">登録</span>

</button>
```

</div>

<!--==================================================
  地図タブ
===================================================-->

<div id="mapTab"
     class="tabContent active">

```
<div id="map"></div>


<div class="gpsButtonRow">

    <button
        class="gpsButton"
        onclick="startGPS()">

        📡 GPS開始

    </button>


    <button
        class="reportButton"
        onclick="updateStatus()">

        🔄 現在地報告

    </button>

</div>


<div id="gpsStatus">

    🔴 GPS停止中

</div>


<div id="lastSend">

    最終送信：-

</div>
```

</div>

<!--==================================================
  隊員一覧タブ
===================================================-->

<div id="usersTab"
     class="tabContent">

```
<div class="sectionTitle">

    👥 接続ユーザー

</div>


<div class="userHeader">

    <div>状態</div>

    <div>名前</div>

    <div>💧水</div>

    <div>⛽燃料</div>

    <div>最終</div>

    <div>操作</div>

</div>


<div id="users"></div>
```

</div>

<!--==================================================
  報連相タブ
===================================================-->

<div id="chronoTab"
     class="tabContent">

```
<div class="sectionTitle">

    📋 報連相

</div>


<div class="chronoInputRow">

    <input
        id="chronoMessage"
        placeholder="活動内容を入力">


    <button
        id="chronoSendButton"
        onclick="sendChronology()">

        送信

    </button>

</div>


<div id="timeline"></div>
```

</div>

<!--==================================================
  登録タブ
===================================================-->

<div id="settingsTab"
     class="tabContent">

```
<!-- 使用者情報 -->

<div class="card settingsCard">


    <div class="sectionTitle">

        👤 使用者情報

    </div>


    <div class="inputRow">

        <input
            id="name"
            value="隊員A"
            placeholder="名前">


        <select id="iconType">

            <option value="1">
                👤 隊員
            </option>

            <option value="2">
                🚙 小型
            </option>

            <option value="3">
                🚚 中型
            </option>

            <option value="4">
                🚛 大型
            </option>

        </select>

    </div>


    <div class="inputRow">

        <input
            id="water"
            type="number"
            value="100"
            placeholder="💧水量">


        <input
            id="fuel"
            type="number"
            value="100"
            placeholder="⛽燃料">

    </div>


    <input
        id="destination"
        placeholder="📍次の目的地">


    <button
        class="settingsButton"
        onclick="registerUser()">

        👤 ユーザー登録

    </button>


    <div id="registerStatus">

        未登録

    </div>

</div>



<!-- 地点登録 -->

<div class="card settingsCard">


    <div class="sectionTitle">

        📍 地点登録

    </div>


    <input
        id="pointName"
        placeholder="地点名（例：CP1、給水所）">


    <select id="pointType">

        <option value="CP">
            🏳 指揮所(CP)
        </option>

        <option value="water">
            💧給水所
        </option>

        <option value="supply">
            📦補給地点
        </option>

        <option value="point">
            📍その他
        </option>

    </select>


    <div class="pointButtonRow">

        <button
            onclick="addPoint()">

            📍登録

        </button>


        <button
            onclick="deletePoint()">

            🗑削除

        </button>

    </div>


    <div class="pointInfo">

        <div>

            📍 緯度：
            <span id="pointLat">-</span>

        </div>


        <div>

            📍 経度：
            <span id="pointLon">-</span>

        </div>


        <hr>


        <div>

            🧭 UTM：
            <span id="pointUtmZone">-</span>

        </div>


        <div>

            E：
            <span id="pointUtmE">-</span>

        </div>


        <div>

            N：
            <span id="pointUtmN">-</span>

        </div>

    </div>

</div>
```

</div>

<script>

/*==================================================
  Socket.IO
==================================================*/

const socket = io();



/*==================================================
  地図
==================================================*/

const map =
    L.map("map")
     .setView(
         [32.803,130.707],
         13
     );


const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );


osm.addTo(map);



/*==================================================
  レイヤー
==================================================*/

const userLayer =
    L.layerGroup().addTo(map);


const pointLayer =
    L.layerGroup().addTo(map);


const trafficRegulationLayer =
    L.layerGroup().addTo(map);



/*==================================================
  ユーザー情報
==================================================*/

let users = {};

let currentGPS = null;

let gpsStarted = false;

let selectedPoint = null;



/*==================================================
  アイコン
==================================================*/

function getUserIcon(iconType){

    let icon = "👤";


    if(String(iconType) === "2"){
        icon = "🚙";
    }

    if(String(iconType) === "3"){
        icon = "🚚";
    }

    if(String(iconType) === "4"){
        icon = "🚛";
    }


    return L.divIcon({

        className:"userIcon",

        html:
            `<div style="
                font-size:28px;
                text-align:center;
            ">${icon}</div>`,

        iconSize:[
            35,
            35
        ],

        iconAnchor:[
            17,
            17
        ]

    });

}



/*==================================================
  タブ切替
==================================================*/

function showTab(tabId,button){

    document
        .querySelectorAll(".tabContent")
        .forEach(tab=>{

            tab.classList.remove("active");

        });


    document
        .querySelectorAll(".tabButton")
        .forEach(btn=>{

            btn.classList.remove("active");

        });


    document
        .getElementById(tabId)
        .classList.add("active");


    button.classList.add("active");


    if(tabId === "mapTab"){

        setTimeout(
            ()=>map.invalidateSize(),
            100
        );

    }

}



/*==================================================
  ユーザー受信
==================================================*/

socket.on(
    "locations",
    data=>{

        users = data || {};

        drawUsers();

        drawUserList();

    }
);



/*==================================================
  ユーザー描画
==================================================*/

function drawUsers(){

    userLayer.clearLayers();


    Object.values(users)
    .forEach(user=>{

        if(
            user.lat == null ||
            user.lon == null
        ){

            return;

        }


        const marker =
            L.marker(
                [
                    Number(user.lat),
                    Number(user.lon)
                ],
                {
                    icon:
                        getUserIcon(
                            user.iconType
                        )
                }
            );


        marker.bindPopup(`

            <b>${user.name || "-"}</b>

            <hr>

            💧 水：
            ${user.water ?? "-"}

            <br>

            ⛽ 燃料：
            ${user.fuel ?? "-"}

            <br>

            📍 目的地：
            ${user.destination || "-"}

            <br>

            🧭 UTM：
            ${user.utmZone || "-"}
            /
            ${user.utmE || "-"}
            /
            ${user.utmN || "-"}

        `);


        userLayer.addLayer(marker);

    });

}



/*==================================================
  ユーザー一覧
==================================================*/

function drawUserList(){

    const container =
        document.getElementById("users");


    if(!container){
        return;
    }


    container.innerHTML = "";


    Object.values(users)
    .forEach(user=>{

        const row =
            document.createElement("div");


        row.className =
            "userRow";


        const online =
            user.online;


        const last =
            user.lastUpdate
            ?
            new Date(
                Number(user.lastUpdate)
            ).toLocaleTimeString(
                "ja-JP",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )
            :
            "-";


        row.innerHTML = `

            <div>
                ${online ? "🟢" : "⚪"}
            </div>

            <div>
                ${user.name || "-"}
            </div>

            <div>
                ${user.water ?? "-"}
            </div>

            <div>
                ${user.fuel ?? "-"}
            </div>

            <div>
                ${last}
            </div>

            <div>

                <button
                    onclick="
                        centerUser(
                            ${Number(user.lat)},
                            ${Number(user.lon)}
                        )
                    ">

                    地図

                </button>

            </div>

        `;


        container.appendChild(row);

    });

}



/*==================================================
  ユーザー位置へ移動
==================================================*/

function centerUser(lat,lon){

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ){

        return;

    }


    showMapTab();


    map.setView(
        [lat,lon],
        16
    );

}



/*==================================================
  地図タブへ
==================================================*/

function showMapTab(){

    const button =
        document.querySelector(
            '.tabButton[onclick*="mapTab"]'
        );


    showTab(
        "mapTab",
        button
    );

}



/*==================================================
  クロノロジー受信
==================================================*/

socket.on(
    "chronology",
    data=>{

        const timeline =
            document.getElementById(
                "timeline"
            );


        if(!timeline){
            return;
        }


        timeline.innerHTML = "";


        (data || [])
        .forEach(item=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "timelineItem";


            div.innerHTML = `

                <b>${item.time || ""}</b>

                <br>

                ${item.message || ""}

            `;


            timeline.appendChild(div);

        });

    }
);



/*==================================================
  クロノロジー送信
==================================================*/

function sendChronology(){

    const input =
        document.getElementById(
            "chronoMessage"
        );


    const message =
        input.value.trim();


    if(!message){
        return;
    }


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    socket.emit(
        "addChronology",
        {
            user:name,
            message:message
        }
    );


    input.value = "";

}



/*==================================================
  ユーザー登録
==================================================*/

function registerUser(){

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    if(!name){

        alert(
            "名前を入力してください"
        );

        return;

    }


    const data = {

        name:name,

        water:
            document.getElementById(
                "water"
            ).value,

        fuel:
            document.getElementById(
                "fuel"
            ).value,

        destination:
            document.getElementById(
                "destination"
            ).value,

        iconType:
            document.getElementById(
                "iconType"
            ).value

    };


    socket.emit(
        "registerUser",
        data
    );


    document.getElementById(
        "registerStatus"
    ).textContent =
        "🟢 登録済み："
        + name;

}



/*==================================================
  GPS開始
==================================================*/

function startGPS(){

    if(
        !navigator.geolocation
    ){

        alert(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    gpsStarted = true;


    document.getElementById(
        "gpsStatus"
    ).textContent =
        "🟢 GPS取得中";


    navigator.geolocation.watchPosition(

        position=>{

            currentGPS = {

                lat:
                    position.coords.latitude,

                lon:
                    position.coords.longitude

            };


            sendCurrentLocation();

        },

        error=>{

            console.error(
                error
            );


            document.getElementById(
                "gpsStatus"
            ).textContent =
                "🔴 GPS取得エラー";

        },

        {

            enableHighAccuracy:true,

            maximumAge:0,

            timeout:10000

        }

    );

}



/*==================================================
  現在地送信
==================================================*/

function sendCurrentLocation(){

    if(!currentGPS){
        return;
    }


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    if(!name){
        return;
    }


    socket.emit(
        "location",
        {

            name:name,

            lat:currentGPS.lat,

            lon:currentGPS.lon,

            water:
                Number(
                    document.getElementById(
                        "water"
                    ).value
                ) || 0,

            fuel:
                Number(
                    document.getElementById(
                        "fuel"
                    ).value
                ) || 0,

            destination:
                document.getElementById(
                    "destination"
                ).value,

            iconType:
                document.getElementById(
                    "iconType"
                ).value

        }
    );


    document.getElementById(
        "lastSend"
    ).textContent =
        "最終送信："
        +
        new Date()
        .toLocaleTimeString(
            "ja-JP"
        );

}



/*==================================================
  現在地報告
==================================================*/

function updateStatus(){

    if(!currentGPS){

        alert(
            "GPS位置情報がありません"
        );

        return;

    }


    sendCurrentLocation();

}



/*==================================================
  地点受信
==================================================*/

socket.on(
    "points",
    data=>{

        pointLayer.clearLayers();


        Object.values(data || {})
        .forEach(point=>{

            if(
                point.lat == null ||
                point.lon == null
            ){

                return;

            }


            let icon = "📍";


            if(point.type === "CP"){
                icon = "🏳";
            }

            if(point.type === "water"){
                icon = "💧";
            }

            if(point.type === "supply"){
                icon = "📦";
            }


            const marker =
                L.marker(
                    [
                        Number(point.lat),
                        Number(point.lon)
                    ],
                    {

                        icon:
                            L.divIcon({

                                className:
                                    "pointIcon",

                                html:
                                    `<div style="
                                        font-size:27px;
                                    ">${icon}</div>`,

                                iconSize:[
                                    32,
                                    32
                                ],

                                iconAnchor:[
                                    16,
                                    16
                                ]

                            })

                    }
                );


            marker.bindPopup(`

                <b>${point.name || "-"}</b>

                <br>

                種類：
                ${point.type || "-"}

                <br>

                緯度：
                ${point.lat}

                <br>

                経度：
                ${point.lon}

            `);


            marker.on(
                "click",
                ()=>{

                    selectedPoint =
                        point.name;

                    document.getElementById(
                        "pointName"
                    ).value =
                        point.name || "";

                    document.getElementById(
                        "pointLat"
                    ).textContent =
                        point.lat ?? "-";

                    document.getElementById(
                        "pointLon"
                    ).textContent =
                        point.lon ?? "-";

                }
            );


            pointLayer.addLayer(marker);

        });

    }
);



/*==================================================
  地点登録
==================================================*/

function addPoint(){

    if(!currentGPS){

        alert(
            "先にGPSを取得してください"
        );

        return;

    }


    const name =
        document.getElementById(
            "pointName"
        ).value.trim();


    if(!name){

        alert(
            "地点名を入力してください"
        );

        return;

    }


    socket.emit(
        "addPoint",
        {

            name:name,

            type:
                document.getElementById(
                    "pointType"
                ).value,

            lat:currentGPS.lat,

            lon:currentGPS.lon

        }
    );


    document.getElementById(
        "pointLat"
    ).textContent =
        currentGPS.lat;


    document.getElementById(
        "pointLon"
    ).textContent =
        currentGPS.lon;

}



/*==================================================
  地点削除
==================================================*/

function deletePoint(){

    const name =
        document.getElementById(
            "pointName"
        ).value.trim();


    if(!name){

        alert(
            "削除する地点を選択してください"
        );

        return;

    }


    socket.emit(
        "deletePoint",
        name
    );

}



/*==================================================
  交通規制受信
==================================================*/

socket.on(

    "trafficRegulations",

    regulations=>{

        console.log(
            "交通規制受信:",
            regulations
        );


        trafficRegulationLayer
            .clearLayers();


        if(
            !Array.isArray(regulations)
        ){

            return;

        }


        regulations.forEach(
            regulation=>{

                if(
                    regulation.lat == null ||
                    regulation.lon == null
                ){

                    return;

                }


                const marker =
                    L.marker(
                        [
                            Number(
                                regulation.lat
                            ),

                            Number(
                                regulation.lon
                            )
                        ],

                        {

                            icon:
                                L.divIcon({

                                    className:
                                        "trafficIcon",

                                    html:"🚧",

                                    iconSize:[
                                        30,
                                        30
                                    ],

                                    iconAnchor:[
                                        15,
                                        15
                                    ]

                                })

                        }
                    );


                marker.bindPopup(`

                    <b>🚧 交通規制</b>

                    <hr>

                    路線：
                    ${regulation.route || "-"}

                    <br>

                    規制：
                    ${regulation.type || "-"}

                    <br>

                    原因：
                    ${regulation.reason || "-"}

                    <br>

                    区間：
                    ${regulation.section || "-"}

                    <br>

                    開始：
                    ${regulation.start || "-"}

                `);


                trafficRegulationLayer
                    .addLayer(marker);

            }
        );

    }

);
