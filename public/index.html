<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>GPS位置共有システム</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body {
    font-family: sans-serif;
    margin: 20px;
}

input {
    margin:5px;
    padding:5px;
}

button {
    padding:8px;
}

.user {
    border:1px solid #aaa;
    padding:10px;
    margin:5px;
}

</style>

</head>


<body>


<h2>GPS位置共有システム</h2>


<div>

名前：
<input id="name" value="隊員A">

<br>


所持金：
<input id="money" type="number" value="0">


<br>


燃料：
<input id="fuel" type="number" value="100">


<br>


装備数：
<input id="equipment" type="number" value="0">


<br>


<button onclick="startGPS()">
GPS開始
</button>


</div>



<h3>現在接続中</h3>


<div id="users"></div>



<script>


const socket = io();



let myPosition = {

    lat:0,
    lon:0

};




// GPS開始

function startGPS(){


if(!navigator.geolocation){

    alert("GPSが利用できません");
    return;

}



navigator.geolocation.watchPosition(

(position)=>{


    myPosition.lat =
    position.coords.latitude;


    myPosition.lon =
    position.coords.longitude;



    sendLocation();



},


(error)=>{

    alert("位置情報取得失敗");

},


{

    enableHighAccuracy:true,

    maximumAge:0,

    timeout:10000

}


);



}




// サーバー送信

function sendLocation(){


const data={


name:
document.getElementById("name").value,


lat:
myPosition.lat,


lon:
myPosition.lon,


money:
Number(document.getElementById("money").value),


fuel:
Number(document.getElementById("fuel").value),


equipment:
Number(document.getElementById("equipment").value)


};



socket.emit(
"location",
data
);


}





// 他ユーザー受信

socket.on(
"locations",
(users)=>{


let html="";


Object.values(users).forEach(user=>{


html += `

<div class="user">


<b>${user.name}</b><br>


緯度:
${user.lat}<br>


経度:
${user.lon}<br>


💰 所持金:
${user.money} 円<br>


⛽ 燃料:
${user.fuel}<br>


🎒 装備:
${user.equipment}


</div>


`;


});


document.getElementById("users").innerHTML =
html;



});



</script>


</body>

</html>
