<style>

/* ==================================================
   全体
================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        "Noto Sans JP",

    background: #f2f4f7;

/* ==================================================
   Auth
================================================== */

#authScreen {

    min-height: 100vh;

    display: flex;

    align-items: center;

    padding: 20px;

    background: #f2f4f7;

}


#loginBox,
#registerBox {

}


#loginBox h3,
#registerBox h3 {

}


#loginBox input,

.gpsButton,

.gpsButton {

/* ==================================================

/* ==================================================

================================================== */

.pointButtonRow {

/* ==================================================

@media(max-width:600px){

<script>


//==================================================
// Supabase
//==================================================

const SUPABASE_URL =
    "https://seqqgkryrhcvmxnwyybr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_pUI0REFogJSgZYs3OJepEQ_Zl27Iw73";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


//==================================================
// Supabase Auth
//==================================================

async function loginUser(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if(!email || !password){

        document.getElementById(
            "loginMessage"
        ).textContent =
            "メールアドレスとパスワードを入力してください";

        return;

    }


    document.getElementById(
        "loginMessage"
    ).textContent =
        "ログイン中...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if(error){

        console.error(
            "ログインエラー:",
            error
        );

        document.getElementById(
            "loginMessage"
        ).textContent =
            "ログインに失敗しました：" +
            error.message;

        return;

    }


    console.log(
        "ログイン成功:",
        data.user.id
    );


    showApp();

}


async function registerAuthUser(){

    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    const password2 =
        document.getElementById(
            "registerPassword2"
        ).value;


    if(!email || !password){

        document.getElementById(
            "registerMessage"
        ).textContent =
            "メールアドレスとパスワードを入力してください";

        return;

    }


    if(password !== password2){

        document.getElementById(
            "registerMessage"
        ).textContent =
            "パスワードが一致しません";

        return;

    }


    document.getElementById(
        "registerMessage"
    ).textContent =
        "アカウント作成中...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password

        });


    if(error){

        console.error(
            "アカウント登録エラー:",
            error
        );

        document.getElementById(
            "registerMessage"
        ).textContent =
            "登録に失敗しました：" +
            error.message;

        return;

    }


    console.log(
        "Auth登録成功:",
        data.user
    );


    document.getElementById(
        "registerMessage"
    ).textContent =
        "登録しました。ログインしてください。";


    showLogin();

}


function showRegister(){

    document.getElementById(
        "loginBox"
    ).style.display =
        "none";


    document.getElementById(
        "registerBox"
    ).style.display =
        "block";

}


function showLogin(){

    document.getElementById(
        "loginBox"
    ).style.display =
        "block";


    document.getElementById(
        "registerBox"
    ).style.display =
        "none";

}


function showApp(){

    document.getElementById(
        "authScreen"
    ).style.display =
        "none";


    document.getElementById(
        "appScreen"
    ).style.display =
        "block";


    setTimeout(()=>{

        if(typeof map !== "undefined"){

            map.invalidateSize();

        }

    },200);

}


async function logoutUser(){

    const {
        error
    } =
        await supabaseClient.auth.signOut();


    if(error){

        console.error(
            "ログアウトエラー:",
            error
        );

        return;

    }


    document.getElementById(
        "appScreen"
    ).style.display =
        "none";


    document.getElementById(
        "authScreen"
    ).style.display =
        "flex";


    showLogin();

}


//==================================================
// Supabase Auth 状態確認
//==================================================

window.addEventListener(
    "load",
    async ()=>{

        const {
            data
        } =
            await supabaseClient.auth.getSession();


        if(
            data.session &&
            data.session.user
        ){

            console.log(
                "ログイン済み:",
                data.session.user.id
            );


            showApp();

        }
        else{

            document.getElementById(
                "authScreen"
            ).style.display =
                "flex";


            document.getElementById(
                "appScreen"
            ).style.display =
                "none";

        }

    }
);


//==================================================
// Socket.IO
//==================================================

const socket = io();


let registered = false;

let markers = {};

let pointMarkers = {};

let chronology = [];

let watchID = null;

let gpsTimer = null;

let lastLat = 0;

let lastLon = 0;

let lastSendTime = 0;


const SEND_INTERVAL = 30000;

const MOVE_DISTANCE = 10;


//==================================================
// タブ切替
//==================================================

function showTab(tabId, button){

    document
        .querySelectorAll(".tabContent")
        .forEach(tab=>{

            tab.classList.remove("active");

        });


    document
        .querySelectorAll(".tabButton")
        .forEach(btn=>{

            btn.classList.remove("active");

        });


    const tab =
        document.getElementById(tabId);


    if(tab){

        tab.classList.add("active");

    }


    if(button){

        button.classList.add("active");

    }


    if(tabId === "mapTab"){

        setTimeout(()=>{

            map.invalidateSize();

        },100);

    }

}


//==================================================
// アイコン種類
//==================================================

function normalizeIconType(type){

    type =
        String(type || "");


    if(type === "person"){

        return "1";

    }


    if(type === "vehicle"){

        return "2";

    }


    if(
        ["1","2","3","4"]
        .includes(type)
    ){

        return type;

    }


    return "1";

}


//==================================================
// 既存ユーザー情報復元
//==================================================

window.onload = function(){

    [

        "name",
        "water",
        "fuel",
        "destination",
        "iconType"

    ].forEach(key=>{

        let value =
            localStorage.getItem(key);


        if(value !== null){

            const element =
                document.getElementById(key);


            if(element){

                if(key === "iconType"){

                    value =
                        normalizeIconType(value);


                    localStorage.setItem(
                        "iconType",
                        value
                    );

                }


                element.value = value;

            }

        }

    });


    const iconElement =
        document.getElementById(
            "iconType"
        );


    if(
        iconElement &&
        !localStorage.getItem("iconType")
    ){

        iconElement.value = "1";


        localStorage.setItem(
            "iconType",
            "1"
        );

    }


    const savedName =
        localStorage.getItem("name");


    if(savedName){

        setTimeout(()=>{

            const savedIconType =
                normalizeIconType(
                    localStorage.getItem(
                        "iconType"
                    )
                );


            socket.emit(
                "registerUser",
                {

                    name:
                        savedName,

                    water:
                        Number(
                            localStorage.getItem(
                                "water"
                            ) || 0
                        ),

                    fuel:
                        Number(
                            localStorage.getItem(
                                "fuel"
                            ) || 0
                        ),

                    destination:
                        localStorage.getItem(
                            "destination"
                        ) || "",

                    iconType:
                        savedIconType

                }
            );


            registered = true;


            document.getElementById(
                "registerStatus"
            ).innerHTML =
                "🟢 自動登録 : " +
                savedName;


        },1000);

    }


    if(
        localStorage.getItem(
            "gpsRunning"
        ) === "true"
    ){

        setTimeout(()=>{

            startGPS();

        },2000);

    }

};


//==================================================
// Socket 接続
//==================================================

socket.on(
    "connect",
    ()=>{

        console.log(
            "サーバー接続"
        );

    }
);


socket.on(
    "disconnect",
    ()=>{

        document.getElementById(
            "gpsStatus"
        ).innerHTML =
            "🔴 サーバー切断";

//==================================================
// GPS開始
//==================================================

function startGPS(){

    if(!registered){

        alert(
            "先にユーザー登録してください"
        );

        return;

    }


    localStorage.setItem(
        "gpsRunning",
        "true"
    );


    if(watchID !== null){

        return;

    }


    gpsTimer =
        setInterval(()=>{

            navigator.geolocation
                .getCurrentPosition(

                    pos=>{

                        sendLocation(

                            pos.coords.latitude,

                            pos.coords.longitude

                        );

                    },

                    err=>{

                        console.log(
                            "GPSタイマーエラー",
                            err
                        );

                    }

                );

        },30000);


    watchID =
        navigator.geolocation
            .watchPosition(

                pos=>{

                    const lat =
                        pos.coords.latitude;


                    const lon =
                        pos.coords.longitude;


                    if(lastLat === 0){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat = lat;

                        lastLon = lon;

                        lastSendTime =
                            Date.now();

                        return;

                    }


                    const distance =
                        getDistance(
                            lastLat,
                            lastLon,
                            lat,
                            lon
                        );


                    const now =
                        Date.now();


                    if(
                        distance >=
                            MOVE_DISTANCE
                        ||
                        now-lastSendTime >=
                            SEND_INTERVAL
                    ){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat = lat;

                        lastLon = lon;

                        lastSendTime = now;

                    }

                },


                err=>{

                    console.log(
                        "GPSエラー",
                        err
                    );

                },


                {

                    enableHighAccuracy:true,

                    timeout:10000,

                    maximumAge:0

                }

            );

}


//==================================================
// GPS送信
//==================================================

function sendLocation(
    lat,
    lon
){

    const utm =
        proj4(
            "EPSG:4326",

            "+proj=utm +zone=52 +south +datum=WGS84",

            [lon,lat]
        );


    const utmE =
        Math.round(
            utm[0]
        );


    const utmN =
        Math.round(
            utm[1]
        );


    [

        "name",
        "water",
        "fuel",
        "destination",
        "iconType"

    ].forEach(key=>{

        localStorage.setItem(
            key,
            document.getElementById(
                key
            ).value
        );

    });


    document.getElementById(
        "gpsStatus"
    ).innerHTML =
        "🟢 GPS稼働中";


    document.getElementById(
        "lastSend"
    ).innerHTML =
        "最終送信：" +
        new Date()
            .toLocaleTimeString();


    if(!registered){

        return;

    }


    const iconType =
        normalizeIconType(
            document.getElementById(
                "iconType"
            ).value
        );


    socket.emit(
        "location",
        {

            name:
                document.getElementById(
                    "name"
                ).value,

            lat:
                lat,

            lon:
                lon,

            utmZone:
                "52S",

            utmE:
                utmE,

            utmN:
                utmN,

            water:
                Number(
                    document.getElementById(
                        "water"
                    ).value
                ),

            fuel:
                Number(
                    document.getElementById(
                        "fuel"
                    ).value
                ),

            destination:
                document.getElementById(
                    "destination"
                ).value,

            iconType:
                iconType

        }
    );

}

//==================================================
// 距離計算
//==================================================

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;


    const dLat =
        (lat2-lat1)
        *
        Math.PI/180;


    const dLon =
        (lon2-lon1)
        *
        Math.PI/180;


    const a =
        Math.sin(dLat/2)**2
        +
        Math.cos(
            lat1*Math.PI/180
        )
        *
        Math.cos(
            lat2*Math.PI/180
        )
        *
        Math.sin(dLon/2)**2;


    return R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

}

//==================================================

function createIcon(type){

    type =
        normalizeIconType(type);


    let image;


    switch(type){

        case "1":

            image =
                "/icon/person.png";

            break;


        case "2":

            image =
                "/icon/vehicle_small.png";

            break;


        case "3":

            image =
                "/icon/vehicle_medium.png";

            break;


        case "4":

            image =
                "/icon/vehicle_large.png";

            break;


        default:

            image =
                "/icon/person.png";

            break;

    }


    return L.icon({

        iconUrl:
            image,

        iconSize:
            [60,60],

        iconAnchor:
            [30,60],

        popupAnchor:
            [0,-70]

    });

}

//==================================================
// 最終更新時間
//==================================================

function timeAgo(t){

    if(!t){

        return "-";

    }


    const sec =
        Math.floor(
            (Date.now()-t)/1000
        );


    if(sec < 60){

        return sec + "秒前";

    }


    const min =
        Math.floor(
            sec/60
        );


    if(min < 60){

        return min + "分前";

    }


    return (
        Math.floor(
            min/60
        )
        +
        "時間前"
    );

}
