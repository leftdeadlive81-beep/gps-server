<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS位置共有システム</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

font-family:sans-serif;

margin:0;

padding:10px;

background:#f0f0f0;

font-size:24px;

}


h2{

font-size:32px;

text-align:center;

margin:10px;

}


h3{

font-size:28px;

}


.card{

background:white;

border-radius:15px;

padding:20px;

margin-bottom:15px;

box-shadow:0 2px 6px #999;

}



label{

font-weight:bold;

}



input{

width:100%;

font-size:28px;

padding:15px;

margin:8px 0;

border-radius:10px;

border:2px solid #888;

}



button{

width:100%;

font-size:28px;

padding:18px;

margin:8px 0;

border-radius:15px;

border:none;

background:#ffffff;

box-shadow:0 2px 5px #999;

}



button:active{

background:#ddd;

}



#gpsStatus{

font-size:28px;

font-weight:bold;

margin-top:10px;

}



#lastSend{

font-size:24px;

}



#map{

height:55vh;

width:100%;

border-radius:15px;

box-shadow:0 2px 5px #999;

}



.user{

background:white;

border-radius:15px;

padding:20px;

margin:15px 0;

font-size:26px;

box-shadow:0 2px 6px #999;

}



.online{

color:green;

font-weight:bold;

}



.offline{

color:red;

font-weight:bold;

}


/* スマホ横向き対応 */

@media screen and (max-width:600px){


body{

font-size:22px;

}


h2{

font-size:30px;

}


input{

font-size:24px;

}


button{

font-size:24px;

}


#map{

height:50vh;

}


}


</style>

</head>


<body>


<h2>
📍 GPS位置共有システム
</h2>


<div class="card">

<h3>👤 隊員情報</h3>


<label>
名前
</label>

<input id="name" value="隊員A">


<label>
💧 水量
</label>

<input id="water" 
type="number"
value="100">


<label>
⛽ 燃料
</label>

<input id="fuel"
type="number"
value="100">


<label>
📍 次の目的地
</label>

<input id="destination">


</div>


<div class="card">


<button onclick="startGPS()">

📡 GPS開始

</button>


<button onclick="updateStatus()">

🔄 状態更新

</button>


<div id="gpsStatus">

🔴 GPS停止中

</div>


<div id="lastSend">

最終送信：-

</div>


</div>


<hr>


<div id="map"></div>


<h3>
👥 接続ユーザー
</h3>


<div id="users"></div>

<script>


//=====================
// Socket.IO
//=====================

const socket = io();


//=====================
// localStorage復元
//=====================

window.onload=function(){


let name =
localStorage.getItem("name");


let water =
localStorage.getItem("water");


let fuel =
localStorage.getItem("fuel");


let destination =
localStorage.getItem("destination");



if(name)
document.getElementById("name").value=name;


if(water)
document.getElementById("water").value=water;


if(fuel)
document.getElementById("fuel").value=fuel;


if(destination)
document.getElementById("destination").value=destination;



}




//=====================
// 地図
//=====================

const map =
L.map('map')
.setView(
[32.803,130.707],
13
);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'OpenStreetMap'

}

)

.addTo(map);





let markers={};


let lastLat=0;

let lastLon=0;


let watchID=null;



const MOVE_DISTANCE=10;






//=====================
// GPS開始
//=====================


function startGPS(){



if(watchID!==null){


alert(
"GPSはすでに開始しています"
);


return;

}



watchID =

navigator.geolocation.watchPosition(



(position)=>{


let lat =
position.coords.latitude;


let lon =
position.coords.longitude;




// 初回送信

if(lastLat===0){


sendLocation(
lat,
lon
);


lastLat=lat;

lastLon=lon;


return;


}




let distance =
getDistance(

lastLat,
lastLon,
lat,
lon

);



if(distance >= MOVE_DISTANCE){


sendLocation(
lat,
lon
);


lastLat=lat;

lastLon=lon;


}



},



(error)=>{


alert(
"位置情報取得失敗"
);


},



{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0


}



);



}







//=====================
// 位置送信
//=====================


function sendLocation(lat,lon){



// 保存

localStorage.setItem(

"name",

document.getElementById("name").value

);


localStorage.setItem(

"water",

document.getElementById("water").value

);


localStorage.setItem(

"fuel",

document.getElementById("fuel").value

);


localStorage.setItem(

"destination",

document.getElementById("destination").value

);






document.getElementById(
"gpsStatus"
)

.innerHTML=

"🟢 GPS稼働中";



document.getElementById(
"lastSend"
)

.innerHTML=

"最終送信："+
new Date()
.toLocaleTimeString();





socket.emit(

"location",

{


name:

document.getElementById("name").value,


lat:lat,


lon:lon,


water:

Number(
document.getElementById("water").value
),


fuel:

Number(
document.getElementById("fuel").value
),


destination:

document.getElementById("destination").value



}


);



}







//=====================
// 手動更新
//=====================


function updateStatus(){


navigator.geolocation.getCurrentPosition(


(pos)=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


},


()=>{

alert(
"位置取得失敗"
);

}


);



}







//=====================
// 距離計算
//=====================


function getDistance(

lat1,
lon1,
lat2,
lon2

){


const R=6371000;


const dLat =
(lat2-lat1)
*
Math.PI/180;


const dLon =
(lon2-lon1)
*
Math.PI/180;



const a =

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)**2;



return R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);



}





//=====================
// ユーザー削除
//=====================

function deleteUser(name){


if(confirm(name+" を削除しますか？")){


socket.emit(

"deleteUser",

name

);


}


}




//=====================
// 表示用関数
//=====================


function statusText(user){


return user.online ?

"🟢 オンライン":

"🔴 オフライン";


}



function statusClass(user){


return user.online ?

"online":

"offline";


}



function formatTime(t){


if(!t)

return "不明";


return new Date(t)
.toLocaleString();


}





//=====================
// ユーザー位置へ移動
//=====================


function focusUser(name){


if(markers[name]){


let pos =
markers[name]
.getLatLng();



map.setView(

[
pos.lat,
pos.lng
],

16

);



markers[name]
.openPopup();


}


}








//=====================
// 位置情報受信
//=====================


socket.on(

"locations",

(users)=>{


let html="";




// 不要マーカー削除

Object.keys(markers)
.forEach(

(name)=>{


if(!users[name]){


map.removeLayer(
markers[name]
);


delete markers[name];


}


}

);







Object.keys(users)
.forEach(

(name)=>{


let user =
users[name];



let color =

user.online ?

"green":

"red";





// マーカー作成・更新


if(markers[name]){


markers[name]
.setLatLng(

[
user.lat,
user.lon
]

);


}

else{


markers[name]=


L.circleMarker(

[
user.lat,
user.lon
],

{


radius:12,

color:color,

fillOpacity:0.8


}

)

.addTo(map);


}





markers[name]
.setStyle(

{

color:color

}

);





markers[name]
.bindPopup(

`

<b>
${user.name}
</b>

<br>

${statusText(user)}

<br>

💧 水量：
${user.water}

<br>

⛽ 燃料：
${user.fuel}

<br>

📍 目的地：
${user.destination}

<br>

🕒 更新：
${formatTime(user.lastUpdate)}

`

);








// 一覧表示


html +=


`

<div class="user"

onclick="focusUser('${user.name}')">


<b>

${user.name}

</b>


<br>


<span class="${statusClass(user)}">

${statusText(user)}

</span>


<br>


💧 水量：
${user.water}


<br>


⛽ 燃料：
${user.fuel}


<br>


📍 目的地：
${user.destination}


<br>


🕒 最終更新：

${formatTime(user.lastUpdate)}


<br><br>



<button

onclick="event.stopPropagation();deleteUser('${user.name}')">

🗑 削除

</button>



</div>


`;



}


);





document.getElementById("users")
.innerHTML=html;



}


);




</script>


</body>

</html>
