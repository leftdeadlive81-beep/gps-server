<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>現在位置自動共有君 Version 2.2</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>


<style>

body{
    font-family:sans-serif;
    margin:6px;
    background:#f5f5f5;
    font-size:16px;
}


h2{
    font-size:22px;
    text-align:center;
    margin:8px;
}


h3{
    font-size:18px;
    margin:5px 0;
}


.card{

    background:white;
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
    box-shadow:0 1px 3px #aaa;

}


input,select{

    width:95%;
    font-size:18px;
    padding:6px;
    margin:3px;
    border-radius:6px;
    border:1px solid #888;

}


button{

    font-size:18px;
    padding:8px;
    margin:4px;
    width:48%;
    border-radius:8px;

}


#gpsStatus{

    font-size:18px;
    font-weight:bold;

}


#lastSend{

    font-size:16px;

}


#map{

    height:65vh;
    width:100%;
    border-radius:10px;

}


.inputRow{

    display:flex;
    gap:5px;

}


.inputRow input{

    width:45%;

}


.inputRow select{

    width:45%;
    font-size:18px;
    padding:6px;

}


#destination{

    width:95%;

}


</style>


</head>


<body>


<h2>
現在位置自動共有君
</h2>


<div class="card">

<h3>
👤 使用者情報
</h3>


<div class="inputRow">

<input 
id="name"
value="隊員A"
placeholder="名前">


<select id="iconType">

<option value="person">
👤隊員
</option>

<option value="vehicle">
🚙車両
</option>

</select>

</div>


<div class="inputRow">

<input 
id="water"
type="number"
value="100"
placeholder="💧水量">


<input 
id="fuel"
type="number"
value="100"
placeholder="⛽燃料">

</div>


<input
id="destination"
value=""
placeholder="📍次の目的地">


</div>




<div class="card">


<button onclick="startGPS()">

📡 GPS開始

</button>



<button onclick="updateStatus()">

🔄 現在地報告

</button>



<div id="gpsStatus">

🔴 GPS停止中

</div>



<div id="lastSend">

最終送信：-

</div>


</div>



<hr>


<div id="map"></div>





<div class="card">

<h3>📍地点登録</h3>


<input id="pointName" 
placeholder="地点名（例：CP1、給水所）">


<select id="pointType">

<option value="CP">
🏳 指揮所(CP)
</option>

<option value="water">
💧 給水所
</option>

<option value="supply">
📦 補給地点
</option>

<option value="point">
📍 その他
</option>

</select>


<button onclick="addPoint()">
📍登録
</button>


</div>


<h3>
👥 接続ユーザー
</h3>


<div id="users"></div>




<script>


const socket = io();



//=====================
// Socket接続
//=====================


socket.on("connect",()=>{


console.log("サーバー接続");


document.getElementById("gpsStatus").innerHTML=
"🟢 サーバー接続";


if(watchID!==null){

navigator.geolocation.getCurrentPosition(

pos=>{

sendLocation(
pos.coords.latitude,
pos.coords.longitude
);

}

);

}


});



socket.on("disconnect",()=>{


document.getElementById("gpsStatus").innerHTML=
"🔴 サーバー切断";


});





//=====================
// 保存データ復元
//=====================


window.onload=function(){


[
"name",
"water",
"fuel",
"destination",
"iconType"

].forEach(key=>{


let value=localStorage.getItem(key);


if(value){

document.getElementById(key).value=value;

}


});



if(localStorage.getItem("gpsRunning")==="true"){


setTimeout(()=>{

startGPS();

},1000);


}


};





//=====================
// 地図
//=====================


const map=L.map('map')
.setView(
[32.803,130.707],
13
);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'OpenStreetMap'

}

).addTo(map);




let markers={};

let pointMarkers={};


let lastLat=0;

let lastLon=0;

let lastSendTime=0;


const SEND_INTERVAL=30000;

const MOVE_DISTANCE=10;


let watchID=null;

let gpsTimer=null;



//=====================
// 地点登録
//=====================


let selectedPointLat=null;

let selectedPointLon=null;



map.on("click",function(e){


selectedPointLat=e.latlng.lat;

selectedPointLon=e.latlng.lng;


alert(

"地点候補\n"+
"緯度:"+selectedPointLat.toFixed(6)+
"\n経度:"+selectedPointLon.toFixed(6)

);


});




function addPoint(){


if(selectedPointLat===null){

alert("先に地図をクリックしてください");

return;

}



let name =
document.getElementById("pointName")
.value
.trim();



if(name===""){

alert("地点名を入力してください");

return;

}



let marker=L.marker(

[
selectedPointLat,
selectedPointLon
],

{

icon:L.icon({

iconUrl:"/icon/point.png",


iconSize:[60,60],
iconAnchor:[30,60]

})

}

)

.addTo(map);



marker.bindPopup(

`
<b>📍${name}</b>

<br>

${selectedPointLat.toFixed(6)}

<br>

${selectedPointLon.toFixed(6)}

`

);



pointMarkers[name]=marker;




// サーバーへ保存

socket.emit(

"addPoint",

{

name:name,

type:
document.getElementById("pointType").value,

lat:selectedPointLat,

lon:selectedPointLon

}

);



// 入力欄クリア

document.getElementById("pointName").value="";



alert(

name+"を登録しました"

);


}



//=====================
// GPS開始
//=====================


function startGPS(){


localStorage.setItem(
"gpsRunning",
"true"
);



if(watchID!==null){

alert("GPSはすでに開始しています");

return;

}



gpsTimer=setInterval(()=>{


console.log(
"30秒タイマー動作"
);



navigator.geolocation.getCurrentPosition(


pos=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


},


error=>{

console.log(
"GPS取得失敗",
error
);

}


);



},30000);







watchID=navigator.geolocation.watchPosition(


pos=>{


let lat=pos.coords.latitude;

let lon=pos.coords.longitude;



if(lastLat===0){



sendLocation(

lat,

lon

);



lastLat=lat;

lastLon=lon;

lastSendTime=Date.now();



return;


}





let distance=getDistance(

lastLat,

lastLon,

lat,

lon

);



let now=Date.now();



if(

distance>=MOVE_DISTANCE ||

now-lastSendTime>=SEND_INTERVAL

){



sendLocation(

lat,

lon

);



lastLat=lat;

lastLon=lon;


lastSendTime=now;


}



},



error=>{


console.log(error);


alert(
"位置情報取得失敗"
);


},



{


enableHighAccuracy:true,


timeout:10000,


maximumAge:0



}



);


}







//=====================
// 状態送信
//=====================


function sendLocation(

lat,

lon

){



//=====================
// UTM変換
//=====================


let utm = proj4(

'EPSG:4326',


'+proj=utm +zone=52 +south +datum=WGS84',


[

lon,

lat

]

);



let utmE=Math.round(
utm[0]
);


let utmN=Math.round(
utm[1]
);



console.log(

"UTM",

utmE,

utmN

);







//=====================
// 保存
//=====================


[

"name",

"water",

"fuel",

"destination",

"iconType"

].forEach(key=>{


localStorage.setItem(

key,

document.getElementById(key).value

);


});







document.getElementById("gpsStatus")

.innerHTML=


"🟢 GPS稼働中";





document.getElementById("lastSend")

.innerHTML=


"最終送信："+

new Date()

.toLocaleTimeString();








socket.emit(

"location",

{


name:

document.getElementById("name").value,



lat:lat,



lon:lon,



utmZone:

"52S",



utmE:

utmE,



utmN:

utmN,




water:

Number(

document.getElementById("water").value

),




fuel:

Number(

document.getElementById("fuel").value

),




destination:

document.getElementById("destination").value,




// アイコン種類

iconType:

document.getElementById("iconType").value



}



);



}








//=====================
// 状態更新
//=====================


function updateStatus(){


navigator.geolocation.getCurrentPosition(


pos=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


}



);


}








//=====================
// 距離計算
//=====================


function getDistance(

lat1,

lon1,

lat2,

lon2

){



const R=6371000;



const dLat=

(lat2-lat1)

*

Math.PI/180;



const dLon=

(lon2-lon1)

*

Math.PI/180;





const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)**2;



return R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);



}

//=====================
// 表示補助
//=====================


function statusText(user){


return user.online ?

"🟢 オンライン":

"🔴 オフライン";


}



function formatTime(t){


if(!t)

return "不明";


return new Date(t)

.toLocaleString();


}






//=====================
// アイコン設定
//=====================


function createIcon(type){


let image;



if(type==="vehicle"){


image="/icon/vehicle.png";


}

else{


image="/icon/person.png";


}



return L.icon({

iconUrl:image,

iconSize:[60,60],

iconAnchor:[30,60],

popupAnchor:[0,-0]

});


}






//=====================
// ユーザー位置へ移動
//=====================


function focusUser(name){



if(markers[name]){


let pos=markers[name].getLatLng();



map.setView(

[

pos.lat,

pos.lng

],

17

);



markers[name].openPopup();



}


}







//=====================
// ユーザー情報受信
//=====================


socket.on(

"locations",

(users)=>{



let html="";




// 消えたユーザー削除

Object.keys(markers).forEach(

name=>{


if(!users[name]){


map.removeLayer(

markers[name]

);


delete markers[name];


}


}

);







Object.keys(users).forEach(

name=>{



let user=users[name];



let icon=createIcon(

user.iconType

);





if(markers[name]){


markers[name].setLatLng(

[

user.lat,

user.lon

]

);



markers[name].setIcon(icon);



}

else{


markers[name]=L.marker(

[

user.lat,

user.lon

],

{

icon:icon

}

)

.addTo(map);



}






markers[name].bindPopup(

`

<b>${user.name}</b>

<br>

${statusText(user)}

<hr>

💧水量：
${user.water}

<br>

⛽燃料：
${user.fuel}

<br>

📍目的地：
${user.destination || "-"}

<br><br>

UTM ${user.utmZone || "52S"}

<br>

E:${user.utmE || ""}

<br>

N:${user.utmN || ""}

<br><br>

🕒
${formatTime(user.lastUpdate)}

`

);







html+=


`

<div class="card"

onclick="focusUser('${user.name}')">


<div style="font-size:18px;font-weight:bold">

${statusText(user)}

${user.name}

</div>



<div>

💧 ${user.water}

&nbsp;

⛽ ${user.fuel}

</div>



<div>

📍 ${user.destination || "-"}

</div>



<div style="font-size:12px">

${user.utmZone || "52S"}

 E:${user.utmE || ""}

 N:${user.utmN || ""}

</div>



<div style="font-size:12px">

更新：

${formatTime(user.lastUpdate)}

</div>



</div>


`;



}

);



document.getElementById("users")

.innerHTML=html;



}

);





//=====================
// 地点受信
//=====================

socket.on(
"points",
(points)=>{


console.log("受信points", points);


if(!points){
    console.log("地点データなし");
    return;
}



Object.keys(points).forEach(

name=>{


let p=points[name];



// 既存地点がある場合は削除
if(pointMarkers[name]){

    map.removeLayer(pointMarkers[name]);

}



let marker=L.marker(

[
p.lat,
p.lon
],

{

icon:L.icon({

iconUrl:"/icon/point.png",

iconSize:[60,60],

iconAnchor:[30,60]

})

}

)

.addTo(map);



marker.bindPopup(

`

<b>📍${name}</b>

<br>

${p.lat.toFixed(6)}

<br>

${p.lon.toFixed(6)}

`

);



pointMarkers[name]=marker;



}

);



}

);









</script>


</body>

</html>
