<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>GPS位置共有システム</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>


<style>

body {
    font-family: sans-serif;
    margin:20px;
}

#map {
    height:500px;
    width:100%;
}

input {
    margin:5px;
    padding:5px;
}

button {
    padding:8px;
    margin:5px;
}

.user {
    border:1px solid #aaa;
    padding:10px;
    margin:5px;
}

</style>


</head>


<body>


<h2>GPS位置共有システム</h2>


<div>


名前：

<input id="name" value="隊員A">


<br>


所持金：

<input id="money" type="number" value="0">


<br>


燃料：

<input id="fuel" type="number" value="100">


<br>


装備数：

<input id="equipment" type="number" value="0">


<br>


<button onclick="startGPS()">
GPS開始
</button>


<button onclick="updateStatus()">
状態更新
</button>


</div>


<br>


<div id="map"></div>


<h3>接続ユーザー</h3>

<div id="users"></div>



<script>


const socket = io();


//====================
// 地図
//====================

const map = L.map('map')
.setView(
    [32.803,130.707],
    13
);


L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{
    attribution:'OpenStreetMap'
}

).addTo(map);


let markers={};



//====================
// GPS
//====================

let myPosition={

    lat:0,
    lon:0

};



function startGPS(){


if(!navigator.geolocation){

    alert("GPSが利用できません");
    return;

}



navigator.geolocation.watchPosition(


(position)=>{


    myPosition.lat =
    position.coords.latitude;


    myPosition.lon =
    position.coords.longitude;


    sendLocation();


},


(error)=>{

    alert("位置情報取得失敗");

},


{

enableHighAccuracy:true,

maximumAge:0,

timeout:10000

}


);


}



//====================
// GPS送信
//====================

function sendLocation(){


const data={


name:
document.getElementById("name").value,


lat:
myPosition.lat,


lon:
myPosition.lon,


money:
Number(
document.getElementById("money").value
),


fuel:
Number(
document.getElementById("fuel").value
),


equipment:
Number(
document.getElementById("equipment").value
)


};


socket.emit(
"location",
data
);


}



//====================
// 状態だけ更新
//====================

function updateStatus(){


sendLocation();


}



//====================
// 受信
//====================

socket.on(

"locations",

(users)=>{


let html="";


Object.keys(users).forEach(id=>{


const user=users[id];



// マーカー更新

if(markers[id]){


markers[id]
.setLatLng(
[user.lat,user.lon]
);


}else{


markers[id]=
L.marker(
[user.lat,user.lon]
)
.addTo(map);


}



markers[id].bindPopup(

`

<b>${user.name}</b><br>

緯度:${user.lat}<br>

経度:${user.lon}<br>

💰 所持金:${user.money} 円<br>

⛽ 燃料:${user.fuel}<br>

🎒 装備:${user.equipment}

`

);



html +=

`

<div class="user">

<b>${user.name}</b><br>

緯度:${user.lat}<br>

経度:${user.lon}<br>

💰 所持金:${user.money} 円<br>

⛽ 燃料:${user.fuel}<br>

🎒 装備:${user.equipment}

</div>

`;



});



document.getElementById("users")
.innerHTML=html;



});


</script>


</body>

</html>
