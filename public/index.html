<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>GPS位置共有システム</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>


<style>

body{
font-family:sans-serif;
margin:20px;
}


#map{
height:500px;
width:100%;
}


input{
margin:5px;
padding:5px;
}


button{
padding:8px;
margin:5px;
}


.user{
border:1px solid #aaa;
padding:10px;
margin:5px;
}


.online{
color:green;
font-weight:bold;
}


.offline{
color:red;
font-weight:bold;
}

</style>


</head>


<body>


<h2>GPS位置共有システム</h2>


名前：

<input id="name" value="隊員A">

<br>


水量：

<input id="water" type="number" value="100">


<br>


燃料：

<input id="fuel" type="number" value="100">


<br>


次の目的地：

<input id="destination" value="">


<br>


<button onclick="startGPS()">
GPS開始
</button>


<button onclick="updateStatus()">
状態更新
</button>


<hr>


<div id="map"></div>


<h3>接続ユーザー</h3>

<div id="users"></div>



<script>


const socket=io();



const map=L.map('map')
.setView(
[32.803,130.707],
13
);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'OpenStreetMap'
}
)
.addTo(map);



let markers={};



let lastLat=0;
let lastLon=0;



const MOVE_DISTANCE=10;



//=====================
// GPS開始
//=====================

function startGPS(){


navigator.geolocation.watchPosition(

(pos)=>{


let lat=
pos.coords.latitude;


let lon=
pos.coords.longitude;



let distance=
getDistance(
lastLat,
lastLon,
lat,
lon
);



if(
lastLat===0 ||
distance>=MOVE_DISTANCE
){


sendLocation(
lat,
lon
);


lastLat=lat;
lastLon=lon;


}


},


()=>{

alert(
"位置情報取得失敗"
);

},


{
enableHighAccuracy:true,
timeout:10000
}


);


}




//=====================
// 送信
//=====================

function sendLocation(lat,lon){


socket.emit(

"location",

{


name:
document.getElementById("name").value,


lat:lat,

lon:lon,


water:
Number(
document.getElementById("water").value
),


fuel:
Number(
document.getElementById("fuel").value
),


destination:
document.getElementById("destination").value


}

);


}




function updateStatus(){


navigator.geolocation.getCurrentPosition(

(pos)=>{

sendLocation(
pos.coords.latitude,
pos.coords.longitude
);

}

);


}




//=====================
// 距離計算
//=====================

function getDistance(
lat1,
lon1,
lat2,
lon2
){


if(lat1===0)
return 99999;


const R=6371000;


const dLat=
(lat2-lat1)
*Math.PI/180;


const dLon=
(lon2-lon1)
*Math.PI/180;



const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)
*
Math.cos(lat2*Math.PI/180)
*
Math.sin(dLon/2)**2;



return R*
2*
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


}



//=====================
// 状態表示
//=====================

function statusText(user){


if(user.online){

return "🟢 オンライン";

}

else{

return "🔴 オフライン";

}


}



function statusClass(user){


return user.online ?
"online":
"offline";


}



function formatTime(t){


if(!t)
return "不明";


return new Date(t)
.toLocaleString();


}



//=====================
// 受信
//=====================

socket.on(

"locations",

(users)=>{


let html="";



Object.keys(users)
.forEach(

(name)=>{


let user=users[name];



// マーカー更新

let color =
user.online ?
"green":
"red";



if(markers[name]){


markers[name]
.setLatLng(
[
user.lat,
user.lon
]
);


}

else{


markers[name]=

L.circleMarker(

[
user.lat,
user.lon
],

{

radius:10,

color:color

}

)
.addTo(map);


}



markers[name]
.setStyle(
{
color:color
}
);



markers[name]
.bindPopup(

`

<b>${user.name}</b><br>

${statusText(user)}<br>

💧 水量:${user.water}<br>

⛽ 燃料:${user.fuel}<br>

📍 次の目的地:${user.destination}<br>

最終更新:${formatTime(user.lastUpdate)}

`

);





html+=

`

<div class="user">

<b>${user.name}</b><br>

<span class="${statusClass(user)}">

${statusText(user)}

</span>

<br>

💧 水量:${user.water}<br>

⛽ 燃料:${user.fuel}<br>

📍 次の目的地:${user.destination}<br>

最終更新:${formatTime(user.lastUpdate)}

</div>

`;



}

);



document.getElementById("users")
.innerHTML=html;



}

);


</script>


</body>

</html>
