<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS位置共有システム</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>



<style>


body{

font-family:sans-serif;

margin:10px;

background:#f5f5f5;

font-size:24px;

}



h2{

font-size:32px;

text-align:center;

}


h3{

font-size:28px;

}



.card{

background:white;

border-radius:15px;

padding:20px;

margin-bottom:15px;

box-shadow:0 2px 5px #aaa;

}



input,select{

width:90%;

font-size:26px;

padding:14px;

margin:8px;

border-radius:10px;

border:1px solid #888;

}



button{

font-size:26px;

padding:15px;

margin:8px;

width:95%;

border-radius:12px;

}



#gpsStatus{

font-size:26px;

font-weight:bold;

}



#lastSend{

font-size:24px;

}



#map{

height:55vh;

width:100%;

border-radius:15px;

}



.user{

background:white;

border-radius:15px;

padding:20px;

margin:15px 0;

box-shadow:0 2px 5px #aaa;

font-size:24px;

cursor:pointer;

}



.online{

color:green;

font-weight:bold;

}


.offline{

color:red;

font-weight:bold;

}



</style>


</head>



<body>



<h2>
-GPS system-
</h2>



<div class="card">


<h3>
隊員情報
</h3>


名前

<br>


<input id="name" value="隊員A">


<br>


🖼 アイコン

<br>


<select id="iconType">


<option value="person">

👤 隊員

</option>


<option value="vehicle">

🚙 車両

</option>


</select>



<br>


💧 水量

<br>


<input id="water" type="number" value="100">



<br>


⛽ 燃料

<br>


<input id="fuel" type="number" value="100">



<br>


📍 次の目的地

<br>


<input id="destination" value="">



</div>





<div class="card">


<button onclick="startGPS()">

📡 GPS開始

</button>



<button onclick="updateStatus()">

🔄 状態更新

</button>



<div id="gpsStatus">

🔴 GPS停止中

</div>



<div id="lastSend">

最終送信：-

</div>



</div>



<hr>



<div id="map"></div>



<h3>
👥 接続ユーザー
</h3>



<div id="users"></div>




<script>


const socket = io();



//=====================
// 保存データ復元
//=====================


window.onload=function(){


[
"name",
"water",
"fuel",
"destination",
"iconType"

].forEach(key=>{


let value=

localStorage.getItem(key);



if(value){

document.getElementById(key).value=value;

}


});


}




//=====================
// 地図
//=====================


const map=L.map('map')
.setView(
[32.803,130.707],
13
);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'OpenStreetMap'

}

).addTo(map);




let markers={};


let lastLat=0;

let lastLon=0;


let lastSendTime=0;


const SEND_INTERVAL=60000;


const MOVE_DISTANCE=10;


let watchID=null;


let gpsTimer=null;




//=====================
// GPS開始
//=====================


function startGPS(){


if(watchID!==null){

alert("GPSはすでに開始しています");

return;

}



gpsTimer=setInterval(()=>{


navigator.geolocation.getCurrentPosition(

pos=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


}

);


},60000);





watchID=navigator.geolocation.watchPosition(


pos=>{


let lat=pos.coords.latitude;

let lon=pos.coords.longitude;



if(lastLat===0){


sendLocation(lat,lon);


lastLat=lat;

lastLon=lon;

lastSendTime=Date.now();


return;


}


let distance=getDistance(

lastLat,
lastLon,
lat,
lon

);


let now=Date.now();



if(

distance>=MOVE_DISTANCE ||

now-lastSendTime>=SEND_INTERVAL

){


sendLocation(lat,lon);


lastLat=lat;

lastLon=lon;


lastSendTime=now;


}



},


error=>{

console.log(error);

alert("位置情報取得失敗");

},


{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0

}



);

}


//=====================
// 状態送信
//=====================


function sendLocation(lat,lon){



// 保存

[
"name",
"water",
"fuel",
"destination",
"iconType"

].forEach(key=>{


localStorage.setItem(

key,

document.getElementById(key).value

);


});





document.getElementById("gpsStatus")
.innerHTML=

"🟢 GPS稼働中";





document.getElementById("lastSend")
.innerHTML=

"最終送信："+
new Date()
.toLocaleTimeString();





socket.emit(

"location",

{


name:

document.getElementById("name").value,


lat:lat,


lon:lon,



water:

Number(

document.getElementById("water").value

),



fuel:

Number(

document.getElementById("fuel").value

),



destination:

document.getElementById("destination").value,



// ★追加
// アイコン種類

iconType:

document.getElementById("iconType").value



}


);



}





//=====================
// 状態更新
//=====================


function updateStatus(){


navigator.geolocation.getCurrentPosition(


pos=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


}


);


}







//=====================
// 距離計算
//=====================


function getDistance(

lat1,

lon1,

lat2,

lon2

){


const R=6371000;



const dLat=

(lat2-lat1)

*

Math.PI/180;



const dLon=

(lon2-lon1)

*

Math.PI/180;



const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)**2;



return R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


}





//=====================
// 削除
//=====================


function deleteUser(name){


if(confirm(name+"を削除しますか？")){


socket.emit(

"deleteUser",

name

);


}


}




//=====================
// 表示補助
//=====================


function statusText(user){


return user.online ?

"🟢 オンライン":

"🔴 オフライン";


}



function statusClass(user){


return user.online ?

"online":

"offline";


}



function formatTime(t){


if(!t)

return "不明";


return new Date(t)

.toLocaleString();


}






//=====================
// アイコン設定
//=====================


// PNG画像に変更する場合は
// public/icon/ に以下を配置します


// person.png
// vehicle.png



function createIcon(type){


let image;



if(type==="vehicle"){


image="/icon/vehicle.png";


}

else{


image="/icon/person.png";


}





return L.icon({

iconUrl:image,


iconSize:[70,70],


iconAnchor:[50,60],


popupAnchor:[0,-50]


});


}






//=====================
// ユーザー位置へ移動
//=====================


function focusUser(name){



if(markers[name]){


let pos=

markers[name].getLatLng();



map.setView(

[

pos.lat,

pos.lng

],

16

);



markers[name].openPopup();


}


}

//=====================
// ユーザー情報受信
//=====================


socket.on(

"locations",

(users)=>{


let html="";



// 消えたユーザーのマーカー削除

Object.keys(markers).forEach(

(name)=>{


if(!users[name]){


map.removeLayer(

markers[name]

);


delete markers[name];


}


}

);





Object.keys(users).forEach(

(name)=>{


let user=users[name];


console.log("受信データ",user);


// アイコン種類

let icon=createIcon(

user.iconType

);




// マーカー更新

if(markers[name]){


// 古い丸マーカーの場合は作り直す

if(markers[name] && markers[name]._radius){

    map.removeLayer(markers[name]);

    delete markers[name];

}


}


if(markers[name]){


markers[name].setLatLng(
[
user.lat,
user.lon
]
);


markers[name].setIcon(icon);


}
else{


markers[name]=L.marker(

[
user.lat,
user.lon
],

{
icon:icon
}

)

.addTo(map);


}





// アイコン変更対応

markers[name].setIcon(icon);







// ポップアップ


markers[name].bindPopup(

`

<b>${user.name}</b>

<br>

${statusText(user)}

<br><br>

💧 水量：

${user.water}

<br>

⛽ 燃料：

${user.fuel}

<br>

📍 目的地：

${user.destination}

<br>

🖼 アイコン：

${user.iconType==="vehicle" ?

"車両":

"隊員"}

<br>

🕒 更新：

${formatTime(user.lastUpdate)}

`

);







// ユーザー一覧


html +=


`

<div class="user"

onclick="focusUser('${user.name}')">


<b>

${user.name}

</b>


<br>


<span class="${statusClass(user)}">

${statusText(user)}

</span>


<br><br>


💧 水量：

${user.water}


<br>


⛽ 燃料：

${user.fuel}


<br>


📍 目的地：

${user.destination}


<br>


🖼 アイコン：

${user.iconType==="vehicle" ?

"🚙車両":

"👤隊員"}



<br>


🕒 最終更新：

${formatTime(user.lastUpdate)}



</div>


`;



}


);



document.getElementById("users")

.innerHTML=html;



}


);


</script>

</body>

</html>
