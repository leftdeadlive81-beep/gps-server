<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>現在位置自動共有君 Version 2.3</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>


<style>

/* =========================================
   基本
========================================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    font-family:sans-serif;

    background:#f5f5f5;

    overflow:hidden;
}


body{

    display:flex;

    flex-direction:column;

}


/* =========================================
   タブ
========================================= */

#tabs{

    height:52px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    background:#222;

    flex-shrink:0;

    z-index:1000;

}


.tabButton{

    border:none;

    border-radius:0;

    margin:0;

    padding:4px 2px;

    width:100%;

    background:#333;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

}


.tabButton.active{

    background:#1976d2;

}


.tabIcon{

    display:block;

    font-size:19px;

    line-height:21px;

}


.tabText{

    display:block;

    font-size:12px;

}


/* =========================================
   タブ本体
========================================= */

.tabContent{

    display:none;

    flex:1;

    min-height:0;

    overflow:hidden;

}


.tabContent.active{

    display:flex;

    flex-direction:column;

}


/* =========================================
   地図タブ
========================================= */

#mapTab{

    position:relative;

}


#map{

    flex:1;

    min-height:0;

    width:100%;

}


/* =========================================
   GPS操作エリア
========================================= */

#gpsPanel{

    flex-shrink:0;

    background:white;

    border-top:1px solid #bbb;

    padding:5px;

}


.gpsButtonRow{

    display:flex;

    gap:6px;

}


.gpsButtonRow button{

    flex:1;

    margin:0;

    padding:9px 4px;

    font-size:16px;

    border-radius:7px;

    border:1px solid #777;

    font-weight:bold;

}


.gpsButton{

    background:#4caf50;

    color:white;

}


.reportButton{

    background:#2196f3;

    color:white;

}


#gpsStatus{

    font-size:15px;

    font-weight:bold;

    margin-top:3px;

}


#lastSend{

    font-size:13px;

    color:#555;

}


/* =========================================
   共通カード
========================================= */

.card{

    background:white;

    border-radius:10px;

    padding:8px;

    margin:6px;

    box-shadow:0 1px 3px #aaa;

}


.sectionTitle{

    font-size:18px;

    font-weight:bold;

    margin:6px 8px;

}


/* =========================================
   隊員・車両タブ
========================================= */

#usersTab{

    overflow:auto;

}


.userHeader{

    display:grid;

    grid-template-columns:
        50px
        minmax(90px,1fr)
        55px
        55px
        65px
        48px;

    background:#ddd;

    font-weight:bold;

    font-size:12px;

    padding:6px 4px;

    flex-shrink:0;

}


.userRow{

    display:grid;

    grid-template-columns:
        50px
        minmax(90px,1fr)
        55px
        55px
        65px
        48px;

    align-items:center;

    background:white;

    border-bottom:1px solid #ccc;

    padding:8px 4px;

    font-size:13px;

    cursor:pointer;

}


.deleteButton{

    width:auto;

    font-size:12px;

    padding:4px 6px;

    margin:0;

    border-radius:5px;

    white-space:nowrap;

}


/* =========================================
   クロノロジー
========================================= */

#chronoTab{

    overflow:hidden;

}


#chronoInputArea{

    flex-shrink:0;

}


.chronoInputRow{

    display:flex;

    gap:5px;

}


#chronoMessage{

    flex:1;

    min-width:0;

    font-size:16px;

    padding:8px;

    border:1px solid #888;

    border-radius:6px;

}


#chronoSendButton{

    width:70px;

    margin:0;

    font-size:15px;

    padding:5px;

}


#timeline{

    flex:1;

    min-height:0;

    overflow-y:auto;

    background:#eee;

    margin:0 6px 6px 6px;

    border-radius:7px;

}


.timelineItem{

    background:white;

    border-bottom:1px solid #ccc;

    padding:7px 8px;

}


.timelineTime{

    font-size:11px;

    color:#666;

}


.timelineMessage{

    font-size:14px;

    margin-top:2px;

}


/* =========================================
   設定
========================================= */

#settingsTab{

    overflow:auto;

}


.settingsCard{

    margin:6px;

}


.inputRow{

    display:flex;

    gap:5px;

}


.inputRow input,
.inputRow select{

    flex:1;

    min-width:0;

}


input,
select{

    width:100%;

    font-size:17px;

    padding:7px;

    margin:3px 0;

    border-radius:6px;

    border:1px solid #888;

}


.settingsButton{

    width:100%;

    margin:5px 0 2px 0;

    font-size:16px;

    padding:9px;

    border-radius:7px;

}


#registerStatus{

    font-size:14px;

    padding:4px 0;

}


/* =========================================
   地点登録
========================================= */

.pointButtonRow{

    display:flex;

    gap:5px;

}


.pointButtonRow button{

    flex:1;

    margin:3px 0;

    padding:8px;

    font-size:15px;

}


.pointInfo{

    font-size:13px;

    color:#555;

    margin-top:3px;

}


/* =========================================
   地点ラベル
========================================= */

.pointLabel{

    background:#fff8dc;

    border:1px solid #888;

    border-radius:5px;

    padding:3px 6px;

    font-size:13px;

    font-weight:bold;

    color:#333;

}


/* =========================================
   Leaflet
========================================= */

.leaflet-control-layers{

    font-size:13px;

}


</style>

</head>


<body>


<!-- ========================================
     タブ
========================================= -->

<div id="tabs">

    <button
        class="tabButton active"
        onclick="showTab('mapTab',this)">

        <span class="tabIcon">🗺️</span>
        <span class="tabText">地図</span>

    </button>


    <button
        class="tabButton"
        onclick="showTab('usersTab',this)">

        <span class="tabIcon">👥</span>
        <span class="tabText">隊員・車両</span>

    </button>


    <button
        class="tabButton"
        onclick="showTab('chronoTab',this)">

        <span class="tabIcon">📋</span>
        <span class="tabText">クロノ</span>

    </button>


    <button
        class="tabButton"
        onclick="showTab('settingsTab',this)">

        <span class="tabIcon">⚙️</span>
        <span class="tabText">設定</span>

    </button>

</div>



<!-- ========================================
     地図タブ
========================================= -->

<div
    id="mapTab"
    class="tabContent active">

    <div id="map"></div>


    <div id="gpsPanel">

        <div class="gpsButtonRow">

            <button
                class="gpsButton"
                onclick="startGPS()">

                📡 GPS開始

            </button>


            <button
                class="reportButton"
                onclick="updateStatus()">

                🔄 現在地報告

            </button>

        </div>


        <div id="gpsStatus">

            🔴 GPS停止中

        </div>


        <div id="lastSend">

            最終送信：-

        </div>

    </div>

</div>



<!-- ========================================
     隊員・車両タブ
========================================= -->

<div
    id="usersTab"
    class="tabContent">

    <div class="sectionTitle">

        👥 接続ユーザー

    </div>


    <div class="userHeader">

        <div>状態</div>

        <div>名前</div>

        <div>💧水</div>

        <div>⛽燃料</div>

        <div>最終</div>

        <div>操作</div>

    </div>


    <div id="users"></div>

</div>



<!-- ========================================
     クロノロジータブ
========================================= -->

<div
    id="chronoTab"
    class="tabContent">


    <div
        id="chronoInputArea"
        class="card">

        <div class="chronoInputRow">

            <input
                id="chronoMessage"
                placeholder="活動内容を入力">


            <button
                id="chronoSendButton"
                onclick="sendChronology()">

                送信

            </button>

        </div>

    </div>


    <div id="timeline"></div>

</div>



<!-- ========================================
     設定タブ
========================================= -->

<div
    id="settingsTab"
    class="tabContent">

    <div class="card settingsCard">

        <div class="sectionTitle">

            👤 使用者情報

        </div>


        <div class="inputRow">

            <input
                id="name"
                value="隊員A"
                placeholder="名前">


            <select id="iconType">

                <option value="1">
                    👤 隊員
                </option>

                <option value="2">
                    🚙 小型
                </option>

                <option value="3">
                    🚚 中型
                </option>

                <option value="4">
                    🚛 大型
                </option>

            </select>

        </div>


        <div class="inputRow">

            <input
                id="water"
                type="number"
                value="100"
                placeholder="💧水量">


            <input
                id="fuel"
                type="number"
                value="100"
                placeholder="⛽燃料">

        </div>


        <input
            id="destination"
            placeholder="📍次の目的地">


        <button
            class="settingsButton"
            onclick="registerUser()">

            👤 ユーザー登録

        </button>


        <div id="registerStatus">

            未登録

        </div>

    </div>



    <!-- 地点登録 -->

    <div class="card settingsCard">

        <div class="sectionTitle">

            📍 地点登録

        </div>


        <input
            id="pointName"
            placeholder="地点名（例：CP1、給水所）">


        <select id="pointType">

            <option value="CP">
                🏳 指揮所(CP)
            </option>

            <option value="water">
                💧給水所
            </option>

            <option value="supply">
                📦補給地点
            </option>

            <option value="point">
                📍その他
            </option>

        </select>


        <div class="pointButtonRow">

            <button
                onclick="addPoint()">

                📍登録

            </button>


            <button
                onclick="deletePoint()">

                🗑削除

            </button>

        </div>


        <div class="pointInfo">

            地図をクリックして登録位置を選択

        </div>

    </div>

</div>



<script>


/* =========================================
   Socket.IO
========================================= */

const socket = io();


let registered=false;


let markers={};

let pointMarkers={};


let chronology=[];


let watchID=null;

let gpsTimer=null;


let lastLat=0;

let lastLon=0;

let lastSendTime=0;


const SEND_INTERVAL=30000;

const MOVE_DISTANCE=10;


/* =========================================
   タブ切替
========================================= */

function showTab(tabId,button){

    document
        .querySelectorAll(".tabContent")
        .forEach(tab=>{

            tab.classList.remove("active");

        });


    document
        .querySelectorAll(".tabButton")
        .forEach(btn=>{

            btn.classList.remove("active");

        });


    document
        .getElementById(tabId)
        .classList.add("active");


    button.classList.add("active");


    /* 地図タブに戻ったとき
       Leafletの表示サイズを再計算 */

    if(tabId==="mapTab"){

        setTimeout(()=>{

            map.invalidateSize();

        },100);

    }

}


/* =========================================
   アイコン種類変換
========================================= */

function normalizeIconType(type){

    type=String(type || "");


    if(type==="person"){

        return "1";

    }


    if(type==="vehicle"){

        return "2";

    }


    if(
        ["1","2","3","4"].includes(type)
    ){

        return type;

    }


    return "1";

}


/* =========================================
   自動ログイン復元
========================================= */

window.onload=function(){


    [

        "name",
        "water",
        "fuel",
        "destination",
        "iconType"

    ].forEach(key=>{


        let value=
            localStorage.getItem(key);


        if(value!==null){


            let element=
                document.getElementById(key);


            if(element){


                if(key==="iconType"){

                    value=
                        normalizeIconType(value);


                    localStorage.setItem(
                        "iconType",
                        value
                    );

                }


                element.value=value;

            }

        }

    });



    let iconElement=
        document.getElementById("iconType");


    if(
        iconElement &&
        !localStorage.getItem("iconType")
    ){

        iconElement.value="1";


        localStorage.setItem(
            "iconType",
            "1"
        );

    }



    let savedName=
        localStorage.getItem("name");


    if(savedName){


        setTimeout(()=>{


            let savedIconType=
                normalizeIconType(
                    localStorage.getItem(
                        "iconType"
                    )
                );


            socket.emit(

                "registerUser",

                {

                    name:savedName,

                    water:Number(
                        localStorage.getItem(
                            "water"
                        ) || 0
                    ),

                    fuel:Number(
                        localStorage.getItem(
                            "fuel"
                        ) || 0
                    ),

                    destination:
                        localStorage.getItem(
                            "destination"
                        ) || "",

                    iconType:
                        savedIconType

                }

            );


            registered=true;


            document.getElementById(
                "registerStatus"
            ).innerHTML=

                "🟢 自動登録 : "
                + savedName;


        },1000);

    }



    if(
        localStorage.getItem(
            "gpsRunning"
        )==="true"
    ){

        setTimeout(()=>{

            startGPS();

        },2000);

    }

};


/* =========================================
   接続
========================================= */

socket.on(

    "connect",

    ()=>{

        console.log("サーバー接続");

    }

);


socket.on(

    "userDeleted",

    (name)=>{


        if(
            document.getElementById(
                "name"
            ).value===name
        ){

            localStorage.clear();


            registered=false;


            document.getElementById(
                "registerStatus"
            ).innerHTML=
                "未登録";


            alert(
                "ユーザー登録を削除しました"
            );

        }

    }

);


socket.on(

    "disconnect",

    ()=>{


        document.getElementById(
            "gpsStatus"
        ).innerHTML=
            "🔴 サーバー切断";

    }

);


/* =========================================
   ユーザー登録
========================================= */

function registerUser(){


    let name=
        document.getElementById(
            "name"
        ).value.trim();


    if(name===""){

        alert(
            "名前を入力してください"
        );

        return;

    }


    let iconType=
        normalizeIconType(
            document.getElementById(
                "iconType"
            ).value
        );


    document.getElementById(
        "iconType"
    ).value=iconType;


    socket.emit(

        "registerUser",

        {

            name:name,

            water:Number(
                document.getElementById(
                    "water"
                ).value
            ),

            fuel:Number(
                document.getElementById(
                    "fuel"
                ).value
            ),

            destination:
                document.getElementById(
                    "destination"
                ).value,

            iconType:iconType

        }

    );


    registered=true;


    [

        "name",
        "water",
        "fuel",
        "destination"

    ].forEach(key=>{

        localStorage.setItem(

            key,

            document.getElementById(
                key
            ).value

        );

    });


    localStorage.setItem(
        "iconType",
        iconType
    );


    document.getElementById(
        "registerStatus"
    ).innerHTML=

        "🟢 登録済み : "
        + name;


    /* 登録後GPS自動開始 */

    setTimeout(()=>{

        startGPS();

    },1000);

}


/* =========================================
   地図
========================================= */

const map=
    L.map("map")
    .setView(
        [32.803,130.707],
        13
    );


const osm=
    L.tileLayer(

        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
            attribution:"OpenStreetMap"
        }

    );


const satellite=
    L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

        {
            attribution:"Esri"
        }

    );


const terrain=
    L.tileLayer(

        "https://tile.opentopomap.org/{z}/{x}/{y}.png",

        {
            attribution:"OpenTopoMap"
        }

    );


const gsi=
    L.tileLayer(

        "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",

        {
            attribution:"国土地理院"
        }

    );


const gsiPale=
    L.tileLayer(

        "https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",

        {
            attribution:"国土地理院 淡色地図"
        }

    );


osm.addTo(map);


L.control.layers(

    {

        "🗺 標準地図":osm,

        "🛰 航空写真":satellite,

        "⛰ 地形図":terrain,

        "🇯🇵 国土地理院":gsi,

        "🚒 防災淡色地図":gsiPale

    }

).addTo(map);


/* =========================================
   GPS開始
========================================= */

function startGPS(){


    if(!registered){

        alert(
            "先にユーザー登録してください"
        );

        return;

    }


    localStorage.setItem(
        "gpsRunning",
        "true"
    );


    if(watchID!==null){

        return;

    }


    gpsTimer=setInterval(()=>{


        navigator.geolocation.getCurrentPosition(

            pos=>{

                sendLocation(

                    pos.coords.latitude,

                    pos.coords.longitude

                );

            }

        );

    },30000);



    watchID=

        navigator.geolocation.watchPosition(

            pos=>{


                let lat=
                    pos.coords.latitude;


                let lon=
                    pos.coords.longitude;


                if(lastLat===0){

                    sendLocation(
                        lat,
                        lon
                    );


                    lastLat=lat;

                    lastLon=lon;

                    lastSendTime=
                        Date.now();

                    return;

                }


                let distance=
                    getDistance(

                        lastLat,
                        lastLon,
                        lat,
                        lon

                    );


                let now=Date.now();


                if(

                    distance>=MOVE_DISTANCE ||

                    now-lastSendTime>=
                    SEND_INTERVAL

                ){

                    sendLocation(
                        lat,
                        lon
                    );


                    lastLat=lat;

                    lastLon=lon;

                    lastSendTime=now;

                }

            },


            err=>{

                console.log(
                    "GPSエラー",
                    err
                );

            },


            {

                enableHighAccuracy:true,

                timeout:10000,

                maximumAge:0

            }

        );

}


/* =========================================
   GPS送信
========================================= */

function sendLocation(lat,lon){


    let utm=

        proj4(

            "EPSG:4326",

            "+proj=utm +zone=52 +south +datum=WGS84",

            [lon,lat]

        );


    let utmE=
        Math.round(utm[0]);


    let utmN=
        Math.round(utm[1]);


    [

        "name",
        "water",
        "fuel",
        "destination",
        "iconType"

    ].forEach(key=>{

        localStorage.setItem(

            key,

            document.getElementById(
                key
            ).value

        );

    });


    document.getElementById(
        "gpsStatus"
    ).innerHTML=
        "🟢 GPS稼働中";


    document.getElementById(
        "lastSend"
    ).innerHTML=

        "最終送信："
        +
        new Date()
            .toLocaleTimeString();


    if(!registered){

        return;

    }


    let iconType=
        normalizeIconType(

            document.getElementById(
                "iconType"
            ).value

        );


    document.getElementById(
        "iconType"
    ).value=iconType;


    socket.emit(

        "location",

        {

            name:
                document.getElementById(
                    "name"
                ).value,

            lat:lat,

            lon:lon,

            utmZone:"52S",

            utmE:utmE,

            utmN:utmN,

            water:Number(
                document.getElementById(
                    "water"
                ).value
            ),

            fuel:Number(
                document.getElementById(
                    "fuel"
                ).value
            ),

            destination:
                document.getElementById(
                    "destination"
                ).value,

            iconType:iconType

        }

    );

}


/* =========================================
   現在地報告
========================================= */

function updateStatus(){


    if(!registered){

        alert(
            "先にユーザー登録してください"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        pos=>{

            sendLocation(

                pos.coords.latitude,

                pos.coords.longitude

            );

        }

    );

}


/* =========================================
   距離計算
========================================= */

function getDistance(

    lat1,
    lon1,
    lat2,
    lon2

){

    const R=6371000;


    const dLat=
        (lat2-lat1)
        *
        Math.PI/180;


    const dLon=
        (lon2-lon1)
        *
        Math.PI/180;


    const a=

        Math.sin(dLat/2)**2

        +

        Math.cos(
            lat1*Math.PI/180
        )

        *

        Math.cos(
            lat2*Math.PI/180
        )

        *

        Math.sin(dLon/2)**2;


    return R*

        2*

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1-a)

        );

}


/* =========================================
   クロノロジー受信
========================================= */

socket.on(

    "chronology",

    data=>{

        chronology=data;

        renderChronology();

    }

);


/* =========================================
   クロノロジー送信
========================================= */

function sendChronology(){


    let msg=

        document.getElementById(
            "chronoMessage"
        )
        .value
        .trim();


    if(msg===""){

        return;

    }


    socket.emit(

        "addChronology",

        {

            message:msg,

            user:
                document.getElementById(
                    "name"
                ).value

        }

    );


    document.getElementById(
        "chronoMessage"
    ).value="";

}


/* =========================================
   クロノロジー表示
========================================= */

function renderChronology(){


    let html="";


    /* 新しいものを上にする */

    [...chronology]
        .reverse()
        .forEach(item=>{


            html+=`

                <div class="timelineItem">

                    <div class="timelineTime">

                        ${item.time}

                    </div>


                    <div class="timelineMessage">

                        ${item.message}

                    </div>

                </div>

            `;

        });


    document.getElementById(
        "timeline"
    ).innerHTML=html;

}


/* =========================================
   アイコン
========================================= */

function createIcon(type){


    type=
        normalizeIconType(type);


    let image;


    switch(type){


        /* 1：隊員 */

        case "1":

            image=
                "/icon/person.png";

            break;


        /* 2：小型 */

        case "2":

            image=
                "/icon/vehicle_small.png";

            break;


        /* 3：中型 */

        case "3":

            image=
                "/icon/vehicle_medium.png";

            break;


        /* 4：大型 */

        case "4":

            image=
                "/icon/vehicle_large.png";

            break;


        default:

            image=
                "/icon/person.png";

            break;

    }


    return L.icon({

        iconUrl:image,

        iconSize:[60,60],

        iconAnchor:[30,60],

        popupAnchor:[0,-70]

    });

}

/* =========================================
   ユーザー位置へ移動
========================================= */

function focusUser(name){


    if(!markers[name]){

        return;

    }


    let pos=
        markers[name]
            .getLatLng();


    /* 地図タブへ戻す */

    showTab(

        "mapTab",

        document.querySelector(
            '.tabButton[onclick*="mapTab"]'
        )

    );


    setTimeout(()=>{


        map.invalidateSize();


        map.setView(

            [
                pos.lat,
                pos.lng
            ],

            17,

            {
                animate:true
            }

        );


        markers[name]
            .openPopup();


    },100);

}


/* =========================================
   ユーザー削除
========================================= */

function deleteUser(name){


    if(
        !confirm(
            name+
            " を削除しますか？"
        )
    ){

        return;

    }


    socket.emit(
        "deleteUser",
        name
    );

}


/* =========================================
   経過時間
========================================= */

function timeAgo(t){


    if(!t){

        return "-";

    }


    let sec=

        Math.floor(

            (Date.now()-t)
            /1000

        );


    if(sec<60){

        return sec+"秒前";

    }


    let min=
        Math.floor(sec/60);


    if(min<60){

        return min+"分前";

    }


    return
        Math.floor(min/60)
        +"時間前";

}


/* =========================================
   地点登録
========================================= */

let selectedPointLat=null;

let selectedPointLon=null;

let selectedPointName=null;


/* 地図クリック */

map.on(

    "click",

    e=>{


        selectedPointLat=
            e.latlng.lat;


        selectedPointLon=
            e.latlng.lng;


        /* 設定タブへ移動 */

        let settingsButton=
            document.querySelector(
                '.tabButton[onclick*="settingsTab"]'
            );


        showTab(
            "settingsTab",
            settingsButton
        );


        document.getElementById(
            "pointName"
        ).focus();


    }

);


/* =========================================
   地点追加
========================================= */

function addPoint(){


    if(selectedPointLat===null){

        alert(
            "先に地図をクリックしてください"
        );

        return;

    }


    let name=

        document.getElementById(
            "pointName"
        )
        .value
        .trim();


    if(name===""){

        alert(
            "地点名を入力してください"
        );

        return;

    }


    socket.emit(

        "addPoint",

        {

            name:name,

            type:
                document.getElementById(
                    "pointType"
                ).value,

            lat:selectedPointLat,

            lon:selectedPointLon

        }

    );


    alert(
        "地点登録送信しました"
    );


    document.getElementById(
        "pointName"
    ).value="";

}


/* =========================================
   地点削除
========================================= */

function deletePoint(){


    let name=

        selectedPointName

        ||

        document.getElementById(
            "pointName"
        ).value.trim();


    if(name===""){

        alert(
            "削除する地点を選択してください"
        );

        return;

    }


    if(
        !confirm(
            name+
            " を削除しますか？"
        )
    ){

        return;

    }


    socket.emit(
        "deletePoint",
        name
    );


    selectedPointName=null;


    document.getElementById(
        "pointName"
    ).value="";

}


/* =========================================
   地点受信
========================================= */

socket.on(

    "points",

    points=>{


        /* 削除された地点 */

        Object.keys(pointMarkers)
            .forEach(name=>{


                if(!points[name]){


                    map.removeLayer(
                        pointMarkers[name]
                    );


                    delete pointMarkers[name];

                }

            });


        /* 現在の地点 */

        Object.keys(points)
            .forEach(name=>{


                let p=
                    points[name];


                if(pointMarkers[name]){

                    map.removeLayer(
                        pointMarkers[name]
                    );

                }


                pointMarkers[name]=

                    L.marker(

                        [
                            p.lat,
                            p.lon
                        ],

                        {

                            icon:L.icon({

                                iconUrl:
                                    "/icon/point.png",

                                iconSize:[
                                    60,
                                    60
                                ],

                                iconAnchor:[
                                    30,
                                    60
                                ],

                                popupAnchor:[
                                    15,
                                    -70
                                ]

                            })

                        }

                    )

                    .addTo(map)

                    .bindTooltip(

                        name,

                        {

                            permanent:true,

                            direction:"top",

                            offset:[
                                0,
                                -30
                            ],

                            className:
                                "pointLabel"

                        }

                    )

                    .on(

                        "click",

                        ()=>{


                            selectedPointName=
                                name;


                            document.getElementById(
                                "pointName"
                            ).value=name;


                            /* 地点クリック時は
                               設定タブへ */

                            let settingsButton=
                                document.querySelector(
                                    '.tabButton[onclick*="settingsTab"]'
                                );


                            showTab(
                                "settingsTab",
                                settingsButton
                            );

                        }

                    )

                    .bindPopup(

                        `

                        <b>
                            📍${name}
                        </b>

                        <br>

                        ${p.lat.toFixed(6)}

                        <br>

                        ${p.lon.toFixed(6)}

                        `

                    );

            });

    }

);
