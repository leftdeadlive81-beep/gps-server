<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS位置共有システム</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>


<style>


select{

width:90%;

font-size:26px;

padding:14px;

margin:8px;

border-radius:10px;

}


body{

font-family:sans-serif;
margin:10px;
background:#f5f5f5;
font-size:24px;

}


h2{

font-size:32px;
text-align:center;

}


h3{

font-size:28px;

}


.card{

background:white;
border-radius:15px;
padding:20px;
margin-bottom:15px;
box-shadow:0 2px 5px #aaa;

}


input{

width:90%;
font-size:26px;
padding:14px;
margin:8px;
border-radius:10px;
border:1px solid #888;

}


button{

font-size:26px;
padding:15px;
margin:8px;
width:95%;
border-radius:12px;

}


#gpsStatus{

font-size:26px;
font-weight:bold;

}


#lastSend{

font-size:24px;

}


#map{

height:55vh;
width:100%;
border-radius:15px;

}


.user{

background:white;
border-radius:15px;
padding:20px;
margin:15px 0;
box-shadow:0 2px 5px #aaa;
font-size:24px;
cursor:pointer;

}


.online{

color:green;
font-weight:bold;

}


.offline{

color:red;
font-weight:bold;

}


</style>


</head>


<body>


<h2>
📍 GPS位置共有システム
</h2>


<div class="card">


<h3>
隊員情報
</h3>


名前

名前
<br>
<input id="name" value="隊員A">


<br>

アイコン種類

<br>

<select id="iconType">

<option value="person">
👤 隊員
</option>


<option value="vehicle">
🚙 車両
</option>

</select>


<br>


💧 水量

<br>

<input id="water" type="number" value="100">


<br>


⛽ 燃料

<br>

<input id="fuel" type="number" value="100">


<br>


📍 次の目的地

<br>

<input id="destination" value="">


</div>



<div class="card">


<button onclick="startGPS()">

📡 GPS開始

</button>



<button onclick="updateStatus()">

🔄 状態更新

</button>



<div id="gpsStatus">

🔴 GPS停止中

</div>



<div id="lastSend">

最終送信：-

</div>


</div>



<hr>


<div id="map"></div>


<h3>
👥 接続ユーザー
</h3>


<div id="users"></div>


<script>


//=====================
// Socket.IO
//=====================

const socket = io();


//=====================
// 保存データ復元
//=====================

window.onload=function(){


let name=localStorage.getItem("name");

let water=localStorage.getItem("water");

let fuel=localStorage.getItem("fuel");

let destination=localStorage.getItem("destination");



if(name)
document.getElementById("name").value=name;


if(water)
document.getElementById("water").value=water;


if(fuel)
document.getElementById("fuel").value=fuel;


if(destination)
document.getElementById("destination").value=destination;


}

//=====================
// 地図
//=====================

const map=L.map('map')
.setView(
[32.803,130.707],
13
);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'OpenStreetMap'
}
)
.addTo(map);



let markers={};


let lastLat=0;

let lastLon=0;


// 最終送信時間

let lastSendTime=0;


// 60秒

const SEND_INTERVAL=60000;


// GPS監視ID

let watchID=null;


// 1分タイマー

let gpsTimer=null;


// 移動距離

const MOVE_DISTANCE=10;



//=====================
// GPS開始
//=====================

function startGPS(){


if(watchID!==null){

alert("GPSはすでに開始しています");

return;

}



//---------------------
// 60秒ごとの強制送信
//---------------------

gpsTimer=setInterval(()=>{


navigator.geolocation.getCurrentPosition(

(pos)=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


lastSendTime=Date.now();


},


(error)=>{

console.log(error);

}


);


},60000);




//---------------------
// GPS位置監視
//---------------------

watchID=navigator.geolocation.watchPosition(


(pos)=>{


let lat=pos.coords.latitude;

let lon=pos.coords.longitude;



// 初回送信

if(lastLat===0){


sendLocation(
lat,
lon
);


lastLat=lat;

lastLon=lon;

lastSendTime=Date.now();


return;

}




// 移動距離確認

let distance=getDistance(

lastLat,

lastLon,

lat,

lon

);



let now=Date.now();



// 10m移動 または 60秒経過

if(

distance>=MOVE_DISTANCE

||

now-lastSendTime>=SEND_INTERVAL

){


sendLocation(

lat,

lon

);



lastLat=lat;

lastLon=lon;

lastSendTime=now;


}



},


(error)=>{


console.log(error);


alert(

"位置情報取得失敗"

);


},


{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0


}


);


}




//=====================
// 状態送信
//=====================

function sendLocation(lat,lon){



// ローカル保存

localStorage.setItem(

"name",

document.getElementById("name").value

);



localStorage.setItem(

"water",

document.getElementById("water").value

);



localStorage.setItem(

"fuel",

document.getElementById("fuel").value

);



localStorage.setItem(

"destination",

document.getElementById("destination").value

);





document.getElementById("gpsStatus")
.innerHTML=

"🟢 GPS稼働中";



document.getElementById("lastSend")
.innerHTML=

"最終送信："

+

new Date()
.toLocaleTimeString();





socket.emit(

"location",

{


name:

document.getElementById("name").value,


lat:lat,


lon:lon,


water:

Number(

document.getElementById("water").value

),


fuel:

Number(

document.getElementById("fuel").value

),


destination:

document.getElementById("destination").value


}


);



}





//=====================
// 状態更新ボタン
//=====================

function updateStatus(){


navigator.geolocation.getCurrentPosition(


(pos)=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


}


);


}





//=====================
// 距離計算
//=====================

function getDistance(

lat1,

lon1,

lat2,

lon2

){


const R=6371000;



const dLat=

(lat2-lat1)

*

Math.PI/180;



const dLon=

(lon2-lon1)

*

Math.PI/180;



const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)**2;



return R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


}

//=====================
// ユーザー削除
//=====================

function deleteUser(name){

if(confirm(name+"を削除しますか？")){

socket.emit(
"deleteUser",
name
);

}

}


//=====================
// 表示用関数
//=====================

function statusText(user){

return user.online ?

"🟢 オンライン":

"🔴 オフライン";

}



function statusClass(user){

return user.online ?

"online":

"offline";

}



function formatTime(t){

if(!t)

return "不明";


return new Date(t)
.toLocaleString();

}



//=====================
// ユーザー位置へ移動
//=====================

function focusUser(name){


if(markers[name]){


let pos=markers[name]
.getLatLng();


map.setView(

[
pos.lat,
pos.lng
],

16

);


markers[name].openPopup();


}


}





//=====================
// ユーザー情報受信
//=====================

socket.on(

"locations",

(users)=>{


let html="";



// 消えたユーザーのマーカー削除

Object.keys(markers)
.forEach(

(name)=>{


if(!users[name]){


map.removeLayer(
markers[name]
);


delete markers[name];


}


}

);





Object.keys(users)
.forEach(

(name)=>{


let user=users[name];


let color=

user.online ?

"green":

"red";




// マーカー作成・更新


if(markers[name]){


markers[name]
.setLatLng(

[
user.lat,
user.lon
]

);


}

else{


markers[name]=

L.circleMarker(

[
user.lat,
user.lon
],

{

radius:12,

color:color,

fillOpacity:0.8

}

)

.addTo(map);


}




markers[name].setStyle(

{

color:color

}

);





markers[name].bindPopup(

`

<b>${user.name}</b>

<br>

${statusText(user)}

<br><br>

💧 水量：

${user.water}

<br>

⛽ 燃料：

${user.fuel}

<br>

📍 目的地：

${user.destination}

<br>

🕒 更新：

${formatTime(user.lastUpdate)}

`

);






// ユーザー一覧

html +=


`

<div class="user"

onclick="focusUser('${user.name}')">


<b>

${user.name}

</b>


<br>


<span class="${statusClass(user)}">

${statusText(user)}

</span>


<br><br>


💧 水量：

${user.water}


<br>


⛽ 燃料：

${user.fuel}


<br>


📍 目的地：

${user.destination}


<br>


🕒 最終更新：

${formatTime(user.lastUpdate)}



<br><br>



<button

onclick="event.stopPropagation();deleteUser('${user.name}')">

🗑 削除

</button>


</div>


`;



}


);



document.getElementById("users")
.innerHTML=html;


}

);


</script>


</body>


</html>
