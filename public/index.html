<!-- 現在位置自動共有君 Version 2.4
     タブ方式
     地図 → タブ → タブ内容 → GPS操作
     アイコン4種類対応
-->

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>現在位置自動共有君 Version 2.4</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>


<style>

*{
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    margin:0;
    background:#f5f5f5;
    font-size:15px;
    overflow-x:hidden;
}


/*=====================
 地図
=====================*/

#map{
    height:55vh;
    width:100%;
}


/*=====================
 タブ
=====================*/

.tabs{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    background:#333;

    width:100%;

}


.tab{

    border:none;

    border-radius:0;

    margin:0;

    padding:10px 2px;

    width:100%;

    background:#444;

    color:white;

    font-size:14px;

    font-weight:bold;

}


.tab.active{

    background:#1976d2;

}


/*=====================
 タブ内容
=====================*/

.tabContent{

    display:none;

    background:#f5f5f5;

    padding:6px;

}


.tabContent.active{

    display:block;

}


/*=====================
 カード
=====================*/

.card{

    background:white;

    border-radius:8px;

    padding:8px;

    margin-bottom:6px;

    box-shadow:0 1px 3px #aaa;

}


summary{

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


/*=====================
 入力
=====================*/

input,
select{

    width:95%;

    font-size:17px;

    padding:6px;

    margin:3px;

    border-radius:6px;

    border:1px solid #888;

}


.inputRow{

    display:flex;

    gap:4px;

}


.inputRow input,
.inputRow select{

    width:50%;

}


/*=====================
 ボタン
=====================*/

button{

    font-size:16px;

    padding:7px;

    margin:3px;

    border-radius:7px;

    border:1px solid #888;

}


.buttonRow{

    display:flex;

    gap:5px;

}


.buttonRow button{

    flex:1;

}


.registerButton{

    width:100%;

}


.deleteButton{

    width:auto;

    font-size:12px;

    padding:3px 6px;

    margin:0;

    white-space:nowrap;

}


/*=====================
 GPS操作
=====================*/

.gpsArea{

    background:white;

    border-top:2px solid #bbb;

    padding:6px;

    position:sticky;

    bottom:0;

    z-index:1000;

    box-shadow:0 -2px 5px #aaa;

}


.gpsButton{

    background:#4caf50;

    color:white;

    font-weight:bold;

}


.reportButton{

    background:#2196f3;

    color:white;

    font-weight:bold;

}


#gpsStatus{

    font-size:16px;

    font-weight:bold;

    padding-left:4px;

}


#lastSend{

    font-size:13px;

    padding-left:4px;

}


/*=====================
 クロノロジー
=====================*/

.timelineItem{

    background:white;

    border-bottom:1px solid #ccc;

    padding:7px;

}


.timelineTime{

    font-size:11px;

    color:#666;

}


.timelineMessage{

    font-size:14px;

}


/*=====================
 ユーザー一覧
=====================*/

.userHeader{

    display:grid;

    grid-template-columns:
    50px 1fr 55px 55px 65px 45px;

    background:#ddd;

    font-weight:bold;

    font-size:12px;

    padding:5px 3px;

}


.userRow{

    display:grid;

    grid-template-columns:
    50px 1fr 55px 55px 65px 45px;

    align-items:center;

    background:white;

    border-bottom:1px solid #ccc;

    padding:7px 3px;

    font-size:13px;

    cursor:pointer;

}


.userRow > div{

    min-width:0;

}


.pointLabel{

    background:#fff8dc;

    border:1px solid #888;

    border-radius:5px;

    padding:3px 6px;

    font-size:13px;

    font-weight:bold;

    color:#333;

}


</style>

</head>


<body>


<!--==================================================
 地図
===================================================-->

<div id="map"></div>


<!--==================================================
 タブ
===================================================-->

<div class="tabs">

<button
class="tab active"
onclick="openTab('userTab',this)">
👤使用者
</button>

<button
class="tab"
onclick="openTab('pointTab',this)">
📍地点
</button>

<button
class="tab"
onclick="openTab('chronoTab',this)">
📋クロノ
</button>

<button
class="tab"
onclick="openTab('usersTab',this)">
👥ユーザー
</button>

</div>


<!--==================================================
 使用者情報
===================================================-->

<div
id="userTab"
class="tabContent active">

<div class="card">

<div class="inputRow">

<input
id="name"
value="隊員A"
placeholder="名前">


<select id="iconType">

👤 隊員
</option>

</option>

<option value="3">

</div>

</div>


<!--==================================================
 地点登録
===================================================-->

<div
id="pointTab"
class="tabContent">

<div class="card">

<input
id="pointName"
placeholder="地点名（例：CP1、給水所）">


<select id="pointType">

<option value="CP">
🏳 指揮所(CP)
</option>

<option value="water">
💧給水所
</option>

<option value="supply">
📦補給地点
</option>

<option value="point">
📍その他
</option>

</select>


<div class="buttonRow">

<button onclick="addPoint()">
📍登録
</button>

🗑削除
</button>

</div>

</div>

</div>


<!--==================================================
 クロノロジー
===================================================-->

<div
id="chronoTab"
class="tabContent">

<div class="card">

<div class="inputRow">

<input
id="chronoMessage"
placeholder="活動内容を入力">


<button onclick="sendChronology()">
送信
</button>

</div>


<hr>


<div id="timeline"></div>

</div>

</div>


<!--==================================================
 接続ユーザー
===================================================-->

<div
id="usersTab"
class="tabContent">

<div class="card">

<div class="userHeader">

<div>状態</div>

<div>名前</div>

<div>💧水</div>

<div>⛽燃料</div>

<div>最終</div>

<div>操作</div>

</div>


<div id="users"></div>

</div>

</div>


<!--==================================================
 GPS操作
 最下段
===================================================-->

<div class="gpsArea">

<div class="buttonRow">

<button
class="gpsButton"
onclick="startGPS()">

📡 GPS開始

</button>


<button
class="reportButton"
onclick="updateStatus()">

🔄 現在地報告

</button>

</div>


<div id="gpsStatus">

🔴 GPS停止中

</div>


<div id="lastSend">

最終送信：-

</div>

</div>


<script>


/*==================================================
 Socket
===================================================*/

const socket = io();


let registered=false;

let markers={};

let pointMarkers={};

let chronology=[];

let watchID=null;

let gpsTimer=null;

let lastLat=0;

let lastLon=0;

let lastSendTime=0;

let selectedPointLat=null;

let selectedPointLon=null;

let selectedPointName=null;


const SEND_INTERVAL=30000;

const MOVE_DISTANCE=10;


/*==================================================
 タブ
===================================================*/

function openTab(tabId,button){

    document
    .querySelectorAll(".tabContent")
    .forEach(tab=>{

        tab.classList.remove("active");

    });


    document
    .querySelectorAll(".tab")
    .forEach(tab=>{

        tab.classList.remove("active");

    });


    document
    .getElementById(tabId)
    .classList.add("active");


    button.classList.add("active");

}


/*==================================================
 アイコン種類
===================================================*/

function normalizeIconType(type){

    type=String(type || "");


    if(type==="person"){
        return "1";
    }


    if(type==="vehicle"){
        return "2";
    }


    if(
        ["1","2","3","4"]
        .includes(type)
    ){

        return type;

    }


    return "1";

}


/*==================================================
 自動ログイン復元
===================================================*/

window.onload=function(){


    [
        "name",
        "water",
        "fuel",
        "destination",
        "iconType"
    ]
    .forEach(key=>{


        let value=
        localStorage.getItem(key);


        if(value!==null){


            let element=
            document.getElementById(key);


            if(element){


                if(key==="iconType"){

                    value=
                    normalizeIconType(value);


                    localStorage.setItem(
                        "iconType",
                        value
                    );

                }


                element.value=value;

            }

        }

    });


    let iconElement=
    document.getElementById("iconType");


    if(
        iconElement &&
        !localStorage.getItem("iconType")
    ){

        iconElement.value="1";

        localStorage.setItem(
            "iconType",
            "1"
        );

    }


    let savedName=
    localStorage.getItem("name");


    if(savedName){


        setTimeout(()=>{


            let savedIconType=
            normalizeIconType(
                localStorage.getItem("iconType")
            );


            socket.emit(
                "registerUser",
                {

                    name:savedName,

                    water:Number(
                        localStorage.getItem("water") || 0
                    ),

                    fuel:Number(
                        localStorage.getItem("fuel") || 0
                    ),

                    destination:
                    localStorage.getItem("destination") || "",

                    iconType:
                    savedIconType

                }
            );


            registered=true;


            document.getElementById(
                "registerStatus"
            ).innerHTML=
            "🟢 自動登録 : "+savedName;


        },1000);

    }


    if(
        localStorage.getItem("gpsRunning")==="true"
    ){

        setTimeout(()=>{

            startGPS();

        },2000);

    }

};


/*==================================================
 接続
===================================================*/

socket.on(
"connect",
()=>{

    console.log("サーバー接続");

});


socket.on(
"userDeleted",
(name)=>{


    if(
        document.getElementById("name").value===name
    ){

        localStorage.clear();

        registered=false;


        document.getElementById(
            "registerStatus"
        ).innerHTML="未登録";


        alert(
            "ユーザー登録を削除しました"
        );

    }

});


socket.on(
"disconnect",
()=>{

    document.getElementById(
        "gpsStatus"
    ).innerHTML=
    "🔴 サーバー切断";

});


/*==================================================
 ユーザー登録
===================================================*/

function registerUser(){


    let name=
    document
    .getElementById("name")
    .value
    .trim();


    if(name===""){

        alert(
            "名前を入力してください"
        );

        return;

    }


    let iconType=
    normalizeIconType(
        document
        .getElementById("iconType")
        .value
    );


    document
    .getElementById("iconType")
    .value=
    iconType;


    socket.emit(
        "registerUser",
        {

            name:name,

            water:Number(
                document.getElementById("water").value
            ),

            fuel:Number(
                document.getElementById("fuel").value
            ),

            destination:
            document.getElementById("destination").value,

            iconType:iconType

        }
    );


    registered=true;


    [
        "name",
        "water",
        "fuel",
        "destination"
    ]
    .forEach(key=>{

        localStorage.setItem(
            key,
            document.getElementById(key).value
        );

    });


    localStorage.setItem(
        "iconType",
        iconType
    );


    document.getElementById(
        "registerStatus"
    ).innerHTML=
    "🟢 登録済み : "+name;


    setTimeout(()=>{

        startGPS();

    },1000);

}


/*==================================================
 地図
===================================================*/

const map=
L.map("map")
.setView(
    [32.803,130.707],
    13
);


/* 標準 */

const osm=
L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:"OpenStreetMap"
    }
);


/* 航空写真 */

const satellite=
L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        attribution:"Esri"
    }
);


/* 地形図 */

const terrain=
L.tileLayer(
    "https://tile.opentopomap.org/{z}/{x}/{y}.png",
    {
        attribution:"OpenTopoMap"
    }
);


/* 国土地理院 */

const gsi=
L.tileLayer(
    "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
    {
        attribution:"国土地理院"
    }
);


/* 防災淡色 */

const gsiPale=
L.tileLayer(
    "https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",
    {
        attribution:"国土地理院 淡色地図"
    }
);


osm.addTo(map);


L.control.layers(

    {
        "🗺 標準地図":osm,

        "🛰 航空写真":satellite,

        "⛰ 地形図":terrain,

        "🇯🇵 国土地理院":gsi,

        "🚒 防災淡色地図":gsiPale
    }

).addTo(map);


/*==================================================
 GPS開始
===================================================*/

function startGPS(){


    if(!registered){

        alert(
            "先にユーザー登録してください"
        );

        return;

    }


    localStorage.setItem(
        "gpsRunning",
        "true"
    );


    if(watchID!==null){

        return;

    }


    gpsTimer=
    setInterval(()=>{


        navigator.geolocation
        .getCurrentPosition(

            pos=>{

                sendLocation(
                    pos.coords.latitude,
                    pos.coords.longitude
                );

            }

        );

    },30000);


    watchID=
    navigator.geolocation
    .watchPosition(

        pos=>{


            let lat=
            pos.coords.latitude;


            let lon=
            pos.coords.longitude;


            if(lastLat===0){

                sendLocation(lat,lon);

                lastLat=lat;

                lastLon=lon;

                lastSendTime=Date.now();

                return;

            }


            let distance=
            getDistance(
                lastLat,
                lastLon,
                lat,
                lon
            );


            let now=Date.now();


            if(
                distance>=MOVE_DISTANCE ||
                now-lastSendTime>=SEND_INTERVAL
            ){

                sendLocation(lat,lon);

                lastLat=lat;

                lastLon=lon;

                lastSendTime=now;

            }


        },


        err=>{

            console.log(
                "GPSエラー",
                err
            );

        },


        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:0

        }

    );

}


/*==================================================
 GPS送信
===================================================*/

function sendLocation(lat,lon){


    let utm=
    proj4(

        "EPSG:4326",

        "+proj=utm +zone=52 +south +datum=WGS84",

        [lon,lat]

    );


    let utmE=
    Math.round(utm[0]);


    let utmN=
    Math.round(utm[1]);


    [
        "name",
        "water",
        "fuel",
        "destination",
        "iconType"
    ]
    .forEach(key=>{

        localStorage.setItem(
            key,
            document.getElementById(key).value
        );

    });


    document.getElementById(
        "gpsStatus"
    ).innerHTML=
    "🟢 GPS稼働中";


    document.getElementById(
        "lastSend"
    ).innerHTML=
    "最終送信："+
    new Date().toLocaleTimeString();


    if(!registered){

        return;

    }


    let iconType=
    normalizeIconType(
        document.getElementById("iconType").value
    );


    document.getElementById(
        "iconType"
    ).value=iconType;


    socket.emit(
        "location",
        {

            name:
            document.getElementById("name").value,

            lat:lat,

            lon:lon,

            utmZone:"52S",

            utmE:utmE,

            utmN:utmN,

            water:Number(
                document.getElementById("water").value
            ),

            fuel:Number(
                document.getElementById("fuel").value
            ),

            destination:
            document.getElementById("destination").value,

            iconType:iconType

        }
    );

}


/*==================================================
 現在地報告
===================================================*/

function updateStatus(){


    if(!registered){

        alert(
            "先にユーザー登録してください"
        );

        return;

    }


    navigator.geolocation
    .getCurrentPosition(

        pos=>{

            sendLocation(
                pos.coords.latitude,
                pos.coords.longitude
            );

        }

    );

}


/*==================================================
 距離計算
===================================================*/

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371000;


    const dLat=
    (lat2-lat1)*
    Math.PI/180;


    const dLon=
    (lon2-lon1)*
    Math.PI/180;


    const a=
    Math.sin(dLat/2)**2
    +
    Math.cos(lat1*Math.PI/180)
    *
    Math.cos(lat2*Math.PI/180)
    *
    Math.sin(dLon/2)**2;


    return R*
    2*
    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

}


/*==================================================
 クロノロジー
===================================================*/

socket.on(
"chronology",
(data)=>{

    chronology=data;

    renderChronology();

});


function sendChronology(){


    let msg=
    document
    .getElementById("chronoMessage")
    .value
    .trim();


    if(msg===""){

        return;

    }


    socket.emit(
        "addChronology",
        {

            message:msg,

            user:
            document.getElementById("name").value

        }
    );


    document.getElementById(
        "chronoMessage"
    ).value="";

}


function renderChronology(){


    let html="";


    chronology.forEach(item=>{


        html+=`

        <div class="timelineItem">

            <div class="timelineTime">
                ${item.time}
            </div>

            <div class="timelineMessage">
                ${item.message}
            </div>

        </div>

        `;

    });


    document.getElementById(
        "timeline"
    ).innerHTML=html;

}


/*==================================================
 アイコン
===================================================*/

function createIcon(type){


    type=
    normalizeIconType(type);


    let image;


    switch(type){

        case "1":

            image="/icon/person.png";

            break;


        case "2":

            image="/icon/vehicle_small.png";

            break;


        case "3":

            image="/icon/vehicle_medium.png";

            break;


        case "4":

            image="/icon/vehicle_large.png";

            break;


        default:

            image="/icon/person.png";

    }


    return L.icon({

        iconUrl:image,

        iconSize:[60,60],

        iconAnchor:[30,60],

        popupAnchor:[0,-70]

    });

}


/*==================================================
 ユーザー表示
===================================================*/

socket.on(
"locations",
(users)=>{


    let html="";


    Object.keys(markers)
    .forEach(name=>{


        if(!users[name]){

            map.removeLayer(
                markers[name]
            );

            delete markers[name];

        }

    });


    Object.keys(users)
    .forEach(name=>{


        let user=
        users[name];


        let lat=user.lat;

        let lon=user.lon;


        if(
            lat===null ||
            lon===null
        ){

            lat=32.803;

            lon=130.707;

        }


        let icon=
        createIcon(
            user.iconType
        );


        if(markers[name]){


            markers[name]
            .setLatLng(
                [lat,lon]
            );


            markers[name]
            .setIcon(icon);

        }
        else{


            markers[name]=
            L.marker(
                [lat,lon],
                {
                    icon:icon
                }
            )
            .addTo(map)
            .bindTooltip(
                user.name,
                {
                    permanent:true,
                    direction:"top",
                    offset:[0,-60],
                    className:"pointLabel"
                }
            );

        }


        markers[name]
        .bindPopup(

            `

            <b>${user.name}</b>

            <br>

            状態:
            ${user.online ? "🟢ON":"🔴OFF"}

            <hr>

            💧水量:
            ${user.water}

            <br>

            ⛽燃料:
            ${user.fuel}

            <br>

            📍目的地:
            ${user.destination || "-"}

            <br><br>

            UTM:
            ${user.utmZone || "52S"}

            <br>

            E:
            ${user.utmE || ""}

            <br>

            N:
            ${user.utmN || ""}

            <br><br>

            🕒
            ${
                user.lastUpdate
                ?
                new Date(
                    user.lastUpdate
                ).toLocaleString()
                :
                "-"
            }

            `

        );


        html+=`

        <div class="userRow">

            <div onclick="focusUser('${user.name}')">
                ${user.online ? "🟢ON":"🔴OFF"}
            </div>

            <div onclick="focusUser('${user.name}')">
                ${user.name}
            </div>

            <div onclick="focusUser('${user.name}')">
                ${user.water}
            </div>

            <div onclick="focusUser('${user.name}')">
                ${user.fuel}
            </div>

            <div onclick="focusUser('${user.name}')">
                ${timeAgo(user.lastUpdate)}
            </div>

            <div>

                <button
                class="deleteButton"
                onclick="
                event.stopPropagation();
                deleteUser('${user.name}')
                ">

                🗑

                </button>

            </div>

        </div>

        `;

    });


    document.getElementById(
        "users"
    ).innerHTML=html;

});


/*==================================================
 ユーザー移動
===================================================*/

function focusUser(name){


    if(!markers[name]){

        return;

    }


    let pos=
    markers[name]
    .getLatLng();


    map.setView(
        [pos.lat,pos.lng],
        17,
        {
            animate:true
        }
    );


    markers[name]
    .openPopup();

}

 ユーザー削除
===================================================*/

function deleteUser(name){


    if(
        !confirm(
            name+" を削除しますか？"
        )
    ){

        return;

    }


    socket.emit(
        "deleteUser",
        name
    );

}


/*==================================================
 時間表示
===================================================*/

function timeAgo(t){


    if(!t){

        return "-";

    }


    let sec=
    Math.floor(
        (Date.now()-t)/1000
    );


    if(sec<60){

        return sec+"秒前";

    }


    let min=
    Math.floor(sec/60);


    if(min<60){

        return min+"分前";

    }


    return
    Math.floor(min/60)
    +"時間前";

}


/*==================================================
 地図クリック
===================================================*/

map.on(
"click",
(e)=>{


    selectedPointLat=
    e.latlng.lat;


    selectedPointLon=
    e.latlng.lng;


});


/*==================================================
 地点登録
===================================================*/

function addPoint(){


    if(
        selectedPointLat===null
    ){

        alert(
            "先に地図をクリックしてください"
        );

        return;

    }


    let name=
    document
    .getElementById("pointName")
    .value
    .trim();


    if(name===""){

        alert(
            "地点名を入力してください"
        );

        return;

    }


    socket.emit(
        "addPoint",
        {

            name:name,

            type:
            document
            .getElementById("pointType")
            .value,

            lat:selectedPointLat,

            lon:selectedPointLon

        }
    );


    document.getElementById(
        "pointName"
    ).value="";

}


/*==================================================
 地点削除
===================================================*/

function deletePoint(){


    let name=
    selectedPointName ||
    document
    .getElementById("pointName")
    .value
    .trim();


    if(name===""){

        alert(
            "削除する地点を選択してください"
        );

        return;

    }


    if(
        !confirm(
            name+" を削除しますか？"
        )
    ){

        return;

    }


    socket.emit(
        "deletePoint",
        name
    );


    selectedPointName=null;


    document.getElementById(
        "pointName"
    ).value="";

}


/*==================================================
 地点受信
===================================================*/

socket.on(
"points",
(points)=>{


    Object.keys(pointMarkers)
    .forEach(name=>{


        if(!points[name]){

            map.removeLayer(
                pointMarkers[name]
            );

            delete pointMarkers[name];

        }

    });


    Object.keys(points)
    .forEach(name=>{


        let p=
        points[name];


        if(pointMarkers[name]){

            map.removeLayer(
                pointMarkers[name]
            );

        }


        pointMarkers[name]=
        L.marker(
            [p.lat,p.lon],
            {

                icon:L.icon({

                    iconUrl:
                    "/icon/point.png",

                    iconSize:
                    [60,60],

                    iconAnchor:
                    [30,60],

                    popupAnchor:
                    [15,-70]

                })

            }
        )
        .addTo(map)
        .bindTooltip(
            name,
            {

                permanent:true,

                direction:"top",

                offset:[0,-30],

                className:"pointLabel"

            }
        )
        .on(
            "click",
            ()=>{


                selectedPointName=name;


                document
                .getElementById(
                    "pointName"
                )
                .value=name;

            }
        )
        .bindPopup(

            `

            <b>📍${name}</b>

            <br>

            ${p.lat.toFixed(6)}

            <br>

            ${p.lon.toFixed(6)}

            `

        );

    });

});


</script>
