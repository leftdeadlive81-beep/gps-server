<script>


// ==================================================
// Supabase
// ==================================================

const SUPABASE_URL =
    "https://seqqgkryrhcvmxnwyybr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_pUI0REFogJSgZYs3OJepEQ_Zl27Iw73";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// ==================================================
// Socket.IO
// ==================================================

const socket = io();



// ==================================================
// グローバル変数
// ==================================================

let currentAuthUser = null;

let registered = false;

let profileLoaded = false;

let socketRegistered = false;

let appStarted = false;

let markers = {};

let pointMarkers = {};

let chronology = [];

let watchID = null;

let gpsTimer = null;

let lastLat = 0;

let lastLon = 0;

let lastSendTime = 0;

let selectedPointLat = null;

let selectedPointLon = null;

let selectedPointName = null;


const SEND_INTERVAL =
    30000;


const MOVE_DISTANCE =
    10;



// ==================================================
// 任意文字列 → Supabase Auth内部用メール
//
// 実際のメールアドレスは使用しません。
// 任意文字列からSHA-256を作り、
// Auth内部だけで使用する架空メールを作ります。
// ==================================================

async function makeAuthEmail(username){

    const text =
        String(username)
            .trim();


    const encoder =
        new TextEncoder();


    const data =
        encoder.encode(text);


    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );


    const hashArray =
        Array.from(
            new Uint8Array(
                hashBuffer
            )
        );


    const hash =
        hashArray
            .map(
                b =>
                    b.toString(16)
                     .padStart(2,"0")
            )
            .join("");


    return (
        "u-" +
        hash +
        "@auth.puttan.local"
    );

}



// ==================================================
// ログイン
// ==================================================

async function loginUser(){

    const username =
        document.getElementById(
            "loginUsername"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "loginPassword"
        )
        .value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!username || !password){

        message.textContent =
            "ログイン名とパスワードを入力してください";

        return;

    }


    message.textContent =
        "ログイン中...";


    try{

        const email =
            await makeAuthEmail(
                username
            );


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        if(error){

            console.error(
                "ログインエラー:",
                error
            );

            message.textContent =
                "ログインに失敗しました：" +
                error.message;

            return;

        }


        if(
            !data ||
            !data.user
        ){

            message.textContent =
                "ログイン情報を取得できませんでした";

            return;

        }


        currentAuthUser =
            data.user;


        localStorage.setItem(
            "loginUsername",
            username
        );


        message.textContent =
            "プロフィール確認中...";


        const ok =
            await initializeAuthenticatedUser(
                username
            );


        if(!ok){

            return;

        }


        showApp();


    }
    catch(error){

        console.error(error);

        message.textContent =
            "ログイン処理でエラーが発生しました";

    }

}



// ==================================================
// 新規Auth登録
// ==================================================

async function registerAuthUser(){

    const username =
        document.getElementById(
            "registerUsername"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "registerPassword"
        )
        .value;


    const password2 =
        document.getElementById(
            "registerPassword2"
        )
        .value;


    const message =
        document.getElementById(
            "registerMessage"
        );


    if(!username){

        message.textContent =
            "任意のログイン名を入力してください";

        return;

    }


    if(username.length > 100){

        message.textContent =
            "ログイン名は100文字以内にしてください";

        return;

    }


    if(!password){

        message.textContent =
            "パスワードを入力してください";

        return;

    }


    if(password.length < 6){

        message.textContent =
            "パスワードは6文字以上にしてください";

        return;

    }


    if(password !== password2){

        message.textContent =
            "パスワードが一致しません";

        return;

    }


    message.textContent =
        "アカウント作成中...";


    try{

        const email =
            await makeAuthEmail(
                username
            );


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signUp({

                    email:
                        email,

                    password:
                        password

                });


        if(error){

            console.error(
                "Auth登録エラー:",
                error
            );

            message.textContent =
                "登録に失敗しました：" +
                error.message;

            return;

        }


        if(
            !data ||
            !data.user
        ){

            message.textContent =
                "Authユーザーを作成できませんでした";

            return;

        }


        /*
         * Confirm emailがONの場合、
         * data.sessionがnullになることがあります。
         */

        if(!data.session){

            message.textContent =
                "Auth登録は成功しましたが、" +
                "SupabaseのConfirm emailがONになっている可能性があります。";

            return;

        }


        currentAuthUser =
            data.user;


        /*
         * profilesはINSERTではなくUPSERT
         * user_id(UUID)をAuthのUUIDから設定
         */

        const {
            error:
                profileError
        } =
            await supabaseClient
                .from("profiles")
                .upsert(

                    {

                        user_id:
                            data.user.id,

                        display_name:
                            username,

                        icon_type:
                            "1",

                        role:
                            "user"

                    },

                    {

                        onConflict:
                            "user_id"

                    }

                );


        if(profileError){

            console.error(
                "プロフィール登録エラー:",
                profileError
            );

            message.textContent =
                "Auth登録は成功しましたが、" +
                "プロフィール登録に失敗しました：" +
                profileError.message;

            return;

        }


        localStorage.setItem(
            "loginUsername",
            username
        );


        message.textContent =
            "登録完了しました。ログインします...";


        document.getElementById(
            "loginUsername"
        ).value =
            username;


        document.getElementById(
            "loginPassword"
        ).value =
            password;


        setTimeout(
            ()=>{
                showLogin();
                loginUser();
            },
            500
        );


    }
    catch(error){

        console.error(error);

        message.textContent =
            "登録処理でエラーが発生しました";

    }

}



// ==================================================
// Auth済みユーザーの初期化
// ==================================================

async function initializeAuthenticatedUser(
    username
){

    if(
        !currentAuthUser
    ){

        return false;

    }


    /*
     * profilesを取得
     */

    const {
        data:
            profile,
        error:
            profileError
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "user_id,display_name,icon_type,role"
            )
            .eq(
                "user_id",
                currentAuthUser.id
            )
            .maybeSingle();


    if(profileError){

        console.error(
            "プロフィール取得エラー:",
            profileError
        );

        document.getElementById(
            "loginMessage"
        ).textContent =
            "プロフィール取得に失敗しました：" +
            profileError.message;

        return false;

    }


    /*
     * プロフィールが存在しない場合は
     * 自動的に作成
     */

    if(!profile){

        const {
            data:
                newProfile,
            error:
                upsertError
        } =
            await supabaseClient
                .from("profiles")
                .upsert(

                    {

                        user_id:
                            currentAuthUser.id,

                        display_name:
                            username,

                        icon_type:
                            "1",

                        role:
                            "user"

                    },

                    {

                        onConflict:
                            "user_id"

                    }

                )
                .select()
                .single();


        if(upsertError){

            console.error(
                "プロフィールUPSERTエラー:",
                upsertError
            );

            document.getElementById(
                "loginMessage"
            ).textContent =
                "プロフィール登録に失敗しました：" +
                upsertError.message;

            return false;

        }


        applyProfile(
            newProfile
        );

    }
    else{

        applyProfile(
            profile
        );

    }


    profileLoaded =
        true;


    /*
     * Socket側へユーザー登録
     */

    registerSocketUser();


    return true;

}

function normalizeIconType(
    type
){

    type =
        String(
            type || ""
        );


    if(
        type ===
        "person"
    ){

        return "1";

    }


    if(
        type ===
        "vehicle"
    ){

        return "2";

    }


    if(
        ["1","2","3","4"]
        .includes(type)
    ){

        return type;

    }


    return "1";

}

// GPS開始
// ==================================================

function startGPS(){

    if(
        !currentAuthUser ||
        !profileLoaded ||
        !registered
    ){

        alert(
            "先にログイン・ユーザー登録してください"
        );

        return;

    }


    localStorage.setItem(
        "gpsRunning",
        "true"
    );


    if(
        watchID !== null
    ){

        return;

    }


    gpsTimer =
        setInterval(
            ()=>{

                navigator.geolocation
                    .getCurrentPosition(

                        pos=>{

                            sendLocation(

                                pos.coords.latitude,

                                pos.coords.longitude

                            );

                        },

                        err=>{

                            console.log(
                                "GPSタイマーエラー",
                                err
                            );

                        }

                    );

            },
            30000
        );


    watchID =
        navigator.geolocation
            .watchPosition(

                pos=>{

                    const lat =
                        pos.coords.latitude;


                    const lon =
                        pos.coords.longitude;


                    if(
                        lastLat === 0
                    ){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat =
                            lat;

                        lastLon =
                            lon;

                        lastSendTime =
                            Date.now();

                        return;

                    }


                    const distance =
                        getDistance(

                            lastLat,
                            lastLon,

                            lat,
                            lon

                        );


                    const now =
                        Date.now();


                    if(

                        distance >=
                            MOVE_DISTANCE

                        ||

                        now -
                        lastSendTime >=
                            SEND_INTERVAL

                    ){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat =
                            lat;

                        lastLon =
                            lon;

                        lastSendTime =
                            now;

                    }

                },


                err=>{

                    console.log(
                        "GPSエラー",
                        err
                    );

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        10000,

                    maximumAge:
                        0

                }

            );

}



// ==================================================
// GPS送信
// ==================================================

function sendLocation(
    lat,
    lon
){

    if(
        !currentAuthUser ||
        !profileLoaded ||
        !registered
    ){

        return;

    }


    const utm =
        proj4(

            "EPSG:4326",

            "+proj=utm +zone=52 +south +datum=WGS84",

            [
                lon,
                lat
            ]

        );


    const utmE =
        Math.round(
            utm[0]
        );


    const utmN =
        Math.round(
            utm[1]
        );


    const name =
        document.getElementById(
            "name"
        )
        .value
        .trim();


    const iconType =
        normalizeIconType(
            document.getElementById(
                "iconType"
            ).value
        );


    localStorage.setItem(
        "name",
        name
    );


    localStorage.setItem(
        "water",
        document.getElementById(
            "water"
        ).value
    );


    localStorage.setItem(
        "fuel",
        document.getElementById(
            "fuel"
        ).value
    );


    localStorage.setItem(
        "destination",
        document.getElementById(
            "destination"
        ).value
    );


    localStorage.setItem(
        "iconType",
        iconType
    );


    document.getElementById(
        "gpsStatus"
    ).innerHTML =
        "🟢 GPS稼働中";


    document.getElementById(
        "lastSend"
    ).innerHTML =
        "最終送信：" +
        new Date()
            .toLocaleTimeString();


    socket.emit(
        "location",
        {

            name:
                name,

            lat:
                lat,

            lon:
                lon,

            utmZone:
                "52S",

            utmE:
                utmE,

            utmN:
                utmN,

            water:
                Number(
                    document.getElementById(
                        "water"
                    ).value
                ),

            fuel:
                Number(
                    document.getElementById(
                        "fuel"
                    ).value
                ),

            destination:
                document.getElementById(
                    "destination"
                ).value,

            iconType:
                iconType

        }
    );

}

// ==================================================
// 距離計算
// ==================================================

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;


    const dLat =
        (
            lat2 -
            lat1
        )
        *
        Math.PI /
        180;


    const dLon =
        (
            lon2 -
            lon1
        )
        *
        Math.PI /
        180;


    const a =
        Math.sin(
            dLat / 2
        ) ** 2

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(
            dLon / 2
        ) ** 2;


    return (

        R *
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1-a
            )

        )

    );

}

            name=>{

                if(
                    !users[name]
                ){

                    map.removeLayer(
                        markers[name]
                    );


                    delete markers[name];

                }

            }
        );


        Object.keys(
            users
        )
        .forEach(
            name=>{

                const user =
                    users[name];


                let lat =
                    user.lat;


                let lon =
                    user.lon;


                if(
                    lat === null ||
                    lon === null
                ){

                    lat =
                        32.803;

                    lon =
                        130.707;

                }


                const icon =
                    createIcon(
                        user.iconType
                    );


                if(
                    markers[name]
                ){

                    markers[name]
                        .setLatLng(
                            [lat,lon]
                        );


                    markers[name]
                        .setIcon(
                            icon
                        );

                }
                else{

                    markers[name] =
                        L.marker(

                            [lat,lon],

                            {
                                icon:
                                    icon
                            }

                        )
                        .addTo(
                            map
                        )
                        .bindTooltip(

                            user.name,

                            {

                                permanent:
                                    true,

                                direction:
                                    "top",

                                offset:
                                    [0,-60],

                                className:
                                    "pointLabel"

                            }

                        );

                }


                markers[name]
                    .bindPopup(`

                        <b>
                            ${user.name}
                        </b>

                        <br>

                        状態：
                        ${
                            user.online
                            ?
                            "🟢ON"
                            :
                            "🔴OFF"
                        }

                        <hr>

                        💧水量：
                        ${user.water ?? 0}

                        <br>

                        ⛽燃料：
                        ${user.fuel ?? 0}

                        <br>

                        📍目的地：
                        ${
                            user.destination
                            || "-"
                        }

                        <br><br>

                        UTM：
                        ${
                            user.utmZone
                            || "52S"
                        }

                        <br>

                        E：
                        ${
                            user.utmE ??
                            ""
                        }

                        <br>

                        N：
                        ${
                            user.utmN ??
                            ""
                        }

                        <br><br>

                        🕒
                        ${
                            user.lastUpdate
                            ?
                            new Date(
                                user.lastUpdate
                            )
                            .toLocaleString()
                            :
                            "-"
                        }

                    `);


                html += `

                    <div class="userRow">

                        <div
                            onclick="
                                focusUser('${user.name}')
                            "
                        >

                            ${
                                user.online
                                ?
                                "🟢ON"
                                :
                                "🔴OFF"
                            }

                        </div>


                        <div
                            onclick="
                                focusUser('${user.name}')
                            "
                        >

                            ${user.name}

                        </div>


                        <div
                            onclick="
                                focusUser('${user.name}')
                            "
                        >

                            ${user.water ?? 0}

                        </div>


                        <div
                            onclick="
                                focusUser('${user.name}')
                            "
                        >

                            ${user.fuel ?? 0}

                        </div>


                        <div
                            onclick="
                                focusUser('${user.name}')
                            "
                        >

                            ${
                                timeAgo(
                                    user.lastUpdate
                                )
                            }

                        </div>


                        <div>

                            <button
                                class="deleteButton"
                                onclick="
                                    event.stopPropagation();
                                    deleteUser('${user.name}')
                                "
                            >

                                🗑

                            </button>

                        </div>

                    </div>

                `;

            }
        );


        document.getElementById(
            "users"
        ).innerHTML =
            html;

    }
);



// ==================================================
// ユーザーへ移動
// ==================================================

function focusUser(
    name
){

    if(
        !markers[name]
    ){

        return;

    }


    const pos =
        markers[name]
            .getLatLng();


    map.setView(

        [
            pos.lat,
            pos.lng
        ],

        17,

        {
            animate:
                true
        }

    );


    markers[name]
        .openPopup();

}



// ==================================================
// ユーザー削除
// ==================================================

function deleteUser(
    name
){

    if(
        !confirm(
            name +
            " を削除しますか？"
        )
    ){

        return;

    }


    socket.emit(
        "deleteUser",
        name
    );

}



// ==================================================
// ユーザー削除通知
// ==================================================

socket.on(
    "userDeleted",
    name=>{

        if(
            document.getElementById(
                "name"
            ).value === name
        ){

            registered =
                false;

            localStorage.removeItem(
                "name"
            );


            document.getElementById(
                "registerStatus"
            ).innerHTML =
                "未登録";


            alert(
                "ユーザー登録を削除しました"
            );

        }

    }
);



// ==================================================
// 最終更新時間
// ==================================================

function timeAgo(
    t
){

    if(!t){

        return "-";

    }


    const sec =
        Math.floor(
            (
                Date.now() -
                t
            ) / 1000
        );


    if(sec < 60){

        return (
            sec +
            "秒前"
        );

    }


    const min =
        Math.floor(
            sec / 60
        );


    if(min < 60){

        return (
            min +
            "分前"
        );

    }


    return (

        Math.floor(
            min / 60
        )

        +

        "時間前"

    );

}



// ==================================================
// 地図クリック
// ==================================================

map.on(
    "click",
    e=>{

        selectedPointLat =
            e.latlng.lat;


        selectedPointLon =
            e.latlng.lng;


        selectedPointName =
            null;


        document.getElementById(
            "pointLat"
        ).textContent =
            selectedPointLat
                .toFixed(6);


        document.getElementById(
            "pointLon"
        ).textContent =
            selectedPointLon
                .toFixed(6);


        const utm =
            proj4(

                "EPSG:4326",

                "+proj=utm +zone=52 +south +datum=WGS84",

                [
                    selectedPointLon,
                    selectedPointLat
                ]

            );


        document.getElementById(
            "pointUtmZone"
        ).textContent =
            "52S";


        document.getElementById(
            "pointUtmE"
        ).textContent =
            Math.round(
                utm[0]
            );


        document.getElementById(
            "pointUtmN"
        ).textContent =
            Math.round(
                utm[1]
            );

    }
);



// ==================================================
// 地点登録
// ==================================================

function addPoint(){

    if(
        !currentAuthUser ||
        !profileLoaded
    ){

        alert(
            "先にログインしてください"
        );

        return;

    }


    if(
        selectedPointLat ===
        null
    ){

        alert(
            "先に地図をクリックして登録位置を選択してください"
        );

        return;

    }


    const name =
        document.getElementById(
            "pointName"
        )
        .value
        .trim();


    if(name === ""){

        alert(
            "地点名を入力してください"
        );

        return;

    }


    socket.emit(
        "addPoint",
        {

            name:
                name,

            type:
                document.getElementById(
                    "pointType"
                ).value,

            lat:
                selectedPointLat,

            lon:
                selectedPointLon

        }
    );


    selectedPointName =
        name;


    document.getElementById(
        "pointName"
    ).value =
        "";

}



// ==================================================
// 地点削除
// ==================================================

function deletePoint(){

    const name =
        selectedPointName ||

        document.getElementById(
            "pointName"
        )
        .value
        .trim();


    if(name === ""){

        alert(
            "削除する地点を選択してください"
        );

        return;

    }


    if(
        !confirm(
            name +
            " を削除しますか？"
        )
    ){

        return;

    }


    socket.emit(
        "deletePoint",
        name
    );


    selectedPointName =
        null;


    document.getElementById(
        "pointName"
    ).value =
        "";

}



// ==================================================
// 地点受信
// ==================================================

socket.on(
    "points",
    points=>{

        Object.keys(
            pointMarkers
        )
        .forEach(
            name=>{

                if(
                    !points[name]
                ){

                    map.removeLayer(
                        pointMarkers[name]
                    );


                    delete pointMarkers[name];

                }

            }
        );


        Object.keys(
            points
        )
        .forEach(
            name=>{

                const p =
                    points[name];


                if(
                    pointMarkers[name]
                ){

                    map.removeLayer(
                        pointMarkers[name]
                    );

                }


                pointMarkers[name] =
                    L.marker(

                        [
                            p.lat,
                            p.lon
                        ],

                        {

                            icon:
                                L.icon({

                                    iconUrl:
                                        "/icon/point.png",

                                    iconSize:
                                        [60,60],

                                    iconAnchor:
                                        [30,60],

                                    popupAnchor:
                                        [15,-70]

                                })

                        }

                    )
                    .addTo(
                        map
                    );


                pointMarkers[name]
                    .bindTooltip(

                        name,

                        {

                            permanent:
                                true,

                            direction:
                                "top",

                            offset:
                                [0,-30],

                            className:
                                "pointLabel"

                        }

                    );


                pointMarkers[name]
                    .on(
                        "click",
                        ()=>{

                            selectedPointName =
                                name;


                            document.getElementById(
                                "pointName"
                            ).value =
                                name;


                            selectedPointLat =
                                p.lat;


                            selectedPointLon =
                                p.lon;


                            document.getElementById(
                                "pointLat"
                            ).textContent =
                                Number(
                                    p.lat
                                )
                                .toFixed(6);


                            document.getElementById(
                                "pointLon"
                            ).textContent =
                                Number(
                                    p.lon
                                )
                                .toFixed(6);


                            const utm =
                                proj4(

                                    "EPSG:4326",

                                    "+proj=utm +zone=52 +south +datum=WGS84",

                                    [
                                        p.lon,
                                        p.lat
                                    ]

                                );


                            document.getElementById(
                                "pointUtmZone"
                            ).textContent =
                                "52S";


                            document.getElementById(
                                "pointUtmE"
                            ).textContent =
                                Math.round(
                                    utm[0]
                                );


                            document.getElementById(
                                "pointUtmN"
                            ).textContent =
                                Math.round(
                                    utm[1]
                                );

                        }
                    );


                pointMarkers[name]
                    .bindPopup(`

                        <b>
                            📍${name}
                        </b>

                        <br>

                        ${Number(
                            p.lat
                        ).toFixed(6)}

                        <br>

                        ${Number(
                            p.lon
                        ).toFixed(6)}

                    `);

            }
        );

    }
);
