<!-- 現在位置自動共有君 Version 2.3
     HTML修正版 ①/4
     自動ログイン対応版
-->

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>現在位置自動共有君 Version 2.3</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>



<style>

body{
    font-family:sans-serif;
    margin:6px;
    background:#f5f5f5;
    font-size:16px;
}


h2{
    font-size:22px;
    text-align:center;
    margin:8px;
}


h3{
    font-size:18px;
    margin:5px 0;
}


.card{

    background:white;
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
    box-shadow:0 1px 3px #aaa;

}


input,select{

    width:95%;
    font-size:18px;
    padding:6px;
    margin:3px;
    border-radius:6px;
    border:1px solid #888;

}


button{

    font-size:18px;
    padding:8px;
    margin:4px;
    width:48%;
    border-radius:8px;

}


#map{

    height:65vh;
    width:100%;
    border-radius:10px;

}


.inputRow{

display:flex;
gap:5px;

}


.inputRow input,
.inputRow select{

width:45%;

}


.buttonRow{

display:flex;
gap:6px;

}


.buttonRow button{

flex:1;
width:auto;
white-space:nowrap;
font-size:16px;

}


.gpsButton{

background:#4caf50;
color:white;
font-weight:bold;

}


.reportButton{

background:#2196f3;
color:white;
font-weight:bold;

}


#gpsStatus{

font-size:18px;
font-weight:bold;

}


#lastSend{

font-size:16px;

}


.userHeader{

display:grid;

grid-template-columns:
50px 1fr 60px 60px 70px 60px;

background:#ddd;

font-weight:bold;

font-size:13px;

padding:6px 4px;

}


.userRow{

display:grid;

grid-template-columns:
50px 1fr 60px 60px 70px 60px;

align-items:center;

background:white;

border-bottom:1px solid #ccc;

padding:10px 4px;

font-size:14px;

cursor:pointer;

}


.userLabel{

background:white;

border:1px solid #555;

border-radius:5px;

padding:3px 6px;

font-size:14px;

font-weight:bold;

color:black;

}


.timelineItem{

background:white;

border-bottom:1px solid #ccc;

padding:8px;

}


.timelineTime{

font-size:12px;
color:#666;

}


.timelineMessage{

font-size:15px;

}


.selected-marker{

animation:markerBlink 0.6s infinite;

}


@keyframes markerBlink{

0%{
filter:brightness(2);
}

50%{
filter:brightness(0.5);
}

100%{
filter:brightness(2);
}

}



/*=====================
 ユーザー削除ボタン
=====================*/

.deleteButton{

width:auto;

font-size:12px;

padding:3px 6px;

margin:0;

border-radius:5px;

white-space:nowrap;

}



.pointLabel{

background:#fff8dc;

border:1px solid #888;

border-radius:5px;

padding:3px 6px;

font-size:14px;

font-weight:bold;

color:#333;

}

</style>

</head>


<body>






<details class="card">

<summary>
👤 使用者情報
</summary>


<br>


<div class="inputRow">

<input
id="name"
value="隊員A"
placeholder="名前">


<select id="iconType">

<option value="person">
👤隊員
</option>

<option value="vehicle">
🚙車両
</option>

</select>


</div>



<div class="inputRow">

<input
id="water"
type="number"
value="100"
placeholder="💧水量">


<input
id="fuel"
type="number"
value="100"
placeholder="⛽燃料">


</div>



<input
id="destination"
placeholder="📍次の目的地">



<div class="buttonRow">

<button onclick="registerUser()">

👤 ユーザー登録

</button>

</div>



<div id="registerStatus">

未登録

</div>


</details>





<div class="card">


<div class="buttonRow">


<button
class="gpsButton"
onclick="startGPS()">

📡 GPS開始

</button>


<button
class="reportButton"
onclick="updateStatus()">

🔄 現在地報告

</button>


</div>



<div id="gpsStatus">

🔴 GPS停止中

</div>


<div id="lastSend">

最終送信：-

</div>


</div>




<div id="map"></div>

<!-- HTML修正版 ②/4 -->


<details class="card">

<summary>
📍地点登録
</summary>


<br>


<input
id="pointName"
placeholder="地点名（例：CP1、給水所）">



<select id="pointType">

<option value="CP">
🏳 指揮所(CP)
</option>

<option value="water">
💧給水所
</option>

<option value="supply">
📦補給地点
</option>

<option value="point">
📍その他
</option>


</select>



<button onclick="addPoint()">

📍登録

</button>


</details>





<details class="card">

<summary>
📋 クロノロジー
</summary>


<br>


<div class="inputRow">


<input
id="chronoMessage"
placeholder="活動内容を入力">


<button onclick="sendChronology()">

送信

</button>


</div>



<hr>


<div id="timeline">

</div>


</details>





<h3>
👥 接続ユーザー
</h3>




<div class="userHeader">


<div>状態</div>

<div>名前</div>

<div>💧水</div>

<div>⛽燃料</div>

<div>最終</div>

<div>操作</div>

</div>




<div id="users"></div>





<script>


const socket = io();



let registered=false;



let markers={};

let pointMarkers={};



let chronology=[];



let watchID=null;

let gpsTimer=null;



let lastLat=0;

let lastLon=0;

let lastSendTime=0;



const SEND_INTERVAL=30000;

const MOVE_DISTANCE=10;



//=====================
// 自動ログイン復元
//=====================

window.onload=function(){


[
"name",
"water",
"fuel",
"destination",
"iconType"

].forEach(key=>{


let value=
localStorage.getItem(key);



if(value!==null){


let element=
document.getElementById(key);



if(element){

element.value=value;

}


}


});



// 最後のユーザーを自動登録

let savedName =
localStorage.getItem("name");



if(savedName){


setTimeout(()=>{


socket.emit(

"registerUser",

{


name:savedName,


water:Number(
localStorage.getItem("water") || 0
),


fuel:Number(
localStorage.getItem("fuel") || 0
),


destination:
localStorage.getItem("destination") || "",


iconType:
localStorage.getItem("iconType") || "person"


}

);



registered=true;



document.getElementById(
"registerStatus"
).innerHTML=


"🟢 自動登録 : "+savedName;



},1000);



}



if(
localStorage.getItem("gpsRunning")==="true"
){


setTimeout(()=>{


startGPS();


},2000);



}


};






//=====================
// 接続
//=====================

socket.on(

"connect",

()=>{


console.log(
"サーバー接続"
);



});


socket.on(
"userDeleted",
(name)=>{


if(
document.getElementById("name").value === name
){

localStorage.clear();

registered=false;


document.getElementById(
"registerStatus"
).innerHTML=
"未登録";


alert(
"ユーザー登録を削除しました"
);

}


}
);



socket.on(

"disconnect",

()=>{


document.getElementById(
"gpsStatus"
).innerHTML=
"🔴 サーバー切断";


}

);





//=====================
// ユーザー登録
//=====================

function registerUser(){



let name=
document.getElementById("name")
.value
.trim();



if(name===""){

alert(
"名前を入力してください"
);

return;

}



socket.emit(

"registerUser",

{


name:name,


water:Number(
document.getElementById("water").value
),


fuel:Number(
document.getElementById("fuel").value
),


destination:
document.getElementById("destination").value,


iconType:
document.getElementById("iconType").value


}

);



registered=true;



[
"name",
"water",
"fuel",
"destination",
"iconType"

].forEach(key=>{


localStorage.setItem(

key,

document.getElementById(key).value

);


});



document.getElementById(
"registerStatus"
).innerHTML=


"🟢 登録済み : "+name;


//=====================
// 登録後GPS自動開始
//=====================

setTimeout(()=>{

startGPS();

},1000);


}

<!-- HTML修正版 ③/4 -->


//=====================
// 地図
//=====================

const map=L.map('map')
.setView(
[32.803,130.707],
13
);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'OpenStreetMap'

}

).addTo(map);




//=====================
// GPS開始
//=====================

function startGPS(){


if(!registered){

alert(
"先にユーザー登録してください"
);

return;

}



localStorage.setItem(
"gpsRunning",
"true"
);



if(watchID!==null){

return;

}



gpsTimer=setInterval(()=>{


navigator.geolocation.getCurrentPosition(

pos=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


}

);


},30000);






watchID=

navigator.geolocation.watchPosition(


pos=>{


let lat=pos.coords.latitude;

let lon=pos.coords.longitude;



if(lastLat===0){


sendLocation(
lat,
lon
);


lastLat=lat;

lastLon=lon;

lastSendTime=Date.now();


return;

}




let distance=

getDistance(

lastLat,

lastLon,

lat,

lon

);



let now=Date.now();



if(

distance>=MOVE_DISTANCE ||

now-lastSendTime>=SEND_INTERVAL

){


sendLocation(
lat,
lon
);


lastLat=lat;

lastLon=lon;

lastSendTime=now;


}



},



err=>{


console.log(
"GPSエラー",
err
);


},



{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0


}



);


}





//=====================
// GPS送信
//=====================

function sendLocation(

lat,

lon

){



let utm=

proj4(

'EPSG:4326',

'+proj=utm +zone=52 +south +datum=WGS84',

[lon,lat]

);



let utmE=Math.round(
utm[0]
);


let utmN=Math.round(
utm[1]
);



[
"name",
"water",
"fuel",
"destination",
"iconType"

].forEach(key=>{


localStorage.setItem(

key,

document.getElementById(key).value

);


});




document.getElementById(
"gpsStatus"
).innerHTML=

"🟢 GPS稼働中";



document.getElementById(
"lastSend"
).innerHTML=

"最終送信："+
new Date()
.toLocaleTimeString();




if(!registered){

return;

}




socket.emit(

"location",

{


name:
document.getElementById("name").value,


lat:lat,


lon:lon,


utmZone:"52S",


utmE:utmE,


utmN:utmN,


water:Number(
document.getElementById("water").value
),


fuel:Number(
document.getElementById("fuel").value
),


destination:
document.getElementById("destination").value,


iconType:
document.getElementById("iconType").value



}

);



}






//=====================
// 現在地報告
//=====================

function updateStatus(){


navigator.geolocation.getCurrentPosition(

pos=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


}

);


}




//=====================
// 距離計算
//=====================

function getDistance(

lat1,

lon1,

lat2,

lon2

){


const R=6371000;


const dLat=

(lat2-lat1)

*

Math.PI/180;


const dLon=

(lon2-lon1)

*

Math.PI/180;



const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)**2;



return R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


}




//=====================
// クロノロジー
//=====================

socket.on(

"chronology",

(data)=>{


chronology=data;


renderChronology();


}

);



function sendChronology(){


let msg=

document.getElementById(
"chronoMessage"
)
.value
.trim();



if(msg===""){

return;

}



socket.emit(

"addChronology",

{

message:msg,

user:
document.getElementById("name").value

}

);



document.getElementById(
"chronoMessage"
).value="";


}




function renderChronology(){


let html="";


chronology.forEach(item=>{


html+=`

<div class="timelineItem">

<div class="timelineTime">

${item.time}

</div>


<div class="timelineMessage">

${item.message}

</div>


</div>

`;



});



document.getElementById(
"timeline"
).innerHTML=html;


}


<!-- HTML修正版 ④/4 -->


//=====================
// アイコン
//=====================

function createIcon(type){


let image;


if(type==="vehicle"){

image="/icon/vehicle.png";

}
else{

image="/icon/person.png";

}



return L.icon({

iconUrl:image,

iconSize:[60,60],

iconAnchor:[30,60],

popupAnchor:[0,-70]

});


}





//=====================
// ユーザー表示
//=====================

socket.on(

"locations",

(users)=>{


let html="";



// 消えたマーカー削除

Object.keys(markers).forEach(name=>{


if(!users[name]){


map.removeLayer(
markers[name]
);


delete markers[name];


}


});





Object.keys(users).forEach(name=>{


let user=users[name];



let lat=user.lat;

let lon=user.lon;



// GPS未取得の場合

if(lat===null || lon===null){

lat=32.803;

lon=130.707;

}



let icon=createIcon(
user.iconType
);



if(markers[name]){


markers[name].setLatLng(
[
lat,
lon
]
);



markers[name].setIcon(icon);



}
else{


markers[name]=L.marker(

[
lat,
lon
],

{

icon:icon

}

)

.addTo(map)

.bindTooltip(

user.name,

{

permanent:true,

direction:"top",

offset:[0,-60],

className:"pointLabel"

}

);


}





markers[name].bindPopup(

`

<b>${user.name}</b>

<br>

状態:
${user.online ? "🟢ON":"🔴OFF"}

<hr>

💧水量:
${user.water}

<br>

⛽燃料:
${user.fuel}

<br>

📍目的地:
${user.destination || "-"}

<br><br>

UTM:
${user.utmZone || "52S"}

<br>

E:
${user.utmE || ""}

<br>

N:
${user.utmN || ""}

<br><br>

🕒
${user.lastUpdate ?
new Date(user.lastUpdate)
.toLocaleString()
:
"-"
}

`

);





html+=`

<div class="userRow">


<div onclick="focusUser('${user.name}')">
${user.online ? "🟢ON":"🔴OFF"}
</div>


<div onclick="focusUser('${user.name}')">
${user.name}
</div>


<div onclick="focusUser('${user.name}')">
${user.water}
</div>


<div onclick="focusUser('${user.name}')">
${user.fuel}
</div>


<div onclick="focusUser('${user.name}')">
${timeAgo(user.lastUpdate)}
</div>


<div>

<button
class="deleteButton"
onclick="event.stopPropagation(); deleteUser('${user.name}')">

🗑

</button>

</div>


</div>

`;



});



document.getElementById(
"users"
).innerHTML=html;


}

);





//=====================
// ユーザー移動
//=====================

function focusUser(name){


if(!markers[name]){

return;

}



let pos=
markers[name].getLatLng();



map.setView(

[
pos.lat,
pos.lng
],

17,

{

animate:true

}

);



markers[name].openPopup();


}


function deleteUser(name){

if(!confirm(
name+" を削除しますか？"
)){

return;

}


socket.emit(
"deleteUser",
name
);


}





function timeAgo(t){


if(!t){

return "-";

}


let sec=

Math.floor(

(Date.now()-t)/1000

);



if(sec<60){

return sec+"秒前";

}


let min=

Math.floor(sec/60);



if(min<60){

return min+"分前";

}



return Math.floor(min/60)+"時間前";


}






//=====================
// 地点登録
//=====================

let selectedPointLat=null;

let selectedPointLon=null;



map.on(

"click",

(e)=>{


selectedPointLat=
e.latlng.lat;


selectedPointLon=
e.latlng.lng;


alert(

"地点候補\n"+
selectedPointLat.toFixed(6)+
"\n"+
selectedPointLon.toFixed(6)

);


}

);





function addPoint(){

console.log(
"addPoint開始",
selectedPointLat,
selectedPointLon
);


if(selectedPointLat===null){

alert(
"先に地図をクリックしてください"
);

return;

}


let name =
document.getElementById(
"pointName"
).value.trim();


console.log(
"地点情報",
name,
document.getElementById("pointType").value,
selectedPointLat,
selectedPointLon
);


if(name===""){

alert(
"地点名を入力してください"
);

return;

}


socket.emit(
"addPoint",
{

name:name,

type:
document.getElementById(
"pointType"
).value,

lat:selectedPointLat,

lon:selectedPointLon

}
);


alert(
"地点登録送信しました"
);


document.getElementById(
"pointName"
).value="";

}



function addPoint(){

console.log(
"addPoint開始",
selectedPointLat,
selectedPointLon
);


if(selectedPointLat===null){

alert(
"先に地図をクリックしてください"
);

return;

}


let name =
document.getElementById(
"pointName"
).value.trim();


console.log(
"地点情報",
name,
document.getElementById("pointType").value,
selectedPointLat,
selectedPointLon
);


if(name===""){

alert(
"地点名を入力してください"
);

return;

}


socket.emit(
"addPoint",
{

name:name,

type:
document.getElementById(
"pointType"
).value,

lat:selectedPointLat,

lon:selectedPointLon

}
);


alert(
"地点登録送信しました"
);


document.getElementById(
"pointName"
).value="";

}







//=====================
// 地点受信
//=====================

socket.on(

"points",

(points)=>{


Object.keys(points).forEach(name=>{


let p=points[name];



if(pointMarkers[name]){

map.removeLayer(
pointMarkers[name]
);

}





pointMarkers[name]=L.marker(

[
p.lat,
p.lon
],

{
icon:L.icon({

iconUrl:"/icon/point.png",

iconSize:[60,60],

iconAnchor:[30,60]

})
}

)

.addTo(map)

.bindTooltip(

name,

{

permanent:true,

direction:"top",

offset:[0,-60],

className:"pointLabel"

}

)

.bindPopup(

`

<b>📍${name}</b>

<br>

${p.lat.toFixed(6)}

<br>

${p.lon.toFixed(6)}

`

);



});


}

);




</script>


</body>


</html>
