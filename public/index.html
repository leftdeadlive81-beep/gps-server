<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>GPS位置共有システム</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>


<style>

body {
    font-family:sans-serif;
    margin:20px;
}

#map {
    height:500px;
    width:100%;
}

input {
    margin:5px;
    padding:5px;
}

button {
    padding:8px;
    margin:5px;
}

.user {
    border:1px solid #aaa;
    padding:10px;
    margin:5px;
}

</style>

</head>


<body>


<h2>GPS位置共有システム</h2>


名前：

<input id="name" value="隊員A">

<br>


水量：

<input id="water" type="number" value="0">

<br>


燃料：

<input id="fuel" type="number" value="100">

<br>


次の目的地：

<input id="destination" type="text" value="">

<br>


<button onclick="startGPS()">
GPS開始
</button>


<button onclick="updateStatus()">
状態更新
</button>


<br><br>


<div id="map"></div>


<h3>接続ユーザー</h3>

<div id="users"></div>



<script>


const socket = io();


//================
// 地図
//================

const map =
L.map('map')
.setView(
[32.803,130.707],
13
);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'OpenStreetMap'
}
)
.addTo(map);



let markers={};



//================
// GPS
//================

let myPosition={
lat:0,
lon:0
};


let lastLat=0;
let lastLon=0;


const MOVE_DISTANCE=10;



function startGPS(){


if(!navigator.geolocation){

alert("GPS利用不可");
return;

}



navigator.geolocation.watchPosition(


(position)=>{


let lat =
position.coords.latitude;


let lon =
position.coords.longitude;



let distance =
getDistance(
lastLat,
lastLon,
lat,
lon
);



if(
lastLat===0 ||
distance >= MOVE_DISTANCE
){


myPosition.lat=lat;
myPosition.lon=lon;


sendLocation();


lastLat=lat;
lastLon=lon;

}


},


(error)=>{

alert("位置情報取得失敗");

},


{

enableHighAccuracy:true,

maximumAge:10000,

timeout:10000

}


);


}



//================
// 送信
//================

function sendLocation(){


let data={


name:
document.getElementById("name").value,


lat:
myPosition.lat,


lon:
myPosition.lon,


water:
Number(
document.getElementById("water").value
),


fuel:
Number(
document.getElementById("fuel").value
),


destination:
document.getElementById("destination").value


};



socket.emit(
"location",
data
);


}



//================
// 状態更新
//================

function updateStatus(){

sendLocation();

}



//================
// 距離計算
//================

function getDistance(
lat1,
lon1,
lat2,
lon2
){


if(lat1===0){

return 99999;

}


const R=6371000;


const dLat=
(lat2-lat1)
*Math.PI/180;


const dLon=
(lat2-lon1)
*Math.PI/180;


const a=

Math.sin(dLat/2)
*
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180)
*
Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)
*
Math.sin(dLon/2);



const c=
2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);



return R*c;

}



//================
// 受信
//================

socket.on(
"locations",
(users)=>{


let html="";


Object.keys(users)
.forEach(id=>{


let user=users[id];



if(markers[id]){


markers[id]
.setLatLng(
[user.lat,user.lon]
);


}else{


markers[id]=
L.marker(
[user.lat,user.lon]
)
.addTo(map);


}



markers[id]
.bindPopup(

`

<b>${user.name}</b><br>

緯度:${user.lat}<br>

経度:${user.lon}<br>

💧 水量:${user.water}<br>

⛽ 燃料:${user.fuel}<br>

📍 次の目的地:${user.destination}

`

);



html+=

`

<div class="user">

<b>${user.name}</b><br>

💧 水量:${user.water}<br>

⛽ 燃料:${user.fuel}<br>

📍 次の目的地:${user.destination}

</div>

`;



});


document.getElementById("users")
.innerHTML=html;


});



</script>


</body>

</html>
