<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>現在位置自動共有君 Version 2.3</title>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css">


<script
    src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>


<script
    src="/socket.io/socket.io.js">
</script>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js">
</script>



<style>

/*==================================================
  基本
==================================================*/

*{
    box-sizing:border-box;
}


body{

    font-family:sans-serif;

    margin:0;

    background:#f5f5f5;

    font-size:16px;

    overflow-x:hidden;

}


h2{

    font-size:22px;

    text-align:center;

    margin:8px;

}


.card{

    background:white;

    border-radius:10px;

    padding:8px;

    margin-bottom:8px;

    box-shadow:0 1px 3px #aaa;

}


.sectionTitle{

    font-size:18px;

    font-weight:bold;

    margin:5px 0 8px 0;

}



/*==================================================
  タブ
==================================================*/

#tabBar{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:4px;

    padding:5px;

    background:#222;

    position:sticky;

    top:0;

    z-index:1000;

}


.tabButton{

    border:none;

    border-radius:8px;

    background:#555;

    color:white;

    padding:7px 3px;

    margin:0;

    width:100%;

    min-height:55px;

    cursor:pointer;

}


.tabButton.active{

    background:#1976d2;

}


.tabIcon{

    display:block;

    font-size:23px;

    line-height:25px;

}


.tabText{

    display:block;

    font-size:13px;

    margin-top:2px;

}



/*==================================================
  タブ内容
==================================================*/

.tabContent{

    display:none;

    padding:6px;

}


.tabContent.active{

    display:block;

}



/*==================================================
  地図
==================================================*/

#map{

    height:65vh;

    width:100%;

    border-radius:10px;

    overflow:hidden;

}



/*==================================================
  入力
==================================================*/

input,
select{

    width:95%;

    font-size:18px;

    padding:6px;

    margin:3px;

    border-radius:6px;

    border:1px solid #888;

}


.inputRow{

    display:flex;

    gap:5px;

}


.inputRow input,
.inputRow select{

    width:45%;

}



/*==================================================
  ボタン
==================================================*/

button{

    font-size:18px;

    padding:8px;

    margin:4px;

    border-radius:8px;

    cursor:pointer;

}


.buttonRow{

    display:flex;

    gap:6px;

}


.buttonRow button{

    flex:1;

    width:auto;

    white-space:nowrap;

    font-size:16px;

}


.settingsButton{

    width:100%;

    background:#1976d2;

    color:white;

    font-weight:bold;

}


.pointButtonRow{

    display:flex;

    gap:5px;

}


.pointButtonRow button{

    flex:1;

}



/*==================================================
  GPS
==================================================*/

#gpsPanel{

    background:white;

    border-radius:10px;

    padding:6px;

    margin-top:6px;

    box-shadow:0 1px 3px #aaa;

}


.gpsButtonRow{

    display:flex;

    gap:6px;

}


.gpsButtonRow button{

    flex:1;

    margin:3px;

}


.gpsButton{

    background:#4caf50;

    color:white;

    font-weight:bold;

}


.reportButton{

    background:#2196f3;

    color:white;

    font-weight:bold;

}


#gpsStatus{

    font-size:18px;

    font-weight:bold;

    margin:4px;

}


#lastSend{

    font-size:15px;

    margin:4px;

}



/*==================================================
  隊員一覧
==================================================*/

.userHeader{

    display:grid;

    grid-template-columns:
        50px 1fr 55px 55px 65px 50px;

    background:#ddd;

    font-weight:bold;

    font-size:13px;

    padding:6px 4px;

}


.userRow{

    display:grid;

    grid-template-columns:
        50px 1fr 55px 55px 65px 50px;

    align-items:center;

    background:white;

    border-bottom:1px solid #ccc;

    padding:8px 4px;

    font-size:14px;

    cursor:pointer;

}


.deleteButton{

    width:auto;

    font-size:12px;

    padding:3px 6px;

    margin:0;

    border-radius:5px;

    white-space:nowrap;

}



/*==================================================
  クロノロジー
==================================================*/

.chronoInputRow{

    display:flex;

    gap:5px;

}


.chronoInputRow input{

    flex:1;

    width:auto;

}


#chronoSendButton{

    width:70px;

    margin:3px;

}


.timelineItem{

    background:white;

    border-bottom:1px solid #ccc;

    padding:8px;

}


.timelineTime{

    font-size:12px;

    color:#666;

}


.timelineMessage{

    font-size:15px;

}



/*==================================================
  登録
==================================================*/

.settingsCard{

    margin-bottom:8px;

}


.pointInfo{

    background:#f5f5f5;

    border-radius:6px;

    padding:8px;

    margin-top:8px;

    font-size:15px;

    line-height:1.7;

}


.pointInfo hr{

    border:none;

    border-top:1px solid #ccc;

    margin:5px 0;

}



/*==================================================
  地図ラベル
==================================================*/

.pointLabel{

    background:#fff8dc;

    border:1px solid #888;

    border-radius:5px;

    padding:3px 6px;

    font-size:14px;

    font-weight:bold;

    color:#333;

}



/*==================================================
  選択マーカー
==================================================*/

.selected-marker{

    animation:markerBlink 0.6s infinite;

}


@keyframes markerBlink{

    0%{
        filter:brightness(2);
    }

    50%{
        filter:brightness(0.5);
    }

    100%{
        filter:brightness(2);
    }

}



/*==================================================
  交通規制
==================================================*/

.trafficIcon{

    font-size:28px;

    text-align:center;

    line-height:30px;

}



/*==================================================
  スマートフォン
==================================================*/

@media(max-width:600px){

    #map{

        height:58vh;

    }


    .tabButton{

        min-height:50px;

    }


    .tabIcon{

        font-size:20px;

    }


    .tabText{

        font-size:12px;

    }


    .userHeader,
    .userRow{

        grid-template-columns:
            42px 1fr 45px 50px 55px 45px;

        font-size:12px;

    }


    .userHeader{

        font-size:11px;

    }


    .deleteButton{

        font-size:11px;

        padding:2px 4px;

    }

}

</style>

</head>


<body>


<!--==================================================
    タブバー
==================================================-->

<div id="tabBar">


    <button
        class="tabButton active"
        onclick="showTab('mapTab',this)">

        <span class="tabIcon">🗺️</span>

        <span class="tabText">地図</span>

    </button>


    <button
        class="tabButton"
        onclick="showTab('usersTab',this)">

        <span class="tabIcon">👥</span>

        <span class="tabText">隊員一覧</span>

    </button>


    <button
        class="tabButton"
        onclick="showTab('chronoTab',this)">

        <span class="tabIcon">📋</span>

        <span class="tabText">報連相</span>

    </button>


    <button
        class="tabButton"
        onclick="showTab('settingsTab',this)">

        <span class="tabIcon">⚙️</span>

        <span class="tabText">登録</span>

    </button>

</div>



<!--==================================================
    地図タブ
==================================================-->

<div
    id="mapTab"
    class="tabContent active">


    <div id="map"></div>


    <div id="gpsPanel">


        <div class="gpsButtonRow">


            <button
                class="gpsButton"
                onclick="startGPS()">

                📡 GPS開始

            </button>


            <button
                class="reportButton"
                onclick="updateStatus()">

                🔄 現在地報告

            </button>


        </div>


        <div id="gpsStatus">

            🔴 GPS停止中

        </div>


        <div id="lastSend">

            最終送信：-

        </div>


    </div>


</div>



<!--==================================================
    隊員一覧タブ
==================================================-->

<div
    id="usersTab"
    class="tabContent">


    <div class="sectionTitle">

        👥 接続ユーザー

    </div>


    <div class="userHeader">

        <div>状態</div>

        <div>名前</div>

        <div>💧水</div>

        <div>⛽燃料</div>

        <div>最終</div>

        <div>操作</div>

    </div>


    <div id="users"></div>


</div>



<!--==================================================
    報連相タブ
==================================================-->

<div
    id="chronoTab"
    class="tabContent">


    <div class="sectionTitle">

        📋 報連相

    </div>


    <div class="chronoInputRow">


        <input
            id="chronoMessage"
            placeholder="活動内容を入力">


        <button
            id="chronoSendButton"
            onclick="sendChronology()">

            送信

        </button>


    </div>


    <div id="timeline"></div>


</div>



<!--==================================================
    登録タブ
==================================================-->

<div
    id="settingsTab"
    class="tabContent">


    <!-- 使用者情報 -->

    <div class="card settingsCard">


        <div class="sectionTitle">

            👤 使用者情報

        </div>


        <div class="inputRow">


            <input
                id="name"
                value="隊員A"
                placeholder="名前">


            <select id="iconType">

                <option value="1">
                    👤 隊員
                </option>

                <option value="2">
                    🚙 小型
                </option>

                <option value="3">
                    🚚 中型
                </option>

                <option value="4">
                    🚛 大型
                </option>

            </select>


        </div>


        <div class="inputRow">


            <input
                id="water"
                type="number"
                value="100"
                placeholder="💧水量">


            <input
                id="fuel"
                type="number"
                value="100"
                placeholder="⛽燃料">


        </div>


        <input
            id="destination"
            placeholder="📍次の目的地">


        <button
            class="settingsButton"
            onclick="registerUser()">

            👤 ユーザー登録

        </button>


        <div id="registerStatus">

            未登録

        </div>


    </div>



    <!-- 地点登録 -->

    <div class="card settingsCard">


        <div class="sectionTitle">

            📍 地点登録

        </div>


        <input
            id="pointName"
            placeholder="地点名（例：CP1、給水所）">


        <select id="pointType">

            <option value="CP">
                🏳 指揮所(CP)
            </option>

            <option value="water">
                💧給水所
            </option>

            <option value="supply">
                📦補給地点
            </option>

            <option value="point">
                📍その他
            </option>

        </select>


        <div class="pointButtonRow">


            <button
                onclick="addPoint()">

                📍登録

            </button>


            <button
                onclick="deletePoint()">

                🗑削除

            </button>


        </div>


        <div class="pointInfo">


            <div>

                📍 緯度：
                <span id="pointLat">-</span>

            </div>


            <div>

                📍 経度：
                <span id="pointLon">-</span>

            </div>


            <hr>


            <div>

                🧭 UTM：
                <span id="pointUtmZone">-</span>

            </div>


            <div>

                E：
                <span id="pointUtmE">-</span>

            </div>


            <div>

                N：
                <span id="pointUtmN">-</span>

            </div>


        </div>


    </div>


</div>



<script>


//==================================================
// Socket.IO
//==================================================

const socket = io();


let registered = false;


let markers = {};

let pointMarkers = {};


let chronology = [];


let watchID = null;

let gpsTimer = null;


let lastLat = 0;

let lastLon = 0;

let lastSendTime = 0;


const SEND_INTERVAL = 30000;

const MOVE_DISTANCE = 10;



//==================================================
// タブ切替
//==================================================

function showTab(tabId, button){

    document
        .querySelectorAll(".tabContent")
        .forEach(tab=>{

            tab.classList.remove("active");

        });


    document
        .querySelectorAll(".tabButton")
        .forEach(btn=>{

            btn.classList.remove("active");

        });


    const tab =
        document.getElementById(tabId);


    if(tab){

        tab.classList.add("active");

    }


    if(button){

        button.classList.add("active");

    }


    if(tabId === "mapTab"){

        setTimeout(()=>{

            map.invalidateSize();

        },100);

    }

}



//==================================================
// アイコン種類の旧データ変換
//==================================================

function normalizeIconType(type){

    type = String(type || "");


    if(type === "person"){

        return "1";

    }


    if(type === "vehicle"){

        return "2";

    }


    if(
        ["1","2","3","4"]
        .includes(type)
    ){

        return type;

    }


    return "1";

}



//==================================================
// 自動ログイン復元
//==================================================

window.onload = function(){

    [
        "name",
        "water",
        "fuel",
        "destination",
        "iconType"
    ].forEach(key=>{

        let value =
            localStorage.getItem(key);


        if(value !== null){

            const element =
                document.getElementById(key);


            if(element){

                if(key === "iconType"){

                    value =
                        normalizeIconType(value);


                    localStorage.setItem(
                        "iconType",
                        value
                    );

                }


                element.value = value;

            }

        }

    });


    const iconElement =
        document.getElementById("iconType");


    if(
        iconElement &&
        !localStorage.getItem("iconType")
    ){

        iconElement.value = "1";


        localStorage.setItem(
            "iconType",
            "1"
        );

    }


    const savedName =
        localStorage.getItem("name");


    if(savedName){

        setTimeout(()=>{

            const savedIconType =
                normalizeIconType(
                    localStorage.getItem(
                        "iconType"
                    )
                );


            socket.emit(
                "registerUser",
                {

                    name:savedName,

                    water:Number(
                        localStorage.getItem(
                            "water"
                        ) || 0
                    ),

                    fuel:Number(
                        localStorage.getItem(
                            "fuel"
                        ) || 0
                    ),

                    destination:
                        localStorage.getItem(
                            "destination"
                        ) || "",

                    iconType:
                        savedIconType

                }
            );


            registered = true;


            document.getElementById(
                "registerStatus"
            ).innerHTML =
                "🟢 自動登録 : " +
                savedName;


        },1000);

    }


    if(
        localStorage.getItem(
            "gpsRunning"
        ) === "true"
    ){

        setTimeout(()=>{

            startGPS();

        },2000);

    }

};



//==================================================
// Socket 接続
//==================================================

socket.on(
    "connect",
    ()=>{

        console.log(
            "サーバー接続"
        );

    }
);


socket.on(
    "disconnect",
    ()=>{

        document.getElementById(
            "gpsStatus"
        ).innerHTML =
            "🔴 サーバー切断";

    }
);



//==================================================
// ユーザー削除通知
//==================================================

socket.on(
    "userDeleted",
    (name)=>{

        if(
            document.getElementById(
                "name"
            ).value === name
        ){

            localStorage.clear();

            registered = false;


            document.getElementById(
                "registerStatus"
            ).innerHTML =
                "未登録";


            alert(
                "ユーザー登録を削除しました"
            );

        }

    }
);



//==================================================
// ユーザー登録
//==================================================

function registerUser(){

    const name =
        document.getElementById(
            "name"
        )
        .value
        .trim();


    if(name === ""){

        alert(
            "名前を入力してください"
        );

        return;

    }


    const iconType =
        normalizeIconType(
            document.getElementById(
                "iconType"
            ).value
        );


    document.getElementById(
        "iconType"
    ).value = iconType;


    socket.emit(
        "registerUser",
        {

            name:name,

            water:Number(
                document.getElementById(
                    "water"
                ).value
            ),

            fuel:Number(
                document.getElementById(
                    "fuel"
                ).value
            ),

            destination:
                document.getElementById(
                    "destination"
                ).value,

            iconType:iconType

        }
    );


    registered = true;


    [
        "name",
        "water",
        "fuel",
        "destination",
        "iconType"
    ].forEach(key=>{

        localStorage.setItem(
            key,
            document.getElementById(
                key
            ).value
        );

    });


    document.getElementById(
        "registerStatus"
    ).innerHTML =
        "🟢 登録済み : " +
        name;


    setTimeout(()=>{

        startGPS();

    },1000);

}



//==================================================
// 地図
//==================================================

const map =
    L.map("map")
    .setView(
        [32.803,130.707],
        13
    );



// 標準地図

const osm =
    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "OpenStreetMap"
        }
    );



// 航空写真

const satellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            attribution:
                "Esri"
        }
    );



// 地形図

const terrain =
    L.tileLayer(
        "https://tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "OpenTopoMap"
        }
    );



// 国土地理院

const gsi =
    L.tileLayer(
        "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
        {
            attribution:
                "国土地理院"
        }
    );



// 防災淡色地図

const gsiPale =
    L.tileLayer(
        "https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",
        {
            attribution:
                "国土地理院 淡色地図"
        }
    );



// 初期地図

osm.addTo(map);



//==================================================
// 交通規制レイヤー
//==================================================

let trafficRegulationLayer =
    L.layerGroup();



//==================================================
// 地図レイヤー切替
//==================================================

L.control.layers(

    {

        "🗺 標準地図":
            osm,

        "🛰 航空写真":
            satellite,

        "⛰ 地形図":
            terrain,

        "🇯🇵 国土地理院":
            gsi,

        "🚒 防災淡色地図":
            gsiPale

    },

    {

        "🚧 交通規制":
            trafficRegulationLayer

    }

).addTo(map);



//==================================================
// 交通規制受信
//==================================================

socket.on(
    "trafficRegulations",
    (regulations)=>{

        trafficRegulationLayer
            .clearLayers();


        if(!Array.isArray(regulations)){

            return;

        }


        regulations.forEach(
            regulation=>{

                if(
                    regulation.lat == null ||
                    regulation.lon == null
                ){

                    return;

                }


                const marker =
                    L.marker(
                        [
                            regulation.lat,
                            regulation.lon
                        ],
                        {

                            icon:
                                L.divIcon({

                                    className:
                                        "trafficIcon",

                                    html:"🚧",

                                    iconSize:
                                        [30,30],

                                    iconAnchor:
                                        [15,15]

                                })

                        }
                    );


                marker.bindPopup(`

                    <b>🚧 交通規制</b>

                    <hr>

                    路線：
                    ${regulation.route || "-"}

                    <br>

                    規制：
                    ${regulation.type || "-"}

                    <br>

                    原因：
                    ${regulation.reason || "-"}

                    <br>

                    区間：
                    ${regulation.section || "-"}

                    <br>

                    開始：
                    ${regulation.start || "-"}

                `);


                trafficRegulationLayer
                    .addLayer(marker);

            }
        );

    }
);



//==================================================
// GPS開始
//==================================================

function startGPS(){

    if(!registered){

        alert(
            "先にユーザー登録してください"
        );

        return;

    }


    localStorage.setItem(
        "gpsRunning",
        "true"
    );


    if(watchID !== null){

        return;

    }


    gpsTimer =
        setInterval(()=>{

            navigator.geolocation
                .getCurrentPosition(

                    pos=>{

                        sendLocation(

                            pos.coords.latitude,

                            pos.coords.longitude

                        );

                    },

                    err=>{

                        console.log(
                            "GPSタイマーエラー",
                            err
                        );

                    }

                );

        },30000);


    watchID =
        navigator.geolocation
            .watchPosition(

                pos=>{

                    const lat =
                        pos.coords.latitude;


                    const lon =
                        pos.coords.longitude;


                    if(lastLat === 0){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat = lat;

                        lastLon = lon;

                        lastSendTime =
                            Date.now();


                        return;

                    }


                    const distance =
                        getDistance(
                            lastLat,
                            lastLon,
                            lat,
                            lon
                        );


                    const now =
                        Date.now();


                    if(
                        distance >=
                            MOVE_DISTANCE
                        ||
                        now-lastSendTime >=
                            SEND_INTERVAL
                    ){

                        sendLocation(
                            lat,
                            lon
                        );


                        lastLat = lat;

                        lastLon = lon;

                        lastSendTime = now;

                    }

                },


                err=>{

                    console.log(
                        "GPSエラー",
                        err
                    );

                },


                {

                    enableHighAccuracy:true,

                    timeout:10000,

                    maximumAge:0

                }

            );

}



//==================================================
// GPS送信
//==================================================

function sendLocation(
    lat,
    lon
){

    const utm =
        proj4(
            "EPSG:4326",

            "+proj=utm +zone=52 +south +datum=WGS84",

            [lon,lat]
        );


    const utmE =
        Math.round(
            utm[0]
        );


    const utmN =
        Math.round(
            utm[1]
        );


    [
        "name",
        "water",
        "fuel",
        "destination",
        "iconType"
    ].forEach(key=>{

        localStorage.setItem(
            key,
            document.getElementById(
                key
            ).value
        );

    });


    document.getElementById(
        "gpsStatus"
    ).innerHTML =
        "🟢 GPS稼働中";


    document.getElementById(
        "lastSend"
    ).innerHTML =
        "最終送信：" +
        new Date()
        .toLocaleTimeString();


    if(!registered){

        return;

    }


    const iconType =
        normalizeIconType(
            document.getElementById(
                "iconType"
            ).value
        );


    socket.emit(
        "location",
        {

            name:
                document.getElementById(
                    "name"
                ).value,

            lat:lat,

            lon:lon,

            utmZone:"52S",

            utmE:utmE,

            utmN:utmN,

            water:Number(
                document.getElementById(
                    "water"
                ).value
            ),

            fuel:Number(
                document.getElementById(
                    "fuel"
                ).value
            ),

            destination:
                document.getElementById(
                    "destination"
                ).value,

            iconType:iconType

        }
    );

}

//==================================================
// 距離計算
//==================================================

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;


    const dLat =
        (lat2-lat1)
        *
        Math.PI/180;


    const dLon =
        (lon2-lon1)
        *
        Math.PI/180;


    const a =
        Math.sin(dLat/2)**2
        +
        Math.cos(
            lat1*Math.PI/180
        )
        *
        Math.cos(
            lat2*Math.PI/180
        )
        *
        Math.sin(dLon/2)**2;


    return R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

}

//==================================================
// アイコン
//==================================================

function createIcon(type){

    type =
        normalizeIconType(type);


    let image;


    switch(type){

        case "1":

            image =
                "/icon/person.png";

            break;


        case "2":

            image =
                "/icon/vehicle_small.png";

            break;


        case "3":

            image =
                "/icon/vehicle_medium.png";

            break;


        case "4":

            image =
                "/icon/vehicle_large.png";

            break;


        default:

            image =
                "/icon/person.png";

            break;

    }


    return L.icon({

        iconUrl:image,

        iconSize:[60,60],

        iconAnchor:[30,60],

        popupAnchor:[0,-70]

    });

}

//==================================================
// 地点登録
//==================================================

function addPoint(){

    const pointName =
        document.getElementById(
            "pointName"
        )
        .value
        .trim();


    if(pointName === ""){

        alert(
            "地点名を入力してください"
        );

        return;

    }


    if(!navigator.geolocation){

        alert(
            "GPSが利用できません"
        );

        return;

    }


    navigator.geolocation
        .getCurrentPosition(

            pos=>{

                const lat =
                    pos.coords.latitude;


                const lon =
                    pos.coords.longitude;


                const utm =
                    proj4(
                        "EPSG:4326",

                        "+proj=utm +zone=52 +south +datum=WGS84",

                        [lon,lat]
                    );


                document.getElementById(
                    "pointLat"
                ).textContent =
                    lat.toFixed(6);


                document.getElementById(
                    "pointLon"
                ).textContent =
                    lon.toFixed(6);


                document.getElementById(
                    "pointUtmZone"
                ).textContent =
                    "52S";


                document.getElementById(
                    "pointUtmE"
                ).textContent =
                    Math.round(
                        utm[0]
                    );


                document.getElementById(
                    "pointUtmN"
                ).textContent =
                    Math.round(
                        utm[1]
                    );


                socket.emit(
                    "addPoint",
                    {

                        name:pointName,

                        type:
                            document.getElementById(
                                "pointType"
                            ).value,

                        lat:lat,

                        lon:lon

                    }
                );


                document.getElementById(
                    "pointName"
                ).value = "";

            },

            err=>{

                alert(
                    "現在位置を取得できませんでした"
                );

            }

        );

}

    if(!marker){

    }


    map.setView(
        marker.getLatLng(),
        16
    );


    marker.openPopup();

//==================================================
// 最終更新時間
//==================================================

function timeAgo(timestamp){

    if(!timestamp){

        return "-";

    }


    const diff =
        Date.now() -
        Number(timestamp);


    if(diff < 60000){

        return "1分未満";

    }


    const minutes =
        Math.floor(
            diff / 60000
        );


    if(minutes < 60){

        return minutes +
            "分前";

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24){

        return hours +
            "時間前";

    }


    const days =
        Math.floor(
            hours / 24
        );


    return days +
        "日前";

}
