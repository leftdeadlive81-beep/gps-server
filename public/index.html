<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>現在位置自動共有君 Version 2.2</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>





<style>

body{
    font-family:sans-serif;
    margin:6px;
    background:#f5f5f5;
    font-size:16px;
}


h2{
    font-size:22px;
    text-align:center;
    margin:8px;
}


h3{
    font-size:18px;
    margin:5px 0;
}


.card{

    background:white;
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
    box-shadow:0 1px 3px #aaa;

}


input,select{

    width:95%;
    font-size:18px;
    padding:6px;
    margin:3px;
    border-radius:6px;
    border:1px solid #888;

}


button{

    font-size:18px;
    padding:8px;
    margin:4px;
    width:48%;
    border-radius:8px;

}


#gpsStatus{

    font-size:18px;
    font-weight:bold;

}


#lastSend{

    font-size:16px;

}


#map{

    height:65vh;
    width:100%;
    border-radius:10px;

}


.inputRow{

    display:flex;
    gap:5px;

}


.inputRow input{

    width:45%;

}


.inputRow select{

    width:45%;
    font-size:18px;
    padding:6px;

}


#destination{

    width:95%;

}






/*=====================
 Version 2.3
 ユーザー1行表示
=====================*/

.userHeader{

display:grid;

grid-template-columns:
50px 1fr 60px 60px 70px;

background:#ddd;

font-weight:bold;

font-size:13px;

padding:6px 4px;

}


.userRow{

display:grid;

grid-template-columns:
50px 1fr 60px 60px 70px;

align-items:center;

background:white;

border-bottom:1px solid #ccc;

padding:10px 4px;

font-size:14px;

cursor:pointer;

}


.userRow:active{

background:#cce5ff;

}

.userRow:nth-child(even){

background:#f7f7f7;

}


.userDetail{

display:none;

background:#eeeeee;

padding:8px;

font-size:13px;

border-bottom:1px solid #ccc;

}









/*=====================
選択中マーカー点滅
=====================*/

.selected-marker{

animation:markerBlink 0.6s infinite;

}


@keyframes markerBlink{

0%{

filter:brightness(2);

}


50%{

filter:brightness(0.5);

}


100%{

filter:brightness(2);

}

}


/*=====================
 GPSボタン横並び
=====================*/

.buttonRow{

display:flex;

gap:6px;

}


.buttonRow button{

flex:1;

width:auto;

}



/*=====================
 操作ボタン
=====================*/

.gpsButton{

background:#4caf50;

color:white;

font-weight:bold;

}


.reportButton{

background:#2196f3;

color:white;

font-weight:bold;

}


.buttonRow{

display:flex;

gap:6px;

}


.buttonRow button{

flex:1;

width:auto;

}



/*=====================
 クロノロジー
=====================*/

.timelineItem{

background:white;

border-bottom:1px solid #ccc;

padding:8px;

font-size:14px;

}


.timelineTime{

font-size:12px;

color:#666;

font-weight:bold;

}


.timelineMessage{

font-size:15px;

}


/*=====================
 クロノロジー入力
=====================*/

#chronoMessage{

width:70%;

}


#timeline button{

width:auto;

font-size:14px;AC

}


.buttonRow button{
    flex:1;
    width:auto;
    white-space:nowrap;
    font-size:16px;
}




.userLabel{

background:white;

border:1px solid #555;

border-radius:5px;

padding:3px 6px;

font-size:14px;

font-weight:bold;

color:black;

}




.userLabel{
    background:white;
    border:1px solid #555;
    border-radius:5px;
    padding:3px 6px;
    font-size:14px;
    font-weight:bold;
    color:black;
}







</style>


</head>


<body>


<h2>
現在位置自動共有君
</h2>


<details class="card">

<summary>
👤 使用者情報
</summary>


<br>


<div class="inputRow">

<input 
id="name"
value="隊員A"
placeholder="名前">


<select id="iconType">

<option value="person">
👤隊員
</option>

<option value="vehicle">
🚙車両
</option>

</select>

</div>



<div class="inputRow">

<input 
id="water"
type="number"
value="100"
placeholder="💧水量">


<input 
id="fuel"
type="number"
value="100"
placeholder="⛽燃料">

</div>



<input

<input
id="destination"
value=""
placeholder="📍次の目的地">


<div class="buttonRow">

<button
onclick="registerUser()">

👤 ユーザー登録

</button>

</div>


<div id="registerStatus">

未登録

</div>


</details>




<div class="card">



<div class="buttonRow">


<button 
class="gpsButton"
onclick="startGPS()">

📡 GPS開始

</button>


<button 
class="reportButton"
onclick="updateStatus()">

🔄 現在地報告

</button>


</div>



<div id="gpsStatus">

🔴 GPS停止中

</div>



<div id="lastSend">

最終送信：-

</div>


</div>



<hr>


<div id="map"></div>





<details class="card">

<summary>
📍地点登録
</summary>


<br>


<input id="pointName" 
placeholder="地点名（例：CP1、給水所）">


<select id="pointType">

<option value="CP">
🏳 指揮所(CP)
</option>

<option value="water">
💧給水所
</option>

<option value="supply">
📦補給地点
</option>

<option value="point">
📍その他
</option>

</select>


<button onclick="addPoint()">
📍登録
</button>


</details>


<details class="card">

<summary>
📋 クロノロジー
</summary>


<br>

<div class="inputRow">

<input 
id="chronoMessage"
placeholder="活動内容を入力">

<button 
onclick="sendChronology()">

送信

</button>

</div>


<hr>


<div id="timeline">

</div>


</details>




<h3>
👥 接続ユーザー
</h3>




<div class="userHeader">

<div>状態</div>
<div>名前</div>
<div>💧水</div>
<div>⛽燃料</div>
<div>最終</div>


</div>


<div id="users"></div>




<script>


const socket = io();



//=====================
// Socket接続
//=====================


socket.on("connect",()=>{


console.log("サーバー接続");


document.getElementById("gpsStatus").innerHTML=
"🟢 サーバー接続";


if(watchID!==null){

navigator.geolocation.getCurrentPosition(

pos=>{

sendLocation(
pos.coords.latitude,
pos.coords.longitude
);

}

);

}


});



socket.on("disconnect",()=>{


document.getElementById("gpsStatus").innerHTML=
"🔴 サーバー切断";


});





//=====================
// 保存データ復元
//=====================


window.onload=function(){


[
"name",
"water",
"fuel",
"destination",
"iconType"

].forEach(key=>{


let value=localStorage.getItem(key);


if(value){

document.getElementById(key).value=value;

}


});



if(localStorage.getItem("gpsRunning")==="true"){


setTimeout(()=>{

startGPS();

},1000);


}


};





//=====================
// 地図
//=====================


const map=L.map('map')
.setView(
[32.803,130.707],
13
);



//=====================
// ズームによる名前表示制御
//=====================

map.on("zoomend",()=>{

    let zoom = map.getZoom();


    Object.values(markers).forEach(marker=>{


        if(zoom < 13){

            // 広域表示：名前非表示
            marker.closeTooltip();


        }else{

            // 詳細表示：名前表示
            marker.openTooltip();


        }


    });


});







L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'OpenStreetMap'

}

).addTo(map);




let markers={};

let pointMarkers={};



//=====================
// クロノロジー
//=====================

let chronology=[];



socket.on(
"chronology",
(data)=>{


chronology=data;


renderChronology();


});








function addChronology(message){


socket.emit(

"addChronology",

{

message:message

}

);


}



function renderChronology(){

let html="";


chronology.forEach(item=>{


html+=`

<div class="timelineItem">

<div class="timelineTime">
${item.time}
</div>


<div class="timelineMessage">
${item.message}
</div>

</div>

`;

});


document.getElementById("timeline").innerHTML=html;

}




let lastLat=0;

let lastLon=0;

let lastSendTime=0;


const SEND_INTERVAL=30000;

const MOVE_DISTANCE=10;


let watchID=null;

let gpsTimer=null;



//=====================
// 地点登録
//=====================


let selectedPointLat=null;

let selectedPointLon=null;



map.on("click",function(e){


selectedPointLat=e.latlng.lat;

selectedPointLon=e.latlng.lng;


alert(

"地点候補\n"+
"緯度:"+selectedPointLat.toFixed(6)+
"\n経度:"+selectedPointLon.toFixed(6)

);


});




function addPoint(){


if(selectedPointLat===null){

alert("先に地図をクリックしてください");

return;

}



let name =
document.getElementById("pointName")
.value
.trim();



if(name===""){

alert("地点名を入力してください");

return;

}



let marker=L.marker(

[
selectedPointLat,
selectedPointLon
],

{

icon:L.icon({

iconUrl:"/icon/point.png",


iconSize:[60,60],
iconAnchor:[30,60],

popupAnchor: [0,-50]


})

}

)

.addTo(map);



marker.bindPopup(

`
<b>📍${name}</b>

<br>

${selectedPointLat.toFixed(6)}

<br>

${selectedPointLon.toFixed(6)}

`

);



pointMarkers[name]=marker;




// サーバーへ保存

socket.emit(

"addPoint",

{

name:name,

type:
document.getElementById("pointType").value,

lat:selectedPointLat,

lon:selectedPointLon

}

);



// 入力欄クリア

document.getElementById("pointName").value="";



alert(

name+"を登録しました"

);


}



//=====================
// GPS開始
//=====================


function startGPS(){


localStorage.setItem(
"gpsRunning",
"true"
);



if(watchID!==null){

alert("GPSはすでに開始しています");

return;

}



gpsTimer=setInterval(()=>{


console.log(
"30秒タイマー動作"
);



navigator.geolocation.getCurrentPosition(


pos=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


},


error=>{

console.log(
"GPS取得失敗",
error
);

}


);



},30000);







watchID=navigator.geolocation.watchPosition(


pos=>{


let lat=pos.coords.latitude;

let lon=pos.coords.longitude;



if(lastLat===0){



sendLocation(

lat,

lon

);



lastLat=lat;

lastLon=lon;

lastSendTime=Date.now();



return;


}





let distance=getDistance(

lastLat,

lastLon,

lat,

lon

);



let now=Date.now();



if(

distance>=MOVE_DISTANCE ||

now-lastSendTime>=SEND_INTERVAL

){



sendLocation(

lat,

lon

);



lastLat=lat;

lastLon=lon;


lastSendTime=now;


}



},



error=>{


console.log(error);


alert(
"位置情報取得失敗"
);


},



{


enableHighAccuracy:true,


timeout:10000,


maximumAge:0



}



);


}







//=====================
// 状態送信
//=====================


function sendLocation(

lat,

lon

){



//=====================
// UTM変換
//=====================


let utm = proj4(

'EPSG:4326',


'+proj=utm +zone=52 +south +datum=WGS84',


[

lon,

lat

]

);



let utmE=Math.round(
utm[0]
);


let utmN=Math.round(
utm[1]
);



console.log(

"UTM",

utmE,

utmN

);







//=====================
// 保存
//=====================


[

"name",

"water",

"fuel",

"destination",

"iconType"

].forEach(key=>{


localStorage.setItem(

key,

document.getElementById(key).value

);


});







document.getElementById("gpsStatus")

.innerHTML=


"🟢 GPS稼働中";





document.getElementById("lastSend")

.innerHTML=


"最終送信："+

new Date()

.toLocaleTimeString();












socket.emit(

"location",

{


name:

document.getElementById("name").value,



lat:lat,



lon:lon,



utmZone:

"52S",



utmE:

utmE,



utmN:

utmN,




water:

Number(

document.getElementById("water").value

),




fuel:

Number(

document.getElementById("fuel").value

),




destination:

document.getElementById("destination").value,




// アイコン種類

iconType:

document.getElementById("iconType").value



}



);



}


//=====================
// クロノロジー手動送信
//=====================

function sendChronology(){


let msg =
document.getElementById(
"chronoMessage"
).value.trim();


if(msg===""){

alert("内容を入力してください");

return;

}



socket.emit(

"addChronology",

{

message:msg,

user:
document.getElementById("name").value

}

);



document.getElementById(
"chronoMessage"
).value="";


}





//=====================
// 状態更新
//=====================


function updateStatus(){


navigator.geolocation.getCurrentPosition(


pos=>{


sendLocation(

pos.coords.latitude,

pos.coords.longitude

);


}



);


}








//=====================
// 距離計算
//=====================


function getDistance(

lat1,

lon1,

lat2,

lon2

){



const R=6371000;



const dLat=

(lat2-lat1)

*

Math.PI/180;



const dLon=

(lon2-lon1)

*

Math.PI/180;





const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)**2;



return R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);



}

//=====================
// 表示補助
//=====================


function statusText(user){


if(user.online){

return "🟢 ON";

}
else{

return "🔴 OFF";

}


}



function formatTime(t){


if(!t)

return "不明";


return new Date(t)

.toLocaleString();


}


function timeAgo(t){


if(!t){

return "不明";

}


let diff =
Date.now() - t;



let sec =
Math.floor(diff / 1000);



if(sec < 60){

return sec + "秒前";

}



let min =
Math.floor(sec / 60);



if(min < 60){

return min + "分前";

}



let hour =
Math.floor(min / 60);



return hour + "時間前";


}



//=====================
// アイコン設定
//=====================


function createIcon(type){


let image;



if(type==="vehicle"){


image="/icon/vehicle.png";


}

else{


image="/icon/person.png";


}



return L.icon({

iconUrl:image,

iconSize:[60,60],

iconAnchor:[30,60],

popupAnchor:[0,-70]

});


}






//=====================
// ユーザー位置へ移動
//=====================


function focusUser(name){


if(!markers[name]){

return;

}



let marker=markers[name];


let pos=marker.getLatLng();



map.setView(

[

pos.lat,

pos.lng

],

17,

{

animate:true

}

);



marker.openPopup();




//=====================
// 選択マーカー点滅
//=====================


let element=marker.getElement();


if(element){


element.classList.add(

"selected-marker"

);



setTimeout(()=>{


element.classList.remove(

"selected-marker"

);


},5000);



}



}






//=====================
// ユーザー情報受信
//=====================


socket.on(

"locations",

(users)=>{



let html="";




// 消えたユーザー削除

Object.keys(markers).forEach(

name=>{


if(!users[name]){


map.removeLayer(

markers[name]

);


delete markers[name];


}


}

);







Object.keys(users).forEach(

name=>{



let user=users[name];



let icon=createIcon(

user.iconType

);





if(markers[name]){


markers[name].setLatLng(

[

user.lat,

user.lon

]

);



markers[name].setIcon(icon);



markers[name].setTooltipContent(
user.name
);



}

else{


markers[name]=L.marker(

[

user.lat,

user.lon

],

{

icon:icon

}

)

.addTo(map)

.bindTooltip(

user.name,

{

permanent:true,

direction:"top",

offset:[0,-60],

className:"userLabel"

}

);


}






markers[name].bindPopup(

`

<b>${user.name}</b>

<br>

${statusText(user)}

<hr>

💧水量：
${user.water}

<br>

⛽燃料：
${user.fuel}

<br>

📍目的地：
${user.destination || "-"}

<br><br>

UTM ${user.utmZone || "52S"}

<br>

E:${user.utmE || ""}

<br>

N:${user.utmN || ""}

<br><br>

🕒
${formatTime(user.lastUpdate)}

`

);







html+=`

<div class="userRow"
onclick="focusUser('${user.name}')">

<div>
${statusText(user)}
</div>

<div>
${user.name}
</div>

<div>
${user.water}
</div>

<div>
${user.fuel}
</div>

<div>
${timeAgo(user.lastUpdate)}
</div>

</div>

`;



}

);



document.getElementById("users")

.innerHTML=html;



}

);





//=====================
// 地点受信
//=====================

//=====================
// 地点受信
//=====================

socket.on(
"points",
(points)=>{


console.log("受信points", points);


if(!points){
    return;
}



Object.keys(points).forEach(

name=>{


let p=points[name];


// 既存地点削除
if(pointMarkers[name]){

    map.removeLayer(pointMarkers[name]);

}



let marker=L.marker(

[
p.lat,
p.lon
],

{

icon:L.icon({

iconUrl:"/icon/point.png",

iconSize:[60,60],

iconAnchor:[30,60],

popupAnchor:[0,-50]

})

}

)

.addTo(map);



marker.bindPopup(

`

<b>📍${name}</b>

<br>

${p.lat.toFixed(6)}

<br>

${p.lon.toFixed(6)}

`

);



pointMarkers[name]=marker;



}

);


}

);




function toggleDetail(name){

let box=document.getElementById(
"detail-"+name
);


if(
box.style.display==="block"
){

box.style.display="none";

}
else{

box.style.display="block";

}

}



</script>


</body>

</html>
